<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="cache-control" content="no-cache">
    <title>Medical Research Assistant</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; }
      * { box-sizing: border-box; }
      input::placeholder, textarea::placeholder { color: rgba(160, 196, 217, 0.5); }
      input:focus, textarea:focus, select:focus {
        outline: none; border-color: #4a9eff; box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.15);
      }
      button:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(74, 158, 255, 0.25); }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .spin { animation: spin 1s linear infinite; }
      @keyframes mrt-shimmer {
        0%   { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      .mrt-shimmer-bar {
        background-size: 200% 100%;
        animation: mrt-shimmer 2.2s linear infinite;
      }
      @keyframes mrt-pulse-dot {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50%      { opacity: 1;    transform: scale(1); }
      }
      .mrt-pulse-dot { animation: mrt-pulse-dot 1.2s ease-in-out infinite; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: rgba(15, 32, 39, 0.5); }
      ::-webkit-scrollbar-thumb { background: rgba(74, 158, 255, 0.4); border-radius: 5px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(74, 158, 255, 0.6); }
      tbody tr:hover { background: rgba(74, 158, 255, 0.05); }
      a { color: #6ec1ff; }
      a:hover { color: #9fd4ff; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-presets="env,react">
      const { useState, useRef, useEffect, useMemo } = React;

      const Activity = mkIcon(<polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />);
      const Brain = mkIcon(<>

      const Loader = mkIcon(<>

        <line x1="4.93" y1="4.93" x2="7.76" y2="7.76" />

      const ExternalLink = mkIcon(<>

      const XCircle = mkIcon(<>

      const Scales = mkIcon(<>

      const Lightbulb = mkIcon(<>

        <line x1="15" y1="12" x2="3" y2="12" />

      const LogOut = mkIcon(<>
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </>);
      const Settings = mkIcon(<>
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </>);
      const HelpCircle = mkIcon(<>
        <circle cx="12" cy="12" r="10" />
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
        <line x1="12" y1="17" x2="12.01" y2="17" />
      </>);
      const ChevronDown = mkIcon(<>
        <polyline points="6 9 12 15 18 9" />
      </>);
      const ChevronUp = mkIcon(<>
        <polyline points="18 15 12 9 6 15" />
      </>);
      const AlertTriangle = mkIcon(<>
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
        <line x1="12" y1="9" x2="12" y2="13" />
        <line x1="12" y1="17" x2="12.01" y2="17" />
      </>);

      /* ==================== Theme ==================== */
      // Palette tuned to feel like modern AI tools (ChatGPT / Claude / Perplexity):
      // deep desaturated background, soft blue accent, plenty of room to breathe.
      // Previous palette was a brighter 3-stop teal gradient that read as
      // dashboardy; this darker slate+hint-of-teal looks more "medical serious".
      const theme = {
        bg: 'radial-gradient(ellipse at top, #0e1f2a 0%, #07141c 55%, #050e14 100%)',
        panel: 'rgba(255, 255, 255, 0.035)',
        panelSolid: 'rgba(11, 31, 42, 0.92)',
        border: 'rgba(148, 183, 210, 0.14)',
        accent: '#4a9eff',
        text: '#e8f4f8',
        textDim: '#9ab3c2',
        green: '#6ee7b7', yellow: '#fbbf24', red: '#f87171'
      };
      const panelStyle = {
        background: theme.panel, borderRadius: 12, border: `1px solid ${theme.border}`,
        padding: '1.5rem', backdropFilter: 'blur(10px)'
      };
      const inputStyle = {
        padding: '0.75rem', background: 'rgba(15, 32, 39, 0.5)',
        border: '1px solid rgba(74, 158, 255, 0.3)', borderRadius: 8,
        color: theme.text, fontSize: '0.95rem', fontFamily: 'inherit', width: '100%'
      };
      const labelStyle = {
        marginBottom: '0.4rem', color: theme.accent, fontWeight: 600,
        fontSize: '0.85rem', letterSpacing: '0.02em'
      };
      const btn = (variant = 'primary', disabled = false) => ({
        padding: '0.7rem 1.1rem',
        background: disabled ? 'rgba(74, 158, 255, 0.2)'
          : variant === 'primary' ? theme.accent
          : variant === 'ghost' ? 'rgba(74, 158, 255, 0.12)'
          : variant === 'danger' ? '#c53030'
          : 'rgba(74, 158, 255, 0.18)',
        color: variant === 'primary' ? '#fff' : theme.text,
        border: variant === 'ghost' ? '1px solid rgba(74, 158, 255, 0.35)' : 'none',
        borderRadius: 8, cursor: disabled ? 'not-allowed' : 'pointer',
        fontSize: '0.9rem', fontWeight: 600, fontFamily: 'inherit',
        display: 'inline-flex', alignItems: 'center', gap: '0.4rem',
        transition: 'all 0.15s ease'
      });

      /* ==================== Parsers ==================== */
      const collectBlock = (text, startIdx, terminators) => {
        const lines = text.split('\n');
        let cur = lines[startIdx].split(':').slice(1).join(':').trim();
        let next = startIdx + 1;
        while (next < lines.length) {
          const trimmed = lines[next].trim();
          if (terminators.some(t => trimmed.startsWith(t))) break;
          if (trimmed.startsWith('## ')) break;
          if (trimmed) cur += ' ' + trimmed;
          next++;
        }
        return cur;
      };

      const TREATMENT_KEYS = [
        'PROVIDER:', 'TREATMENT:', 'FDA_STATUS:', 'LENGTH_FREQUENCY:',
        'EFFICACY:', 'SAFETY:', 'RISKS:', 'INTERACTIONS:', 'COST:', 'REFERENCES:'
      ];
      const parseTreatments = (text) => {
        const blocks = [];
        const lines = text.split('\n');
        let cur = null;
        lines.forEach((line, i) => {
          const t = line.trim();
          const key = TREATMENT_KEYS.find(k => t.startsWith(k));
          if (!key) return;
          if (key === 'PROVIDER:') {
            if (cur) blocks.push(cur);
            cur = { _type: 'treatment' };
          }
          if (!cur) return;
          const field = key.replace(':', '').toLowerCase();
          cur[field] = collectBlock(text, i, TREATMENT_KEYS);
          if (field === 'efficacy' || field === 'safety') {
            const num = cur[field].match(/(\d{1,3})\s*%/);
            cur[field + '_pct'] = num ? parseInt(num[1]) : null;
            cur[field + '_note'] = cur[field];
          }
        });
        if (cur) blocks.push(cur);
        return blocks.sort((a, b) => (b.efficacy_pct || 0) - (a.efficacy_pct || 0));
      };

      const REPURPOSE_KEYS = [
        'CANDIDATE:', 'CLASS:', 'APPROVED_FOR:', 'MECHANISM_TARGET:', 'REPURPOSE_RATIONALE:',
        'EVIDENCE_STRENGTH:', 'SUPPORTING_EVIDENCE:', 'EFFICACY_HYPOTHESIS:', 'SAFETY:',
        'CONFIDENCE:', 'PATIENT_SPECIFIC_RISKS:', 'HOW_TO_DISCUSS_WITH_DOCTOR:'
      ];
      const parseCandidates = (text) => {
        const out = [];
        const lines = text.split('\n');
        let cur = null;
        lines.forEach((line, i) => {
          const t = line.trim();
          const key = REPURPOSE_KEYS.find(k => t.startsWith(k));
          if (!key) return;
          if (key === 'CANDIDATE:') { if (cur) out.push(cur); cur = {}; }
          if (!cur) return;
          const field = key.replace(':', '').toLowerCase();
          cur[field] = collectBlock(text, i, REPURPOSE_KEYS);
          if (field === 'efficacy_hypothesis' || field === 'safety' || field === 'confidence') {
            const num = cur[field].match(/(\d{1,3})\s*%/);
            cur[field + '_pct'] = num ? parseInt(num[1]) : null;
          }
        });
        if (cur) out.push(cur);
        return out.sort((a, b) =>
          (b.confidence_pct || b.efficacy_hypothesis_pct || 0) -
          (a.confidence_pct || a.efficacy_hypothesis_pct || 0)
        );
      };

      const TRIAL_KEYS = [
        'TRIAL:', 'NCT:', 'URL:', 'PHASE:', 'STATUS:', 'ACCEPTING:', 'PLACEBO:',
        'TREATMENT_ONLY:', 'COUNTRY:', 'OVERSIGHT:', 'DESIGNATIONS:',
        'FIT_FOR_PATIENT:', 'HARM_RISK:', 'INTERACTIONS:', 'LOCATION_CONTACT:', 'SUMMARY:'
      ];
      const parseTrialBlocks = (text) => {
        const out = [];
        const lines = text.split('\n');
        let cur = null;
        lines.forEach((line, i) => {
          const t = line.trim();
          const key = TRIAL_KEYS.find(k => t.startsWith(k));
          if (!key) return;
          if (key === 'TRIAL:') { if (cur) out.push(cur); cur = {}; }
          if (!cur) return;
          const field = key.replace(':', '').toLowerCase();
          cur[field] = collectBlock(text, i, TRIAL_KEYS);
          if (field === 'fit_for_patient' || field === 'harm_risk') {
            const num = cur[field].match(/(\d{1,3})\s*%/);
            cur[field + '_pct'] = num ? parseInt(num[1]) : null;
          }
        });
        if (cur) out.push(cur);
        return out;
      };

      const parseReferences = (text) => {
        const urlRe = /(https?:\/\/[^\s)]+)(?:\s*[-—:]\s*["“]([^"”]+)["”])?/g;
        const refs = [];
        const seen = new Set();
        let m;
        while ((m = urlRe.exec(text)) !== null) {
          const url = m[1].replace(/[.,;)]+$/, '');
          if (seen.has(url)) continue;
          seen.add(url);
          refs.push({ url, quote: m[2] || '' });
        }
        return refs;
      };

      /* ==================== Color helpers ==================== */
      const ratingColor = (n) => {
        if (n == null) return theme.textDim;
        if (n >= 70) return theme.green;
        if (n >= 40) return theme.yellow;
        return theme.red;
      };

      /* ==================== Storage ==================== */
      const loadLS = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
      const saveLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

      /* ============================================================== */
      /* =========================== APP ============================== */
      /* ============================================================== */
      const App = () => {
        const [tab, setTab] = useState('profile');
        const [patient, setPatient] = useState(() => loadLS('mrt_patient', {
          condition: 'Idiopathic Pulmonary Fibrosis', stage: '',
          age: '', gender: '', weight: '',
          smoking: '', exercise: '',
          diagnoses: '', medications: '', symptoms: '', labWork: '', scans: ''
        }));
        const [audience, setAudience] = useState(() => loadLS('mrt_audience', 'layperson'));
        const [acceptedHipaa, setAcceptedHipaa] = useState(() => loadLS('mrt_hipaa', false));
        const [user, setUser] = useState(() => loadStoredUser());

        const [researchText, setResearchText] = useState('');
        const [repurposeText, setRepurposeText] = useState('');
        const [trialsText, setTrialsText] = useState('');
        const [trialsData, setTrialsData] = useState(null);
        const [recordsResult, setRecordsResult] = useState(null);
        const [chatHistory, setChatHistory] = useState([]);
        const [userQuery, setUserQuery] = useState('');
        const [busy, setBusy] = useState(null);

        // Cross-AI audit results per mode — a second model independently
        // audits Claude's output against the same evidence pack.
        const [validations, setValidations] = useState({
          research: null, repurpose: null, trials: null
        });
        const [evidenceSummary, setEvidenceSummary] = useState(null);
        const [evidencePack, setEvidencePack] = useState([]);
        const [dossier, setDossier] = useState(null);

        // Deep-research progress state. When runResearch('research'|'repurpose')
        // is in flight, `progress.active === true` and `progress.steps` tracks
        // each stage of the pipeline (dossier, evidence, trials, synthesis,
        // validation). The DeepResearchProgress component renders a ChatGPT-
        // style stepped progress bar driven off this shape.
        const [progress, setProgress] = useState(null);
        const updateStep = (id, patch) => setProgress(p => {
          if (!p) return p;
          return {
            ...p,
            steps: p.steps.map(s => s.id === id ? { ...s, ...patch } : s)
          };
        });

        useEffect(() => saveLS('mrt_patient', patient), [patient]);
        useEffect(() => saveLS('mrt_audience', audience), [audience]);
        useEffect(() => saveLS('mrt_hipaa', acceptedHipaa), [acceptedHipaa]);

        /* -------- Derived / parsed data -------- */
        const treatments = useMemo(() => parseTreatments(researchText), [researchText]);
        const candidates = useMemo(() => parseCandidates(repurposeText), [repurposeText]);
        const trialBlocks = useMemo(() => parseTrialBlocks(trialsText), [trialsText]);
        const references = useMemo(() => {
          const all = [
            ...parseReferences(researchText),
            ...parseReferences(repurposeText),
            ...parseReferences(trialsText)
          ];
          const map = new Map();
          all.forEach(r => { if (!map.has(r.url)) map.set(r.url, r); });
          return [...map.values()];
        }, [researchText, repurposeText, trialsText]);

        /* -------- Actions -------- */
        const runResearch = async (mode, extra = {}) => {
          // Research / Repurpose / Trials still require a condition (they
          // do a full 16-section analysis that's meaningless without one).
          // Chat mode is allowed to start cold — the backend will detect
          // a disease name in the user's first message.
          if (mode !== 'chat' && !patient.condition.trim()) {
            alert('Please enter a primary condition in the Patient Profile tab first.');
            setTab('profile');
            return;
          }
          setBusy(mode);
          // Seed deep-research progress for research/repurpose (the heavy,
          // multi-phase modes). Chat / trials-analysis stay lightweight and
          // just use the inline spinner.
          const deepMode = (mode === 'research' || mode === 'repurpose');
          if (deepMode) {
            setProgress({
              active: true,
              mode,
              startedAt: Date.now(),
              steps: [
                { id: 'dossier',  label: 'Build disease dossier',
                  desc: 'Canonical name, synonyms, MeSH, top centers, landmark trials.',
                  status: 'running' },
                { id: 'evidence', label: 'Pull peer-reviewed evidence',
                  desc: 'PubMed · Europe PMC · OpenAlex · Cochrane · openFDA · Unpaywall.',
                  status: 'running' },
                { id: 'trials',   label: 'Scan ClinicalTrials.gov',
                  desc: 'Recruiting + expanded-access + open-label extension fan-out.',
                  status: 'running' },
                { id: 'synth',    label: 'Synthesise with Claude Sonnet',
                  desc: '16-section grounded analysis tuned to your profile.',
                  status: 'pending' },
                { id: 'validate', label: 'Cross-AI fact-check (if configured)',
                  desc: 'Second model audits every claim against the evidence pack.',
                  status: 'pending' }
              ]
            });
          }
          // Helper: POST /api/research with robust non-JSON error handling.
          // Vercel's 60s serverless cap, when hit, returns a plain-text error
          // page (FUNCTION_INVOCATION_TIMEOUT) which is NOT JSON — we detect
          // that specifically and surface a friendlier message instead of
          // the browser's cryptic 'Unexpected token A ... is not valid JSON'.
          const callResearch = async (payload) => {
            const res = await fetch('/api/research', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const raw = await res.text();
            let data;
            try { data = JSON.parse(raw); }
            catch {
              const isTimeout = /FUNCTION_INVOCATION_TIMEOUT|An error occurred with your deployment/i.test(raw);
              throw new Error(
                isTimeout
                  ? `Step timed out (60s cap). The ${payload.phase || 'full'} phase is too heavy for the free tier — try again, it'll usually pass on the second attempt because the dossier and upstream queries cache.`
                  : `Server returned non-JSON (HTTP ${res.status}): ${raw.slice(0, 140)}`
              );
            }
            if (!res.ok) throw new Error(data.error || `Request failed (HTTP ${res.status})`);
            return data;
          };
          try {
            // Two-phase for research + repurpose (fan-out is too heavy to
            // finish alongside Claude synthesis in one 60s slot). Chat and
            // trials stay single-shot — their pipelines are much shorter.
            const useTwoPhase = (mode === 'research' || mode === 'repurpose');
            let data;
            if (useTwoPhase) {
              const gathered = await callResearch({
                mode, patient, audience, phase: 'gather', ...extra
              });
              // Expose the pools in the UI as soon as phase 1 finishes so
              // the user sees dossier / trials / evidence panels populate
              // before Claude's full narrative arrives.
              if (gathered.dossier) setDossier(gathered.dossier);
              if (gathered.evidence) {
                setEvidenceSummary(gathered.evidence);
                setEvidencePack(gathered.evidence.topRanked || []);
              }
              // Mark phase-1 steps as complete with real counts so the UI
              // can show "Pulled 42 peer-reviewed sources" etc.
              updateStep('dossier', {
                status: 'done',
                detail: gathered.dossier?.canonical
                  ? `${gathered.dossier.canonical}${gathered.dossier.cacheHit ? ' (cached)' : ''}`
                  : 'dossier built'
              });
              updateStep('evidence', {
                status: 'done',
                detail: gathered.evidence?.totalUnique
                  ? `${gathered.evidence.totalUnique} unique peer-reviewed sources`
                  : 'evidence pack ready'
              });
              updateStep('trials', {
                status: 'done',
                detail: gathered.trials?.total
                  ? `${gathered.trials.returned || gathered.trials.total} trials (of ${gathered.trials.total} matched)`
                  : 'ClinicalTrials.gov scanned'
              });
              // Phase 2: synthesize. For research mode we split Claude's
              // work into TWO successive calls — each gets its own 60s
              // Vercel slot so Claude always finishes its half without
              // hitting stop_reason=max_tokens mid-section. Repurpose
              // mode still runs a single synth call (its prompt is
              // smaller and the max_tokens budget is enough).
              updateStep('synth', { status: 'running', detail: mode === 'research' ? 'Part 1/2: condition, experts, treatments' : undefined });
              if (mode === 'research') {
                // FRONT half: sections 1-4 (snapshot, centers,
                // treatments, trials & access programs).
                const front = await callResearch({
                  mode, patient, audience,
                  phase: 'synthesize',
                  half: 'front',
                  providedDossier: gathered.dossier,
                  providedEvidence: gathered.evidence,
                  providedTrials: gathered.trials,
                  ...extra
                });
                updateStep('synth', { status: 'running', detail: 'Part 2/2: trials, access, patient plan, red flags' });
                // BACK half: sections 5-8 (repurposing/pipeline,
                // cell/gene, patient plan, red flags).
                const back = await callResearch({
                  mode, patient, audience,
                  phase: 'synthesize',
                  half: 'back',
                  providedDossier: gathered.dossier,
                  providedEvidence: gathered.evidence,
                  providedTrials: gathered.trials,
                  ...extra
                });
                // Stitch the two halves back into a single `data` blob
                // so the rest of the pipeline (text extraction, validation
                // display, evidence pack update) is unchanged.
                const frontText = (front.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
                const backText  = (back.content  || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
                const tokensFront = front.usage?.output_tokens || 0;
                const tokensBack  = back.usage?.output_tokens  || 0;
                data = {
                  ...back,
                  content: [{ type: 'text', text: frontText + '\n\n' + backText }],
                  usage: {
                    input_tokens:  (front.usage?.input_tokens  || 0) + (back.usage?.input_tokens  || 0),
                    output_tokens: tokensFront + tokensBack
                  },
                  dossier:    back.dossier    || front.dossier,
                  evidence:   back.evidence   || front.evidence,
                  trials:     back.trials     || front.trials,
                  validation: back.validation || front.validation || null
                };
              } else {
                // Repurpose mode: single synth call.
                data = await callResearch({
                  mode, patient, audience,
                  phase: 'synthesize',
                  providedDossier: gathered.dossier,
                  providedEvidence: gathered.evidence,
                  providedTrials: gathered.trials,
                  ...extra
                });
              }
              updateStep('synth', {
                status: 'done',
                detail: data.usage?.output_tokens
                  ? `${data.usage.output_tokens.toLocaleString()} tokens generated`
                  : 'analysis ready'
              });
              updateStep('validate', {
                status: data.validation ? 'done' : 'skipped',
                detail: data.validation
                  ? `${data.validation.claims?.length || 0} claims audited`
                  : 'no secondary model configured'
              });
            } else {
              data = await callResearch({ mode, patient, audience, ...extra });
            }
            const text = (data.content || [])
              .filter(b => b.type === 'text').map(b => b.text).join('\n');
            if (mode === 'research') setResearchText(text);
            if (mode === 'repurpose') setRepurposeText(text);
            if (mode === 'trials') setTrialsText(text);
            if (mode === 'chat') {
              setChatHistory(h => [...h, { role: 'assistant', content: text }]);
            }
            if (mode !== 'chat' && data.validation) {
              setValidations((v) => ({ ...v, [mode]: data.validation }));
            }
            if (data.evidence) {
              setEvidenceSummary(data.evidence);
              setEvidencePack(data.evidence.topRanked || []);
            }
            if (data.dossier) {
              setDossier(data.dossier);
            }
          } catch (e) {
            if (deepMode) {
              setProgress(p => p ? ({
                ...p, active: false, error: e.message,
                steps: p.steps.map(s => s.status === 'running' ? { ...s, status: 'error', detail: e.message } : s)
              }) : null);
            }
            alert('Error: ' + e.message);
          } finally {
            setBusy(null);
            if (deepMode) {
              // Fade out the progress card a beat after completion so the
              // user clearly sees every step hit "done" before it hides.
              setTimeout(() => setProgress(p => p ? ({ ...p, active: false }) : null), 600);
            }
          }
        };

        const runTrialsFetch = async (opts) => {
          if (!patient.condition.trim()) {
            alert('Please enter a primary condition in the Patient Profile tab first.');
            setTab('profile');
            return;
          }
          setBusy('trials-fetch');
          try {
            const res = await fetch('/api/trials', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                condition: patient.condition,
                recruitingOnly: opts?.recruitingOnly ?? true,
                treatmentOnly: opts?.treatmentOnly ?? true,
                excludePlacebo: opts?.excludePlacebo ?? false,
                pageSize: 40
              })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Trials fetch failed');
            setTrialsData(data);
          } catch (e) {
            alert('Error: ' + e.message);
          } finally {
            setBusy(null);
          }
        };

        const runTrialsAnalysis = () => {
          if (!trialsData || !trialsData.studies?.length) {
            alert('Fetch trials first (Clinical Trials tab → Fetch Live Trials).');
            return;
          }
          runResearch('trials', { trialsData });
        };

        const sendChat = async () => {
          if (!userQuery.trim()) return;
          const q = userQuery.trim();
          setUserQuery('');
          setChatHistory(h => [...h, { role: 'user', content: q }]);
          setBusy('chat');

          // If the user typed a plausible disease name into chat and their
          // patient profile has no condition yet, auto-populate it from the
          // chat message. Lets them hit "Run Research" afterward without
          // having to retype the condition into the profile tab. We keep the
          // heuristic intentionally loose — the backend's dossier agent will
          // sanity-check whatever we pass in anyway.
          if (!patient.condition?.trim() && q.length <= 80 && !/[?]/.test(q)) {
            const candidate = q.replace(/^(ok|hey|hi|hello|please|tell me about|give me info on|what is|info on)\s+/i, '').trim();
            if (candidate.length >= 2 && candidate.length <= 80) {
              setPatient(p => ({ ...p, condition: candidate }));
            }
          }
          try {
            // Pass the prior analyses + cached evidence pack so chat mode
            // has real context to answer from. Before this, chat ran with no
            // evidence pack and no memory of prior research output, which is
            // why follow-ups often came back as "can't compute" hedges.
            const packForChat = (evidencePack || []).slice(0, 18).map((a) => ({
              id: a.doi || a.pmid || a.id,
              title: a.title,
              journal: a.journal,
              tier: a.journalTier,
              year: a.year,
              sources: a.sources,
              accessLevel: a.accessLevel,
              url: a.pmcUrl || a.pubmedUrl || a.doiUrl || a.oaUrl || a.landingUrl || a.europePmcUrl,
              text: (a.fullText || a.abstract || '').slice(0, 2500)
            })).filter((a) => a.title);

            const res = await fetch('/api/research', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                mode: 'chat', patient, audience, userQuery: q,
                chatHistory: chatHistory.slice(-10),
                priorAnalyses: {
                  research: researchText || undefined,
                  repurpose: repurposeText || undefined,
                  trials: trialsText || undefined
                },
                evidencePack: packForChat
              })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Chat failed');
            const text = (data.content || [])
              .filter(b => b.type === 'text').map(b => b.text).join('\n');
            setChatHistory(h => [...h, { role: 'assistant', content: text }]);
          } catch (e) {
            setChatHistory(h => [...h, { role: 'assistant', content: 'Error: ' + e.message }]);
          } finally {
            setBusy(null);
          }
        };

        return (
          <div style={{ minHeight: '100vh', background: theme.bg,
            fontFamily: '"Crimson Pro", Georgia, serif', color: theme.text }}>
            <Header patient={patient} audience={audience} setAudience={setAudience} user={user} setUser={setUser} />
            {!acceptedHipaa && <HipaaGate onAccept={() => setAcceptedHipaa(true)} />}

            <div style={{ maxWidth: 1400, margin: '0 auto', padding: '1.5rem 2rem' }}>
              <Tabs tab={tab} setTab={setTab} />

              {tab === 'profile' && <PatientTab patient={patient} setPatient={setPatient}
                audience={audience} setAudience={setAudience}
                setTab={setTab} runResearch={runResearch} busy={busy} />}
              {tab === 'research' && <ResearchTab
                patient={patient} busy={busy} runResearch={runResearch}
                researchText={researchText} treatments={treatments}
                validation={validations.research} evidenceSummary={evidenceSummary}
                dossier={dossier} progress={progress}
                chatHistory={chatHistory} userQuery={userQuery}
                setUserQuery={setUserQuery} sendChat={sendChat} />}
              {tab === 'trials' && <TrialsTab
                patient={patient} busy={busy} trialsData={trialsData}
                trialBlocks={trialBlocks} trialsText={trialsText}
                validation={validations.trials}
                runTrialsFetch={runTrialsFetch} runTrialsAnalysis={runTrialsAnalysis} />}
              {tab === 'repurpose' && <RepurposeTab
                patient={patient} busy={busy} runResearch={runResearch}
                repurposeText={repurposeText} candidates={candidates}
                validation={validations.repurpose} progress={progress} />}
              {tab === 'records' && <RecordsTab
                patient={patient} audience={audience}
                busy={busy} setBusy={setBusy}
                recordsResult={recordsResult} setRecordsResult={setRecordsResult} />}
              {tab === 'chart' && <ChartTab treatments={treatments} candidates={candidates} />}
              {tab === 'refs' && <RefsTab references={references} evidencePack={evidencePack} evidenceSummary={evidenceSummary} />}
            </div>
            <Footer />
          </div>
        );
      };

      /* ==================== Header ==================== */
      // User-menu dropdown state is kept at the app level so the menu can
      // close when the user clicks anywhere else. `user` is the authenticated
      // identity (null = anonymous / free-use). We stub it with localStorage
      // for now — enough to show the "Sign In" / "signed in as X" UX without
      // actually standing up OAuth yet. When we add real auth (Clerk / Auth0 /
      // NextAuth) the shape here won't change.
      const loadStoredUser = () => {
        try {
          const raw = localStorage.getItem('mrt_user');
          return raw ? JSON.parse(raw) : null;
        } catch { return null; }
      };

      const Header = ({ patient, audience, setAudience, user, setUser }) => {

        }, [menuOpen]);
        const initial = user?.email ? user.email[0].toUpperCase() : '';

        return (

            <header style={{

              }}>

                <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem', minWidth: 0 }}>

                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    boxShadow: '0 2px 8px rgba(74,158,255,0.35)'
                  }}>
                    <Activity size={20} color="#0b1f2a" />
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', lineHeight: 1.15 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>

                <div style={{ flex: 1 }} />

                <div style={{

                }}>
                  <span style={{ fontSize: '0.72rem', color: theme.textDim, fontWeight: 600 }}>Reading level</span>
                  <select value={audience} onChange={e => setAudience(e.target.value)}

                <div style={{

                <div style={{ position: 'relative' }} onClick={e => e.stopPropagation()}>

                      ))}
                      <div style={{ borderTop: `1px solid ${theme.border}`, marginTop: 4, paddingTop: 4 }}>
                        <button onClick={() => { setUser(null); try { localStorage.removeItem('mrt_user'); } catch {} setMenuOpen(false); }} style={{
                          display: 'flex', alignItems: 'center', gap: '0.6rem', width: '100%',
                          padding: '0.5rem 0.6rem', background: 'transparent', border: 'none',

                          fontFamily: 'inherit', textAlign: 'left'
                        }} onMouseEnter={e => e.currentTarget.style.background = 'rgba(248,113,113,0.08)'}
                           onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                          <LogOut size={14} /> Sign out

                      </div>
                    </div>
                  )}
                </div>
              </div>
              {/* Secondary bar: currently-researching chip, only visible on narrow screens */}
              {patient?.condition && (
                <div style={{
                  maxWidth: 1400, margin: '0 auto', padding: '0 1.5rem 0.6rem',
                  fontSize: '0.78rem', color: theme.textDim
                }}>
                  <span style={{ color: theme.textDim }}>Researching:</span>{' '}
                  <span style={{ color: theme.accent, fontWeight: 600 }}>{patient.condition}</span>
                </div>
              )}
            </header>

            {signInOpen && (
              <SignInModal onClose={() => setSignInOpen(false)} onSuccess={(u) => {
                setUser(u);
                try { localStorage.setItem('mrt_user', JSON.stringify(u)); } catch {}
                setSignInOpen(false);
              }} />
            )}
          </>
        );
      };

      // Stub sign-in modal. Captures an email + name so the UI has something
      // to personalise with (user menu shows initials/email). We don't yet
      // send this anywhere — it's intentionally offline until we wire a real
      // identity provider (Clerk / Auth0 / NextAuth). The UX is designed so
      // swapping in real auth only replaces the `handleSubmit` body below.
      const SignInModal = ({ onClose, onSuccess }) => {
        const [email, setEmail] = useState('');
        const [name, setName] = useState('');
        const [mode, setMode] = useState('signin'); // 'signin' | 'create'
        const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        const submit = (e) => {
          e?.preventDefault();
          if (!emailOk) return;
          onSuccess({ email: email.trim(), name: name.trim() || email.trim().split('@')[0], createdAt: new Date().toISOString() });
        };
        return (
          <div onClick={onClose} style={{

      };

      /* ==================== HIPAA Gate ==================== */
      const HipaaGate = ({ onAccept }) => (
        <div style={{
          position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.85)', zIndex: 100,
          display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '2rem'
        }}>
          <div style={{ ...panelStyle, maxWidth: 720, background: theme.panelSolid }}>
            <h2 style={{ marginTop: 0, color: '#ff8b5a', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
              <AlertCircle size={24} /> Privacy & HIPAA Warning
            </h2>
            <p><strong>This tool is NOT HIPAA compliant.</strong> It is a research prototype. Do not enter
            real, identifying patient information unless you understand and accept that:</p>
            <ul style={{ color: theme.textDim, lineHeight: 1.7 }}>
              <li>Data you type is sent to a third-party AI (Anthropic) and clinical databases (ClinicalTrials.gov, PubMed).</li>

              <li>Before pasting any medical records, <strong>remove name, date of birth, MRN, address, phone,

            <p style={{ color: theme.textDim, fontSize: '0.85rem' }}>

            </p>
            <button style={btn('primary')} onClick={onAccept}>I Understand — Continue</button>
          </div>
        </div>
      );

      /* ==================== Tabs ==================== */
      const Tabs = ({ tab, setTab }) => {
        const tabs = [
          { id: 'profile',   label: 'Profile',         icon: FileText },
          { id: 'research',  label: 'Research',        icon: Brain },
          { id: 'trials',    label: 'Trials',          icon: Beaker },
          { id: 'repurpose', label: 'Repurposing',     icon: Sparkles },
          { id: 'records',   label: 'Records Audit',   icon: ShieldCheck },
          { id: 'chart',     label: 'Compare',         icon: TrendingUp },
          { id: 'refs',      label: 'References',      icon: Book }
        ];
        return (
          <nav style={{
            display: 'flex', gap: '0.15rem', marginBottom: '1.5rem', flexWrap: 'wrap',

              const Icon = t.icon;
              const active = tab === t.id;
              return (
                <button key={t.id} onClick={() => setTab(t.id)} style={{
                  padding: '0.55rem 0.9rem', background: active ? 'rgba(74, 158, 255, 0.14)' : 'transparent',
