<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical Research Assistant</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Markdown renderer: the AI responses use markdown syntax (**bold**,
         tables, headings, links). Without a parser, the raw asterisks and
         pipe characters leak into the UI. marked is tiny (~40KB), fast,
         and has safe-by-default HTML escaping for our trusted-AI-output
         use case. -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <!-- html2pdf: client-side PDF export of research/repurpose/trials tabs.
         Dorothy asked for "print or save as Word or PDF or copy and paste" —
         this gives us the PDF path. html2pdf.js wraps html2canvas + jsPDF
         into one call: the output is a pixel-perfect PDF of the rendered
         panel, which means the AI analysis renders with the same markdown/
         formatting users see on screen. ~400KB; loaded from jsdelivr. -->
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      /* --------------------------------------------------------------
         THEME TOKENS.
         Everything that lives in CSS (and isn't driven by inline style
         props from React) is parameterised here. Inline JS styles pick
         up the matching values from the module-level `theme` object.
         The default is DARK; [data-theme="light"] on <body> flips the
         whole stylesheet to the LIGHT palette.

         Identity notes (why we don't look like ChatGPT or IBM Watson):
         - Accent is a cyan-400 in dark mode / cyan-700 in light — it
           reads as "instrument" or "evidence-grade", not ChatGPT-green
           and not generic IBM-blue.
         - Secondary is amber (dark) / burnt-orange (light) — a clinical-
           caution counterpoint that makes the app feel like a medical
           tool, not a chat product.
         - Light mode uses a cool near-white base with ultra-subtle cyan
           wash (NEJM-web vibe), not pure-white ChatGPT sterility.
      -------------------------------------------------------------- */
      :root, body:not([data-theme="light"]) {
        --mrt-bg-body:       radial-gradient(ellipse at top, #0d2030 0%, #061018 55%, #030910 100%);
        --mrt-text:          #eef5fa;
        --mrt-text-dim:      #b8cdd9;
        --mrt-text-bright:   #f5fafd;
        --mrt-accent:        #22d3ee;
        --mrt-accent-soft:   rgba(34, 211, 238, 0.14);
        --mrt-accent-edge:   rgba(34, 211, 238, 0.35);
        --mrt-accent-glow:   rgba(34, 211, 238, 0.22);
        --mrt-secondary:     #f59e0b;
        --mrt-border:        rgba(125, 211, 252, 0.22);
        --mrt-panel-solid:   rgba(16, 38, 56, 0.92);
        --mrt-panel-wash:    rgba(34, 211, 238, 0.045);
        --mrt-row-stripe:    rgba(15, 32, 39, 0.4);
        --mrt-code-bg:       rgba(34, 211, 238, 0.12);
        --mrt-code-text:     #d7ecff;
        --mrt-link:          #67e8f9;
        --mrt-link-hover:    #a5f3fc;
        --mrt-input-bg:      rgba(15, 32, 39, 0.5);
        --mrt-scrollbar-track: rgba(15, 32, 39, 0.5);
        --mrt-placeholder:   rgba(160, 196, 217, 0.5);
        --mrt-md-h-color:    #a5f3fc;
        --mrt-md-h-border:   rgba(34, 211, 238, 0.2);
        --mrt-md-h2-border:  rgba(34, 211, 238, 0.12);
        --mrt-md-body:       #e4edff;
        --mrt-md-strong:     #f2f8ff;
        --mrt-md-em:         #cde2ff;
        --mrt-md-pre-bg:     rgba(9, 20, 30, 0.6);
        --mrt-md-pre-border: rgba(34, 211, 238, 0.15);
        --mrt-md-quote-text: #bcd6f5;
        --mrt-md-quote-bg:   rgba(34, 211, 238, 0.05);
      }
      body[data-theme="light"] {
        --mrt-bg-body:       radial-gradient(ellipse at top, #ffffff 0%, #eaf1f6 100%);
        --mrt-text:          #0f172a;
        --mrt-text-dim:      #475569;
        --mrt-text-bright:   #020617;
        --mrt-accent:        #0e7490;
        --mrt-accent-soft:   rgba(14, 116, 144, 0.09);
        --mrt-accent-edge:   rgba(14, 116, 144, 0.32);
        --mrt-accent-glow:   rgba(14, 116, 144, 0.2);
        --mrt-secondary:     #c2410c;
        --mrt-border:        rgba(15, 23, 42, 0.14);
        --mrt-panel-solid:   #ffffff;
        --mrt-panel-wash:    rgba(14, 116, 144, 0.03);
        --mrt-row-stripe:    rgba(241, 245, 249, 0.8);
        --mrt-code-bg:       rgba(14, 116, 144, 0.08);
        --mrt-code-text:     #0e3a45;
        --mrt-link:          #0e7490;
        --mrt-link-hover:    #155e75;
        --mrt-input-bg:      #ffffff;
        --mrt-scrollbar-track: rgba(15, 23, 42, 0.05);
        --mrt-placeholder:   rgba(15, 23, 42, 0.4);
        --mrt-md-h-color:    #0e3a45;
        --mrt-md-h-border:   rgba(14, 116, 144, 0.25);
        --mrt-md-h2-border:  rgba(14, 116, 144, 0.14);
        --mrt-md-body:       #1e293b;
        --mrt-md-strong:     #020617;
        --mrt-md-em:         #334155;
        --mrt-md-pre-bg:     #f8fafc;
        --mrt-md-pre-border: rgba(14, 116, 144, 0.18);
        --mrt-md-quote-text: #334155;
        --mrt-md-quote-bg:   rgba(14, 116, 144, 0.04);
      }

      /* Base font size bumped from the browser default 16px to 17.5px
         because the primary user is 80+ with glasses and IPF. This
         scales everything rem-based in the app (panel text, buttons,
         labels) up ~10% uniformly, and individual rules below further
         bump the rendered-markdown analysis since that's the main read. */
      html { font-size: 17.5px; }
      body {
        margin: 0;
        color: var(--mrt-text);
        transition: color 0.2s ease;
      }
      * { box-sizing: border-box; }
      input::placeholder, textarea::placeholder { color: var(--mrt-placeholder); }
      input:focus, textarea:focus, select:focus {
        outline: none; border-color: var(--mrt-accent);
        box-shadow: 0 0 0 3px var(--mrt-accent-glow);
      }
      button:not(:disabled):hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px var(--mrt-accent-glow);
      }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .spin { animation: spin 1s linear infinite; }
      @keyframes mrt-shimmer {
        0%   { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      .mrt-shimmer-bar {
        background-size: 200% 100%;
        animation: mrt-shimmer 2.2s linear infinite;
      }
      @keyframes mrt-pulse-dot {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50%      { opacity: 1;    transform: scale(1); }
      }
      .mrt-pulse-dot { animation: mrt-pulse-dot 1.2s ease-in-out infinite; }
      /* Rendered-markdown container for AI analysis blocks. The AI emits
         headings (## 1. ...), tables, bullets, bold, links. Without these
         styles the browser defaults would look like raw HTML test-page —
         these rules make the output look like a real clinical report. */
      /* Analysis body text sized for a 80+ reader with glasses: ~20px
         at the base root of 17.5px. Generous line-height too, so long
         paragraphs don't crowd. */
      .mrt-markdown { line-height: 1.7; font-size: 1.15rem; color: var(--mrt-md-body); }
      .mrt-markdown h1 { font-size: 1.75rem; color: var(--mrt-md-h-color); border-bottom: 1px solid var(--mrt-md-h-border); padding-bottom: 0.35rem; margin: 1.6rem 0 0.9rem; }
      .mrt-markdown h2 { font-size: 1.45rem; color: var(--mrt-md-h-color); margin: 1.7rem 0 0.7rem; padding-top: 0.6rem; border-top: 1px solid var(--mrt-md-h2-border); }
      .mrt-markdown h2:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
      .mrt-markdown h3 { font-size: 1.2rem; color: var(--mrt-md-h-color); margin: 1.2rem 0 0.5rem; }
      .mrt-markdown h4 { font-size: 1.05rem; color: var(--mrt-md-h-color); margin: 0.9rem 0 0.4rem; text-transform: uppercase; letter-spacing: 0.04em; }
      .mrt-markdown p  { margin: 0 0 0.8rem; }
      .mrt-markdown ul, .mrt-markdown ol { margin: 0.3rem 0 1rem 1.4rem; padding: 0; }
      .mrt-markdown li { margin: 0.3rem 0; }
      .mrt-markdown strong { color: var(--mrt-md-strong); font-weight: 700; }
      .mrt-markdown em { color: var(--mrt-md-em); }
      .mrt-markdown a { color: var(--mrt-link); text-decoration: none; border-bottom: 1px dashed var(--mrt-accent-edge); }
      .mrt-markdown a:hover { color: var(--mrt-link-hover); border-bottom-color: var(--mrt-link-hover); }
      .mrt-markdown code { background: var(--mrt-code-bg); color: var(--mrt-code-text); padding: 0.08em 0.35em; border-radius: 3px; font-size: 0.88em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .mrt-markdown pre { background: var(--mrt-md-pre-bg); border: 1px solid var(--mrt-md-pre-border); padding: 0.75rem 0.9rem; border-radius: 6px; overflow-x: auto; }
      .mrt-markdown pre code { background: transparent; padding: 0; }
      .mrt-markdown blockquote { border-left: 3px solid var(--mrt-accent-edge); margin: 0.5rem 0; padding: 0.1rem 0.9rem; color: var(--mrt-md-quote-text); background: var(--mrt-md-quote-bg); }
      .mrt-markdown table { width: 100%; border-collapse: collapse; margin: 0.8rem 0 1.1rem; font-size: 1rem; }
      .mrt-markdown th, .mrt-markdown td { border: 1px solid var(--mrt-md-h2-border); padding: 0.55rem 0.75rem; text-align: left; vertical-align: top; }
      .mrt-markdown th { background: var(--mrt-accent-soft); color: var(--mrt-md-h-color); font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.03em; }
      .mrt-markdown tr:nth-child(even) td { background: var(--mrt-row-stripe); }
      .mrt-markdown hr { border: 0; border-top: 1px solid var(--mrt-md-h2-border); margin: 1.5rem 0; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: var(--mrt-scrollbar-track); }
      ::-webkit-scrollbar-thumb { background: var(--mrt-accent-edge); border-radius: 5px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--mrt-accent); }
      tbody tr:hover { background: var(--mrt-accent-soft); }
      a { color: var(--mrt-link); }
      a:hover { color: var(--mrt-link-hover); }

      /* A signature visual touch: a 2px cyan→amber gradient strip that
         lives under the header. This is the app's "pulse bar" — it's
         the clearest identity marker separating us from ChatGPT/Claude
         clone aesthetics. Shown on both themes with tuned alpha. */
      .mrt-pulse-bar {
        height: 2px;
        background: linear-gradient(90deg,
          transparent 0%,
          var(--mrt-accent) 20%,
          var(--mrt-accent) 45%,
          var(--mrt-secondary) 55%,
          var(--mrt-secondary) 80%,
          transparent 100%);
        opacity: 0.55;
      }
    </style>
</head>

      </>);

      /* ==================== Theme ==================== */
      // Two palettes. Identity choices (why this isn't a ChatGPT / IBM
      // Watson clone):
      //   - Primary accent is a cyan that reads as "clinical instrument"
      //     rather than the ChatGPT-green or corporate-IBM-blue we'd
      //     get if we just grabbed default Tailwind slate/indigo.
      //   - We carry a dedicated amber/burnt-orange "secondary" across
      //     both modes for evidence-grade highlights (citation tags,
      //     red-flag callouts). Two-tone identity separates us from
      //     monochrome AI chat products.
      //   - Light mode is cool near-white with a faint cyan panel wash
      //     (NEJM-web feel) rather than pure white — premium clinical,
      //     not ChatGPT sterile.
      //
      // The theme/panelStyle/inputStyle/labelStyle/btn identifiers are
      // MUTABLE (let, not const) so we can flip palettes at runtime. The
      // App component calls `applyThemeMode()` which rewires all of them
      // in-place and triggers a re-render; every component reads these
      // bindings fresh on every render, so styles follow automatically.
      const DARK_PALETTE = {
        name: 'dark',
        bg: 'radial-gradient(ellipse at top, #0d2030 0%, #061018 55%, #030910 100%)',
        panel: 'rgba(34, 211, 238, 0.045)',
        panelSolid: 'rgba(16, 38, 56, 0.92)',
        border: 'rgba(125, 211, 252, 0.22)',
        accent: '#22d3ee',
        accentSoft: 'rgba(34, 211, 238, 0.14)',
        accentEdge: 'rgba(34, 211, 238, 0.35)',
        accentGlow: 'rgba(34, 211, 238, 0.22)',
        secondary: '#f59e0b',
        secondarySoft: 'rgba(245, 158, 11, 0.14)',
        text: '#eef5fa',
        textDim: '#b8cdd9',
        textBright: '#f5fafd',
        inputBg: 'rgba(15, 32, 39, 0.55)',
        inputBorder: 'rgba(34, 211, 238, 0.3)',
        rowStripe: 'rgba(15, 32, 39, 0.4)',
        ghostBg: 'rgba(34, 211, 238, 0.1)',
        ghostBorder: 'rgba(34, 211, 238, 0.35)',
        primaryText: '#04131a',
        green: '#34d399', yellow: '#fbbf24', red: '#f87171'
      };
      const LIGHT_PALETTE = {
        name: 'light',
        bg: 'radial-gradient(ellipse at top, #ffffff 0%, #eaf1f6 100%)',
        panel: 'rgba(14, 116, 144, 0.03)',
        panelSolid: '#ffffff',
        border: 'rgba(15, 23, 42, 0.14)',
        accent: '#0e7490',
        accentSoft: 'rgba(14, 116, 144, 0.09)',
        accentEdge: 'rgba(14, 116, 144, 0.32)',
        accentGlow: 'rgba(14, 116, 144, 0.2)',
        secondary: '#c2410c',
        secondarySoft: 'rgba(194, 65, 12, 0.09)',
        text: '#0f172a',
        textDim: '#475569',
        textBright: '#020617',
        inputBg: '#ffffff',
        inputBorder: 'rgba(14, 116, 144, 0.25)',
        rowStripe: 'rgba(241, 245, 249, 0.8)',
        ghostBg: 'rgba(14, 116, 144, 0.07)',
        ghostBorder: 'rgba(14, 116, 144, 0.3)',
        primaryText: '#ffffff',
        green: '#047857', yellow: '#b45309', red: '#b91c1c'
      };
      const buildPanelStyle = (t) => ({
        background: t.panel, borderRadius: 12,
        border: `1px solid ${t.border}`, padding: '1.5rem',
        backdropFilter: t.name === 'dark' ? 'blur(10px)' : 'none',
        boxShadow: t.name === 'light' ? '0 1px 2px rgba(15, 23, 42, 0.04)' : 'none'
      });
      const buildInputStyle = (t) => ({
        padding: '0.75rem', background: t.inputBg,
        border: `1px solid ${t.inputBorder}`, borderRadius: 8,
        color: t.text, fontSize: '0.95rem', fontFamily: 'inherit', width: '100%'
      });
      const buildLabelStyle = (t) => ({
        marginBottom: '0.4rem', color: t.accent, fontWeight: 600,
        fontSize: '0.85rem', letterSpacing: '0.02em'
      });
      const buildBtn = (t) => (variant = 'primary', disabled = false) => ({
        padding: '0.7rem 1.1rem',
        background: disabled ? t.accentSoft
          : variant === 'primary' ? t.accent
          : variant === 'ghost'   ? t.ghostBg
          : variant === 'danger'  ? t.red
          : t.accentSoft,
        color: variant === 'primary'
          ? t.primaryText
          : variant === 'danger'
          ? '#ffffff'
          : t.text,
        border: variant === 'ghost' ? `1px solid ${t.ghostBorder}` : 'none',
        borderRadius: 8, cursor: disabled ? 'not-allowed' : 'pointer',
        fontSize: '0.9rem', fontWeight: 600, fontFamily: 'inherit',
        display: 'inline-flex', alignItems: 'center', gap: '0.4rem',
        transition: 'all 0.15s ease'
      });

      let theme       = DARK_PALETTE;
      let panelStyle  = buildPanelStyle(theme);
      let inputStyle  = buildInputStyle(theme);
      let labelStyle  = buildLabelStyle(theme);
      let btn         = buildBtn(theme);

      // applyThemeMode rewires the module-level style bindings + flips
      // the body [data-theme] attribute (which drives the CSS-variable
      // overrides in the head style block). Must be called BEFORE the
      // App re-renders; the App does this in its toggle handler. Safe
      // to call at module load too — we do, so the persisted
      // preference is active before React paints the first frame.
      const applyThemeMode = (mode) => {
        const t = (mode === 'light') ? LIGHT_PALETTE : DARK_PALETTE;
        theme       = t;
        panelStyle  = buildPanelStyle(t);
        inputStyle  = buildInputStyle(t);
        labelStyle  = buildLabelStyle(t);
        btn         = buildBtn(t);
        try {
          document.body.dataset.theme = t.name;
          localStorage.setItem('mrt-theme-mode', t.name);
        } catch {}
        return t.name;
      };
      // Apply the persisted preference before React mounts.
      try {
        const stored = localStorage.getItem('mrt-theme-mode');
        if (stored === 'light' || stored === 'dark') applyThemeMode(stored);
        else applyThemeMode('dark');
      } catch { applyThemeMode('dark'); }

      /* ==================== Parsers ==================== */
      const collectBlock = (text, startIdx, terminators) => {
        const lines = text.split('\n');
        let cur = lines[startIdx].split(':').slice(1).join(':').trim();
        let next = startIdx + 1;
        while (next < lines.length) {
          const trimmed = lines[next].trim();
          if (terminators.some(t => trimmed.startsWith(t))) break;
          if (trimmed.startsWith('## ')) break;
          if (trimmed) cur += ' ' + trimmed;
          next++;
        }
        return cur;
      };

      const TREATMENT_KEYS = [
        'PROVIDER:', 'TREATMENT:', 'FDA_STATUS:', 'LENGTH_FREQUENCY:',
        'EFFICACY:', 'SAFETY:', 'RISKS:', 'INTERACTIONS:', 'COST:', 'REFERENCES:'
      ];
      const parseTreatments = (text) => {
        const blocks = [];
        const lines = text.split('\n');
        let cur = null;
        lines.forEach((line, i) => {
          const t = line.trim();
          const key = TREATMENT_KEYS.find(k => t.startsWith(k));
          if (!key) return;
          if (key === 'PROVIDER:') {
            if (cur) blocks.push(cur);
            cur = { _type: 'treatment' };
          }
          if (!cur) return;
          const field = key.replace(':', '').toLowerCase();
          cur[field] = collectBlock(text, i, TREATMENT_KEYS);
          if (field === 'efficacy' || field === 'safety') {
            const num = cur[field].match(/(\d{1,3})\s*%/);
            cur[field + '_pct'] = num ? parseInt(num[1]) : null;
            cur[field + '_note'] = cur[field];
          }
        });
        if (cur) blocks.push(cur);
        return blocks.sort((a, b) => (b.efficacy_pct || 0) - (a.efficacy_pct || 0));
      };

      const REPURPOSE_KEYS = [
        'CANDIDATE:', 'CLASS:', 'APPROVED_FOR:', 'MECHANISM_TARGET:', 'REPURPOSE_RATIONALE:',
        'EVIDENCE_STRENGTH:', 'SUPPORTING_EVIDENCE:', 'EFFICACY_HYPOTHESIS:', 'SAFETY:',
        'CONFIDENCE:', 'PATIENT_SPECIFIC_RISKS:', 'HOW_TO_DISCUSS_WITH_DOCTOR:'
      ];
      const parseCandidates = (text) => {
        const out = [];
        const lines = text.split('\n');
        let cur = null;
        lines.forEach((line, i) => {
          const t = line.trim();
          const key = REPURPOSE_KEYS.find(k => t.startsWith(k));
          if (!key) return;
          if (key === 'CANDIDATE:') { if (cur) out.push(cur); cur = {}; }
          if (!cur) return;
          const field = key.replace(':', '').toLowerCase();
          cur[field] = collectBlock(text, i, REPURPOSE_KEYS);
          if (field === 'efficacy_hypothesis' || field === 'safety' || field === 'confidence') {
            const num = cur[field].match(/(\d{1,3})\s*%/);
            cur[field + '_pct'] = num ? parseInt(num[1]) : null;
          }
        });
        if (cur) out.push(cur);
        return out.sort((a, b) =>
          (b.confidence_pct || b.efficacy_hypothesis_pct || 0) -
          (a.confidence_pct || a.efficacy_hypothesis_pct || 0)
        );
      };

      const TRIAL_KEYS = [
        'TRIAL:', 'NCT:', 'URL:', 'PHASE:', 'STATUS:', 'ACCEPTING:', 'PLACEBO:',
        'TREATMENT_ONLY:', 'COUNTRY:', 'OVERSIGHT:', 'DESIGNATIONS:',
        'FIT_FOR_PATIENT:', 'HARM_RISK:', 'INTERACTIONS:', 'LOCATION_CONTACT:', 'SUMMARY:'
      ];
      const parseTrialBlocks = (text) => {
        const out = [];
        const lines = text.split('\n');
        let cur = null;
        lines.forEach((line, i) => {
          const t = line.trim();
          const key = TRIAL_KEYS.find(k => t.startsWith(k));
          if (!key) return;
          if (key === 'TRIAL:') { if (cur) out.push(cur); cur = {}; }
          if (!cur) return;
          const field = key.replace(':', '').toLowerCase();
          cur[field] = collectBlock(text, i, TRIAL_KEYS);
          if (field === 'fit_for_patient' || field === 'harm_risk') {
            const num = cur[field].match(/(\d{1,3})\s*%/);
            cur[field + '_pct'] = num ? parseInt(num[1]) : null;
          }
        });
        if (cur) out.push(cur);
        return out;
      };

      const parseReferences = (text) => {
        const urlRe = /(https?:\/\/[^\s)]+)(?:\s*[-—:]\s*["“]([^"”]+)["”])?/g;
        const refs = [];
        const seen = new Set();
        let m;
        while ((m = urlRe.exec(text)) !== null) {
          const url = m[1].replace(/[.,;)]+$/, '');
          if (seen.has(url)) continue;
          seen.add(url);
          refs.push({ url, quote: m[2] || '' });
        }
        return refs;
      };

      /* ==================== Color helpers ==================== */
      const ratingColor = (n) => {
        if (n == null) return theme.textDim;
        if (n >= 70) return theme.green;
        if (n >= 40) return theme.yellow;
        return theme.red;
      };

      /* ==================== Storage ==================== */
      const loadLS = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
      const saveLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

      /* ============================================================== */
      /* =========================== APP ============================== */
      /* ============================================================== */
      const App = () => {
        const [tab, setTab] = useState('profile');
        const [patient, setPatient] = useState(() => loadLS('mrt_patient', {
          condition: 'Idiopathic Pulmonary Fibrosis', stage: '',
          age: '', gender: '', weight: '',
          smoking: '', exercise: '',
          diagnoses: '', medications: '', symptoms: '', labWork: '', scans: ''
        }));
        const [audience, setAudience] = useState(() => loadLS('mrt_audience', 'layperson'));
        const [acceptedHipaa, setAcceptedHipaa] = useState(() => loadLS('mrt_hipaa', false));
        const [user, setUser] = useState(() => loadStoredUser());
        // Theme mode. The actual palette lives on module-level mutable
        // bindings (theme/panelStyle/inputStyle/labelStyle/btn) which are
        // rewired by applyThemeMode() BEFORE we setState, so the
        // subsequent re-render reads the flipped styles everywhere.
        const [themeMode, setThemeModeState] = useState(theme.name);
        const setThemeMode = (mode) => {
          applyThemeMode(mode);
          setThemeModeState(mode);
        };

        const [researchText, setResearchText] = useState('');
        const [repurposeText, setRepurposeText] = useState('');
        const [trialsText, setTrialsText] = useState('');
        const [trialsData, setTrialsData] = useState(null);
        const [recordsResult, setRecordsResult] = useState(null);
        const [chatHistory, setChatHistory] = useState([]);
        const [userQuery, setUserQuery] = useState('');
        const [busy, setBusy] = useState(null);

        // Cross-AI audit results per mode — a second model independently
        // audits Claude's output against the same evidence pack.
        const [validations, setValidations] = useState({
          research: null, repurpose: null, trials: null
        });
        const [evidenceSummary, setEvidenceSummary] = useState(null);
        // Methodology transparency state. Surfaces the post-synthesis
        // pipeline-drug coverage audit result (whether any KB-listed
        // drugs were missed and whether a forced re-prompt fired).
        const [coverageAudit, setCoverageAudit] = useState(null);
        const [evidencePack, setEvidencePack] = useState([]);
        const [dossier, setDossier] = useState(null);

        // Deep-research progress state. When runResearch('research'|'repurpose')
        // is in flight, `progress.active === true` and `progress.steps` tracks
        // each stage of the pipeline (dossier, evidence, trials, synthesis,
        // validation). The DeepResearchProgress component renders a ChatGPT-
        // style stepped progress bar driven off this shape.
        const [progress, setProgress] = useState(null);
        const updateStep = (id, patch) => setProgress(p => {
          if (!p) return p;
          return {
            ...p,
            steps: p.steps.map(s => s.id === id ? { ...s, ...patch } : s)
          };
        });

        useEffect(() => saveLS('mrt_patient', patient), [patient]);
        useEffect(() => saveLS('mrt_audience', audience), [audience]);
        useEffect(() => saveLS('mrt_hipaa', acceptedHipaa), [acceptedHipaa]);

        /* -------- Derived / parsed data -------- */
        const treatments = useMemo(() => parseTreatments(researchText), [researchText]);
        const candidates = useMemo(() => parseCandidates(repurposeText), [repurposeText]);
        const trialBlocks = useMemo(() => parseTrialBlocks(trialsText), [trialsText]);
        const references = useMemo(() => {
          const all = [
            ...parseReferences(researchText),
            ...parseReferences(repurposeText),
            ...parseReferences(trialsText)
          ];
          const map = new Map();
          all.forEach(r => { if (!map.has(r.url)) map.set(r.url, r); });
          return [...map.values()];
        }, [researchText, repurposeText, trialsText]);

        /* -------- Actions -------- */
        const runResearch = async (mode, extra = {}) => {
          // Research / Repurpose / Trials still require a condition (they
          // do a full 16-section analysis that's meaningless without one).
          // Chat mode is allowed to start cold — the backend will detect
          // a disease name in the user's first message.
          if (mode !== 'chat' && !patient.condition.trim()) {
            alert('Please enter a primary condition in the Patient Profile tab first.');
            setTab('profile');
            return;
          }
          setBusy(mode);
          // Seed deep-research progress for research/repurpose (the heavy,
          // multi-phase modes). Chat / trials-analysis stay lightweight and
          // just use the inline spinner.
          const deepMode = (mode === 'research' || mode === 'repurpose');
          if (deepMode) {
            setProgress({
              active: true,
              mode,
              startedAt: Date.now(),
              steps: [
                { id: 'dossier',  label: 'Build disease dossier',
                  desc: 'Canonical name, synonyms, MeSH, top centers, landmark trials.',
                  status: 'running' },
                { id: 'evidence', label: 'Pull peer-reviewed evidence',
                  desc: 'Searches ~250k journals worldwide via PubMed · Europe PMC · OpenAlex · Cochrane · openFDA · Unpaywall. Academic / peer-reviewed venues only; paper mills excluded.',
                  status: 'running' },
                { id: 'trials',   label: 'Scan ClinicalTrials.gov',
                  desc: 'Recruiting + expanded-access + open-label extension fan-out.',
                  status: 'running' },
                { id: 'synth',    label: 'Synthesise with Claude Sonnet',
                  desc: '16-section grounded analysis tuned to your profile.',
                  status: 'pending' },
                { id: 'validate', label: 'Cross-AI fact-check (if configured)',
                  desc: 'Second model audits every claim against the evidence pack.',
                  status: 'pending' }
              ]
            });
          }
          // Helper: POST /api/research with robust non-JSON error handling.
          // Vercel's 60s serverless cap, when hit, returns a plain-text error
          // page (FUNCTION_INVOCATION_TIMEOUT) which is NOT JSON — we detect
          // that specifically and surface a friendlier message instead of
          // the browser's cryptic 'Unexpected token A ... is not valid JSON'.
          const callResearch = async (payload) => {
            const res = await fetch('/api/research', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const raw = await res.text();
            let data;
            try { data = JSON.parse(raw); }
            catch {
              const isTimeout = /FUNCTION_INVOCATION_TIMEOUT|An error occurred with your deployment/i.test(raw);
              throw new Error(
                isTimeout
                  ? `Step timed out (60s cap). The ${payload.phase || 'full'} phase is too heavy for the free tier — try again, it'll usually pass on the second attempt because the dossier and upstream queries cache.`
                  : `Server returned non-JSON (HTTP ${res.status}): ${raw.slice(0, 140)}`
              );
            }
            if (!res.ok) throw new Error(data.error || `Request failed (HTTP ${res.status})`);
            return data;
          };
          try {
            // Two-phase for research + repurpose (fan-out is too heavy to
            // finish alongside Claude synthesis in one 60s slot). Chat and
            // trials stay single-shot — their pipelines are much shorter.
            const useTwoPhase = (mode === 'research' || mode === 'repurpose');
            let data;
            if (useTwoPhase) {
              const gathered = await callResearch({
                mode, patient, audience, phase: 'gather', ...extra
              });
              // Expose the pools in the UI as soon as phase 1 finishes so
              // the user sees dossier / trials / evidence panels populate
              // before Claude's full narrative arrives.
              if (gathered.dossier) setDossier(gathered.dossier);
              if (gathered.evidence) {
                setEvidenceSummary(gathered.evidence);
                setEvidencePack(gathered.evidence.topRanked || []);
              }
              // Mark phase-1 steps as complete with real counts so the UI
              // can show "Pulled 42 peer-reviewed sources" etc.
              updateStep('dossier', {
                status: 'done',
                detail: gathered.dossier?.canonical
                  ? `${gathered.dossier.canonical}${gathered.dossier.cacheHit ? ' (cached)' : ''}`
                  : 'dossier built'
              });
              updateStep('evidence', {
                status: 'done',
                detail: (() => {
                  const e = gathered.evidence;
                  if (!e) return 'evidence pack ready';
                  const fetched = e.totalFetched || e.totalUnique || 0;
                  const unique = e.totalUnique || 0;
                  const journals = e.uniqueJournals || 0;
                  const pack = e.promptPackBreakdown?.total || 0;
                  // e.g. "Screened 104 records across PubMed / Europe PMC / OpenAlex / Cochrane — 32 unique across 27 journals, top 25 passed to Claude"
                  return `Screened ${fetched} records across PubMed / Europe PMC / OpenAlex / Cochrane — ${unique} unique across ${journals} journals, top ${pack} passed to Claude`;
                })()
              });
              updateStep('trials', {
                status: 'done',
                detail: gathered.trials?.total
                  ? `${gathered.trials.returned || gathered.trials.total} trials (of ${gathered.trials.total} matched)`
                  : 'ClinicalTrials.gov scanned'
              });
              // Phase 2: synthesize. For research mode we split Claude's
              // work into TWO successive calls — each gets its own 60s
              // Vercel slot so Claude always finishes its half without
              // hitting stop_reason=max_tokens mid-section. Repurpose
              // mode still runs a single synth call (its prompt is
              // smaller and the max_tokens budget is enough).
              updateStep('synth', { status: 'running', detail: mode === 'research' ? 'Part 1/2: condition, experts, treatments' : undefined });
              if (mode === 'research') {
                // FRONT half: sections 1-4 (snapshot, centers,
                // treatments, trials & access programs).
                const front = await callResearch({
                  mode, patient, audience,
                  phase: 'synthesize',
                  half: 'front',
                  providedDossier: gathered.dossier,
                  providedEvidence: gathered.evidence,
                  providedTrials: gathered.trials,
                  ...extra
                });
                updateStep('synth', { status: 'running', detail: 'Part 2/2: trials, access, patient plan, red flags' });
                // BACK half: sections 5-8 (repurposing/pipeline,
                // cell/gene, patient plan, red flags).
                //
                // We pass `priorText` (the front-half output) so the
                // server-side transparency block can correctly mark
                // approved drugs as "discussed" — they appear in the
                // front half's section 3, not the back half.
                const frontTextForPrior = (front.content || [])
                  .filter(b => b.type === 'text')
                  .map(b => b.text)
                  .join('\n');
                const back = await callResearch({
                  mode, patient, audience,
                  phase: 'synthesize',
                  half: 'back',
                  providedDossier: gathered.dossier,
                  providedEvidence: gathered.evidence,
                  providedTrials: gathered.trials,
                  priorText: frontTextForPrior,
                  ...extra
                });
                // Stitch the two halves back into a single `data` blob
                // so the rest of the pipeline (text extraction, validation
                // display, evidence pack update) is unchanged.
                const frontText = (front.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
                const backText  = (back.content  || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
                const tokensFront = front.usage?.output_tokens || 0;
                const tokensBack  = back.usage?.output_tokens  || 0;
                data = {
                  ...back,
                  content: [{ type: 'text', text: frontText + '\n\n' + backText }],
                  usage: {
                    input_tokens:  (front.usage?.input_tokens  || 0) + (back.usage?.input_tokens  || 0),
                    output_tokens: tokensFront + tokensBack
                  },
                  dossier:    back.dossier    || front.dossier,
                  evidence:   back.evidence   || front.evidence,
                  trials:     back.trials     || front.trials,
                  validation: back.validation || front.validation || null
                };
              } else {
                // Repurpose mode: single synth call.
                data = await callResearch({
                  mode, patient, audience,
                  phase: 'synthesize',
                  providedDossier: gathered.dossier,
                  providedEvidence: gathered.evidence,
                  providedTrials: gathered.trials,
                  ...extra
                });
              }
              updateStep('synth', {
                status: 'done',
                detail: data.usage?.output_tokens
                  ? `${data.usage.output_tokens.toLocaleString()} tokens generated`
                  : 'analysis ready'
              });
              updateStep('validate', {
                status: data.validation ? 'done' : 'skipped',
                detail: data.validation
                  ? `${data.validation.claims?.length || 0} claims audited`
                  : 'no secondary model configured'
              });
            } else {
              data = await callResearch({ mode, patient, audience, ...extra });
            }
            const text = (data.content || [])
              .filter(b => b.type === 'text').map(b => b.text).join('\n');
            if (mode === 'research') setResearchText(text);
            if (mode === 'repurpose') setRepurposeText(text);
            if (mode === 'trials') setTrialsText(text);
            if (mode === 'chat') {
              setChatHistory(h => [...h, { role: 'assistant', content: text }]);
            }
            if (mode !== 'chat' && data.validation) {
              setValidations((v) => ({ ...v, [mode]: data.validation }));
            }
            if (data.evidence) {
              setEvidenceSummary(data.evidence);
              setEvidencePack(data.evidence.topRanked || []);
            }
            if (data.dossier) {
              setDossier(data.dossier);
            }
            if (data.coverageAudit) {
              setCoverageAudit(data.coverageAudit);
            }
          } catch (e) {
            if (deepMode) {
              setProgress(p => p ? ({
                ...p, active: false, error: e.message,
                steps: p.steps.map(s => s.status === 'running' ? { ...s, status: 'error', detail: e.message } : s)
              }) : null);
            }
            alert('Error: ' + e.message);
          } finally {
            setBusy(null);
            if (deepMode) {
              // Fade out the progress card a beat after completion so the
              // user clearly sees every step hit "done" before it hides.
              setTimeout(() => setProgress(p => p ? ({ ...p, active: false }) : null), 600);
            }
          }
        };

        const runTrialsFetch = async (opts) => {
          if (!patient.condition.trim()) {
            alert('Please enter a primary condition in the Patient Profile tab first.');
            setTab('profile');
            return;
          }
          setBusy('trials-fetch');
          try {
            const res = await fetch('/api/trials', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                condition: patient.condition,
                recruitingOnly: opts?.recruitingOnly ?? true,
                treatmentOnly: opts?.treatmentOnly ?? true,
                excludePlacebo: opts?.excludePlacebo ?? false,
                pageSize: 40
              })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Trials fetch failed');
            setTrialsData(data);
          } catch (e) {
            alert('Error: ' + e.message);
          } finally {
            setBusy(null);
          }
        };

        const runTrialsAnalysis = () => {
          if (!trialsData || !trialsData.studies?.length) {
            alert('Fetch trials first (Clinical Trials tab → Fetch Live Trials).');
            return;
          }
          runResearch('trials', { trialsData });
        };

        // On-demand cross-AI audit. Fires only when the user clicks the
        // "Audit this analysis" button in one of the tabs (research /
        // repurpose / trials). Keeps the validator out of the default
        // run path — Perplexity/OpenAI cost is only incurred when a user
        // actually wants the independent second opinion. See cost-cuts
        // 2026-04-23 in api/research.js and api/validate.js.
        const auditAnalysis = async (mode) => {
          const analysisText =
            mode === 'research'  ? researchText :
            mode === 'repurpose' ? repurposeText :
            mode === 'trials'    ? trialsText : '';
          if (!analysisText) {
            alert('Run the analysis first, then audit it.');
            return;
          }
          setValidations((v) => ({ ...v, [mode]: { _auditing: true } }));
          try {
            const packForValidator = (evidencePack || []).slice(0, 18).map((a) => ({
              id: a.doi || a.pmid || a.id,
              title: a.title,
              journal: a.journal,
              tier: a.journalTier,
              year: a.year,
              sources: a.sources,
              accessLevel: a.accessLevel,
              url: a.pmcUrl || a.pubmedUrl || a.doiUrl || a.oaUrl || a.landingUrl || a.europePmcUrl,
              text: (a.fullText || a.abstract || '').slice(0, 2000)
            }));
            const r = await fetch('/api/validate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                analysisText,
                evidencePack: packForValidator,
                patient,
                condition: patient.condition || '',
                audience
              })
            });
            const data = await r.json();
            if (!r.ok) {
              setValidations((v) => ({ ...v, [mode]: { error: data.error || `HTTP ${r.status}`, hint: data.hint } }));
              return;
            }
            setValidations((v) => ({ ...v, [mode]: data }));
          } catch (err) {
            setValidations((v) => ({ ...v, [mode]: { error: err.message } }));
          }
        };

        const sendChat = async () => {
          if (!userQuery.trim()) return;
          const q = userQuery.trim();
          setUserQuery('');
          setChatHistory(h => [...h, { role: 'user', content: q }]);
          setBusy('chat');

          // If the user typed a plausible disease name into chat and their
          // patient profile has no condition yet, auto-populate it from the
          // chat message. Lets them hit "Run Research" afterward without
          // having to retype the condition into the profile tab. We keep the
          // heuristic intentionally loose — the backend's dossier agent will
          // sanity-check whatever we pass in anyway.
          if (!patient.condition?.trim() && q.length <= 80 && !/[?]/.test(q)) {
            const candidate = q.replace(/^(ok|hey|hi|hello|please|tell me about|give me info on|what is|info on)\s+/i, '').trim();
            if (candidate.length >= 2 && candidate.length <= 80) {
              setPatient(p => ({ ...p, condition: candidate }));
            }
          }
          try {
            // Pass the prior analyses + cached evidence pack so chat mode
            // has real context to answer from. Before this, chat ran with no
            // evidence pack and no memory of prior research output, which is
            // why follow-ups often came back as "can't compute" hedges.
            const packForChat = (evidencePack || []).slice(0, 18).map((a) => ({
              id: a.doi || a.pmid || a.id,
              title: a.title,
              journal: a.journal,
              tier: a.journalTier,
              year: a.year,
              sources: a.sources,
              accessLevel: a.accessLevel,
              url: a.pmcUrl || a.pubmedUrl || a.doiUrl || a.oaUrl || a.landingUrl || a.europePmcUrl,
              text: (a.fullText || a.abstract || '').slice(0, 2500)
            })).filter((a) => a.title);

            const res = await fetch('/api/research', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                mode: 'chat', patient, audience, userQuery: q,
                chatHistory: chatHistory.slice(-10),
                priorAnalyses: {
                  research: researchText || undefined,
                  repurpose: repurposeText || undefined,
                  trials: trialsText || undefined
                },
                evidencePack: packForChat
              })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Chat failed');
            const text = (data.content || [])
              .filter(b => b.type === 'text').map(b => b.text).join('\n');
            setChatHistory(h => [...h, { role: 'assistant', content: text }]);
          } catch (e) {
            setChatHistory(h => [...h, { role: 'assistant', content: 'Error: ' + e.message }]);
          } finally {
            setBusy(null);
          }
        };

        return (
          <div style={{ minHeight: '100vh', background: theme.bg,
            fontFamily: '"Crimson Pro", Georgia, serif', color: theme.text }}>
            <Header patient={patient} audience={audience} setAudience={setAudience}
              user={user} setUser={setUser}
              themeMode={themeMode} setThemeMode={setThemeMode} />
            {!acceptedHipaa && <HipaaGate onAccept={() => setAcceptedHipaa(true)} />}

            <div style={{ maxWidth: 1400, margin: '0 auto', padding: '1.5rem 2rem' }}>
              <Tabs tab={tab} setTab={setTab} />

              {tab === 'profile' && <PatientTab patient={patient} setPatient={setPatient}
                audience={audience} setAudience={setAudience}
                setTab={setTab} runResearch={runResearch} busy={busy} />}
              {tab === 'research' && <ResearchTab
                patient={patient} busy={busy} runResearch={runResearch}
                researchText={researchText} treatments={treatments}
                validation={validations.research} evidenceSummary={evidenceSummary}
                dossier={dossier} progress={progress} coverageAudit={coverageAudit}
                chatHistory={chatHistory} userQuery={userQuery}
                setUserQuery={setUserQuery} sendChat={sendChat}
                onAudit={() => auditAnalysis('research')} />}
              {tab === 'trials' && <TrialsTab
                patient={patient} busy={busy} trialsData={trialsData}
                trialBlocks={trialBlocks} trialsText={trialsText}
                validation={validations.trials}
                runTrialsFetch={runTrialsFetch} runTrialsAnalysis={runTrialsAnalysis}
                onAudit={() => auditAnalysis('trials')} />}
              {tab === 'repurpose' && <RepurposeTab
                patient={patient} busy={busy} runResearch={runResearch}
                repurposeText={repurposeText} candidates={candidates}
                validation={validations.repurpose} progress={progress}
                onAudit={() => auditAnalysis('repurpose')} />}
              {tab === 'records' && <RecordsTab
                patient={patient} audience={audience}
                busy={busy} setBusy={setBusy}
                recordsResult={recordsResult} setRecordsResult={setRecordsResult} />}
              {tab === 'chart' && <ChartTab treatments={treatments} candidates={candidates} />}
              {tab === 'refs' && <RefsTab references={references} evidencePack={evidencePack} evidenceSummary={evidenceSummary} />}
            </div>
            <Footer />
          </div>
        );
      };

      /* ==================== Header ==================== */
      // User-menu dropdown state is kept at the app level so the menu can

      // identity (null = anonymous / free-use). We stub it with localStorage

      const loadStoredUser = () => {
        try {
          const raw = localStorage.getItem('mrt_user');
          return raw ? JSON.parse(raw) : null;
        } catch { return null; }
      };

      const Header = ({ patient, audience, setAudience, user, setUser, themeMode, setThemeMode }) => {
        const [menuOpen, setMenuOpen] = useState(false);
        const [signInOpen, setSignInOpen] = useState(false);
        useEffect(() => {

          const close = () => setMenuOpen(false);
          document.addEventListener('click', close);
          return () => document.removeEventListener('click', close);
        }, [menuOpen]);
        const initial = user?.email ? user.email[0].toUpperCase() : '';
        const isLight = themeMode === 'light';

        // Theme-aware header chrome. In dark we keep the deep-navy glass

        const headerBg = isLight ? 'rgba(255, 255, 255, 0.88)' : 'rgba(9, 20, 26, 0.92)';
        const headerShadow = isLight
          ? '0 1px 0 rgba(15,23,42,0.04), 0 4px 18px rgba(15,23,42,0.06)'

        const softPanelBg = isLight ? 'rgba(15,23,42,0.04)' : 'rgba(255,255,255,0.03)';
        const userMenuBg = isLight ? '#ffffff' : '#0b1f2a';
        const optionBg = isLight ? '#ffffff' : '#0b1f2a';

        return (
          <>
            <header style={{
              position: 'sticky', top: 0, zIndex: 20,
              background: headerBg,
              borderBottom: `1px solid ${theme.border}`,
              backdropFilter: 'blur(12px)',
              boxShadow: headerShadow
            }}>
              <div style={{
                maxWidth: 1400, margin: '0 auto',
                padding: '0.75rem 1.5rem',
                display: 'flex', alignItems: 'center', gap: '1rem'
              }}>
                {/* Brand mark + wordmark */}
                <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem', minWidth: 0 }}>
                  <div style={{
                    width: 36, height: 36, borderRadius: 10,
                    background: `linear-gradient(135deg, ${theme.accent} 0%, ${theme.secondary} 100%)`,

                    <Activity size={20} color={theme.primaryText} />

                  <div style={{ display: 'flex', flexDirection: 'column', lineHeight: 1.15 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                      <span style={{
                        fontFamily: '"Crimson Pro", Georgia, serif',
                        fontWeight: 700, fontSize: '1.1rem', color: theme.text, letterSpacing: '-0.01em'
                      }}>
                        Medical Research
                      </span>
                      <span style={{
                        fontSize: '0.62rem', fontWeight: 700, letterSpacing: '0.08em',
                        padding: '0.12rem 0.4rem', borderRadius: 4,

                        Beta
                      </span>
                    </div>
                    <span style={{ fontSize: '0.72rem', color: theme.textDim }}>
                      AI-assisted clinical literature &amp; trial discovery
                    </span>
                  </div>
                </div>

                {/* Center context chip (what we're researching) */}

                <div style={{ flex: 1 }} />

                {/* Audience switcher (quiet, small) */}
                <div style={{

                  <select value={audience} onChange={e => setAudience(e.target.value)}

                      background: 'transparent', color: theme.text, border: 'none',

                  </select>
                </div>

                {/* Theme toggle. Not a ChatGPT-clone sun/moon — rendered as
                    a compact pill that shows BOTH icons with the active

                    in dark" vs "moon means click for dark"). */}
                <div style={{
                  display: 'inline-flex', alignItems: 'center',
                  padding: 3, borderRadius: 999,
                  background: softPanelBg, border: `1px solid ${theme.border}`
                }} title={`Theme: ${isLight ? 'light' : 'dark'} — click to switch`}>
                  {[
                    { mode: 'light', Icon: Sun,  label: 'Light' },
                    { mode: 'dark',  Icon: Moon, label: 'Dark'  }
                  ].map(({ mode, Icon, label }) => {
                    const active = themeMode === mode;
                    return (
                      <button key={mode}
                        onClick={() => setThemeMode(mode)}
                        aria-label={`Switch to ${label.toLowerCase()} mode`}
                        style={{
                          display: 'inline-flex', alignItems: 'center', gap: '0.3rem',
                          padding: '0.32rem 0.6rem', borderRadius: 999,
                          background: active ? theme.accent : 'transparent',
                          color: active ? theme.primaryText : theme.textDim,
                          border: 'none', cursor: 'pointer',
                          fontFamily: 'inherit', fontSize: '0.72rem', fontWeight: 700,
                          letterSpacing: '0.03em'
                        }}>
                        <Icon size={13} color={active ? theme.primaryText : theme.textDim} />
                        {label}
                      </button>
                    );
                  })}
                </div>

                {/* Free-use pill. Uses theme.green (adjusted per palette)
                    so it stays readable against both backgrounds. */}
                <div style={{
                  padding: '0.3rem 0.65rem', borderRadius: 999,
                  background: `${theme.green}22`, border: `1px solid ${theme.green}55`,
                  color: theme.green, fontSize: '0.72rem', fontWeight: 700, letterSpacing: '0.03em',
                  display: 'inline-flex', alignItems: 'center', gap: '0.3rem'
                }}>
                  <span style={{ width: 6, height: 6, borderRadius: 999, background: theme.green, display: 'inline-block' }} />
                  Free during beta
                </div>

                {/* User menu */}
                <div style={{ position: 'relative' }} onClick={e => e.stopPropagation()}>
                  {user ? (
                    <button onClick={() => setMenuOpen(v => !v)} style={{
                      display: 'flex', alignItems: 'center', gap: '0.5rem',
                      padding: '0.3rem 0.5rem 0.3rem 0.35rem', borderRadius: 999,
                      background: softPanelBg, border: `1px solid ${theme.border}`,
                      cursor: 'pointer', color: theme.text, fontFamily: 'inherit'
                    }}>
                      <span style={{
                        width: 28, height: 28, borderRadius: 999,
                        background: `linear-gradient(135deg, ${theme.accent} 0%, ${theme.secondary} 100%)`,
                        color: theme.primaryText, fontWeight: 700, fontSize: '0.8rem',
                        display: 'flex', alignItems: 'center', justifyContent: 'center'
                      }}>{initial}</span>
                      <span style={{ fontSize: '0.8rem', fontWeight: 600, maxWidth: 140, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                        {user.email}
                      </span>
                      <ChevronDown size={14} color={theme.textDim} />
                    </button>
                  ) : (
                    <button onClick={() => setSignInOpen(true)} style={{
                      display: 'flex', alignItems: 'center', gap: '0.4rem',
                      padding: '0.45rem 0.85rem', borderRadius: 8,
                      background: theme.accent, color: theme.primaryText, border: 'none',
                      cursor: 'pointer', fontFamily: 'inherit', fontWeight: 700, fontSize: '0.82rem',
                      boxShadow: `0 1px 0 rgba(255,255,255,0.15) inset, 0 2px 8px ${theme.accentGlow}`
                    }}>
                      <LogIn size={14} /> Sign in
                    </button>
                  )}
                  {menuOpen && user && (
                    <div style={{
                      position: 'absolute', top: 'calc(100% + 8px)', right: 0, minWidth: 240,
                      background: userMenuBg, border: `1px solid ${theme.border}`, borderRadius: 10,
                      padding: '0.5rem', boxShadow: isLight
                        ? '0 12px 32px rgba(15,23,42,0.12)'
                        : '0 12px 32px rgba(0,0,0,0.5)',
                      zIndex: 30
                    }}>
                      <div style={{ padding: '0.6rem 0.6rem 0.8rem', borderBottom: `1px solid ${theme.border}` }}>
                        <div style={{ fontSize: '0.72rem', color: theme.textDim }}>Signed in as</div>
                        <div style={{ fontSize: '0.88rem', fontWeight: 700, color: theme.text, wordBreak: 'break-all' }}>
                          {user.email}
                        </div>
                      </div>
                      {[
                        { icon: Settings,    label: 'Account settings', onClick: () => alert('Account settings coming soon.') },
                        { icon: BookOpen,    label: 'My alerts',        onClick: () => alert('Manage alerts from the Patient Profile tab for now.') },
                        { icon: HelpCircle,  label: 'Help & feedback',  onClick: () => alert('Send feedback to hammad@example.com') }
                      ].map((item, i) => (
                        <button key={i} onClick={item.onClick} style={{
                          display: 'flex', alignItems: 'center', gap: '0.6rem', width: '100%',
                          padding: '0.5rem 0.6rem', background: 'transparent', border: 'none',
                          color: theme.text, cursor: 'pointer', borderRadius: 6, fontSize: '0.85rem',
                          fontFamily: 'inherit', textAlign: 'left'
                        }} onMouseEnter={e => e.currentTarget.style.background = theme.accentSoft}
                           onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                          <item.icon size={14} color={theme.textDim} />
                          {item.label}
                        </button>
                      ))}
                      <div style={{ borderTop: `1px solid ${theme.border}`, marginTop: 4, paddingTop: 4 }}>
                        <button onClick={() => { setUser(null); try { localStorage.removeItem('mrt_user'); } catch {} setMenuOpen(false); }} style={{
                          display: 'flex', alignItems: 'center', gap: '0.6rem', width: '100%',
                          padding: '0.5rem 0.6rem', background: 'transparent', border: 'none',
                          color: theme.red, cursor: 'pointer', borderRadius: 6, fontSize: '0.85rem',
                          fontFamily: 'inherit', textAlign: 'left'
                        }} onMouseEnter={e => e.currentTarget.style.background = `${theme.red}15`}
                           onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                          <LogOut size={14} /> Sign out
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
              {/* Signature "pulse bar" — tiny cyan→amber gradient strip
                  that makes the top of the app instantly recognisable as
                  OURS rather than a generic AI product. */}
              <div className="mrt-pulse-bar" />
              {/* Secondary bar: currently-researching chip, only visible on narrow screens */}
              {patient?.condition && (
                <div style={{
                  maxWidth: 1400, margin: '0 auto', padding: '0.4rem 1.5rem 0.5rem',
                  fontSize: '0.78rem', color: theme.textDim
                }}>
                  <span style={{ color: theme.textDim }}>Researching:</span>{' '}
                  <span style={{ color: theme.accent, fontWeight: 600 }}>{patient.condition}</span>
                </div>
              )}
            </header>

            {signInOpen && (
              <SignInModal onClose={() => setSignInOpen(false)} onSuccess={(u) => {
                setUser(u);
                try { localStorage.setItem('mrt_user', JSON.stringify(u)); } catch {}
                setSignInOpen(false);
              }} />
            )}
          </>
        );
      };

      // Stub sign-in modal. Captures an email + name so the UI has something
      // to personalise with (user menu shows initials/email). We don't yet
      // send this anywhere — it's intentionally offline until we wire a real
      // identity provider (Clerk / Auth0 / NextAuth). The UX is designed so
      // swapping in real auth only replaces the `handleSubmit` body below.
      const SignInModal = ({ onClose, onSuccess }) => {
        const [email, setEmail] = useState('');
        const [name, setName] = useState('');
        const [mode, setMode] = useState('signin'); // 'signin' | 'create'
        const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        const submit = (e) => {
          e?.preventDefault();
          if (!emailOk) return;
          onSuccess({ email: email.trim(), name: name.trim() || email.trim().split('@')[0], createdAt: new Date().toISOString() });
        };
        return (
          <div onClick={onClose} style={{
            position: 'fixed', inset: 0, background: 'rgba(3,10,14,0.7)',
            backdropFilter: 'blur(6px)', zIndex: 200,
            display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem'
          }}>
            <div onClick={e => e.stopPropagation()} style={{
              width: '100%', maxWidth: 420, background: theme.panelSolid,
              borderRadius: 14, border: `1px solid ${theme.border}`,
              padding: '1.75rem',
              boxShadow: theme.name === 'light'
                ? '0 24px 64px rgba(15,23,42,0.18)'
                : '0 24px 64px rgba(0,0,0,0.6)'
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem', marginBottom: '0.75rem' }}>
                <div style={{
                  width: 34, height: 34, borderRadius: 10,
                  background: `linear-gradient(135deg, ${theme.accent} 0%, ${theme.secondary} 100%)`,
                  display: 'flex', alignItems: 'center', justifyContent: 'center'
                }}>
                  <Activity size={18} color={theme.primaryText} />
                </div>
                <div>
                  <h3 style={{ margin: 0, fontSize: '1.05rem', color: theme.text, fontFamily: '"Crimson Pro", Georgia, serif' }}>
                    {mode === 'signin' ? 'Sign in' : 'Create account'}
                  </h3>
                  <p style={{ margin: 0, fontSize: '0.78rem', color: theme.textDim }}>
                    Free during beta · your data stays on your device
                  </p>
                </div>
              </div>
              <form onSubmit={submit}>
                {mode === 'create' && (
                  <div style={{ marginBottom: '0.7rem' }}>
                    <label style={labelStyle}>Name</label>
                    <input value={name} onChange={e => setName(e.target.value)}
                      style={inputStyle} placeholder="Dr. Jane Doe" autoFocus />
                  </div>
                )}
                <div style={{ marginBottom: '0.7rem' }}>
                  <label style={labelStyle}>Email</label>
                  <input value={email} onChange={e => setEmail(e.target.value)}
                    type="email" style={inputStyle} placeholder="you@hospital.org"
                    autoFocus={mode === 'signin'} />
                </div>
                <button type="submit" disabled={!emailOk} style={{
                  ...btn('primary', !emailOk), width: '100%', justifyContent: 'center',
                  marginTop: '0.5rem'
                }}>
                  <LogIn size={14} /> {mode === 'signin' ? 'Continue' : 'Create free account'}
                </button>
              </form>
              <p style={{ marginTop: '0.9rem', marginBottom: 0, textAlign: 'center', fontSize: '0.78rem', color: theme.textDim }}>
                {mode === 'signin' ? 'New here?' : 'Already have an account?'}{' '}
                <button type="button" onClick={() => setMode(m => m === 'signin' ? 'create' : 'signin')}
                  style={{ background: 'transparent', border: 'none', color: theme.accent, cursor: 'pointer', fontWeight: 600, fontFamily: 'inherit', fontSize: '0.78rem' }}>
                  {mode === 'signin' ? 'Create an account' : 'Sign in'}

              </p>
              <p style={{ marginTop: '0.75rem', marginBottom: 0, fontSize: '0.7rem', color: theme.textDim, textAlign: 'center', fontStyle: 'italic' }}>
                Accounts are free and currently local-only. We don't sync, don't share, and don't sell.
              </p>
            </div>
          </div>
        );
      };

      /* ==================== HIPAA Gate ==================== */
      const HipaaGate = ({ onAccept }) => (
        <div style={{
          position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.85)', zIndex: 100,
          display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '2rem'
        }}>
          <div style={{ ...panelStyle, maxWidth: 720, background: theme.panelSolid }}>
            <h2 style={{ marginTop: 0, color: '#ff8b5a', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>

            </ul>
            <p style={{ color: theme.textDim, fontSize: '0.85rem' }}>

      /* ==================== Tabs ==================== */
      const Tabs = ({ tab, setTab }) => {
        const tabs = [
          { id: 'profile',   label: 'Profile',         icon: FileText },
          { id: 'research',  label: 'Research',        icon: Brain },
          { id: 'trials',    label: 'Trials',          icon: Beaker },
          { id: 'repurpose', label: 'Repurposing',     icon: Sparkles },
          { id: 'records',   label: 'Records Audit',   icon: ShieldCheck },

          <nav style={{
            display: 'flex', gap: '0.15rem', marginBottom: '1.5rem', flexWrap: 'wrap',
