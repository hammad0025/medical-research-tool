                fontSize: '0.72rem', fontWeight: 700, letterSpacing: 1.5,
                color: theme.accent, textTransform: 'uppercase'
              }}>
                Drug repurposing · finding new uses for old drugs
              </span>
            </div>
            <h2 style={{ margin: '0 0 0.5rem', fontSize: '1.5rem', lineHeight: 1.25, color: theme.text }}>

            </h2>
            <p style={{ margin: '0 0 0.35rem', color: theme.textDim, fontSize: '0.82rem', fontStyle: 'italic' }}>
              Logic-based drug ideas + published repurposing candidates
            </p>
            <p style={{ margin: '0 0 1rem', color: theme.textDim, fontSize: '0.92rem', lineHeight: 1.55, maxWidth: 780 }}>
              The AI asks a simple question: based on what goes wrong in {cond}, and on how each
              FDA-approved drug works in the body, which existing drugs might help — even if no
              official guideline says to use them this way yet? For each idea, it tells you how the
              drug might work, how strong the proof is (from "just an idea" up to "tested in a large
              study"), how safe it looks, how confident it is, and whether the drug could clash with
              the medicines in your profile.
            </p>
            <div style={{
              margin: '0 0 1rem', padding: '0.75rem 0.9rem', borderRadius: 10,
              border: `1px solid ${theme.accent}55`, background: `${theme.accent}10`,
              fontSize: '0.85rem', lineHeight: 1.55, color: theme.text
            }}>
              <strong style={{ color: theme.accent }}>Two buckets of candidates:</strong>{' '}
              <span style={{ color: theme.textDim }}>
                (1) <strong style={{ color: theme.text }}>Logic-based ideas</strong> — drugs that could make sense based on how the disease and the drug work, even though no one has studied them for {cond} yet; marked <em>Just an idea</em> or <em>Tested in the lab only</em>.
                (2) <strong style={{ color: theme.text }}>Backed by studies</strong> — drugs that already have some human evidence, from single patient reports up to large studies.
              </span>
            </div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.6rem', marginBottom: '1.1rem' }}>
              {[
                { icon: <Brain size={13} />,    label: 'Looks at how the disease and drugs work' },
                { icon: <Database size={13} />, label: 'Shows how strong the proof is for each' },
                { icon: <Shield size={13} />,   label: 'Checks against the medicines you take' },
                { icon: <MessageCircle size={13} />, label: 'What to say to your doctor' }
              ].map((f, i) => (
                <span key={i} style={{
                  display: 'inline-flex', alignItems: 'center', gap: '0.35rem',
                  padding: '0.3rem 0.7rem', borderRadius: 999,
                  background: theme.panel, border: `1px solid ${theme.border}`,
                  color: theme.textDim, fontSize: '0.76rem', fontWeight: 600
                }}>
                  <span style={{ color: theme.accent }}>{f.icon}</span>{f.label}
                </span>
              ))}
            </div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.75rem', alignItems: 'center' }}>
              <button style={{ ...btn('primary', !!busy), padding: '0.75rem 1.2rem', fontSize: '0.95rem' }}
                disabled={!!busy}
                onClick={() => runResearch('repurpose')}>
                {busy === 'repurpose'
                  ? <><Loader size={16} className="spin" /> Looking through the drug list…</>
                  : <><Sparkles size={16} /> Find drug ideas for {cond}</>}
              </button>
              <span style={{ fontSize: '0.78rem', color: theme.yellow, display: 'inline-flex', alignItems: 'center', gap: '0.3rem' }}>
                <AlertTriangle size={13} /> These are ideas only — not a prescription.
              </span>
            </div>
          </div>
        );
      };

      const RepurposeTab = ({ patient, audience, busy, runResearch, repurposeText, candidates, validation, progress, onAudit, runtimeConfig, runMeta, drugScreen }) => {
        const [showRaw, setShowRaw] = useState(false);
        const [translatedText, setTranslatedText] = useState('');
        const renderedRepurposeText = translatedText || repurposeText;
        const { mechanistic, withEvidence } = useMemo(() => partitionCandidates(candidates), [candidates]);
        const byStrength = {
          LARGE_RCT:        candidates.filter(c => evidenceMeta(c.evidence_strength).rank === 6).length,
          SMALL_RCT:        candidates.filter(c => evidenceMeta(c.evidence_strength).rank === 5).length,
          OBSERVATIONAL:    candidates.filter(c => evidenceMeta(c.evidence_strength).rank === 4).length,
          CASE_REPORT:      candidates.filter(c => evidenceMeta(c.evidence_strength).rank === 3).length,
          PRECLINICAL:      candidates.filter(c => evidenceMeta(c.evidence_strength).rank === 2).length,
          MECHANISTIC_ONLY: candidates.filter(c => evidenceMeta(c.evidence_strength).rank === 1).length
        };
        const hasRun = !!repurposeText || candidates.length > 0;
        return (
          <div id="mrt-repurpose-export-target" style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
            <AdSlot runtimeConfig={runtimeConfig} slotKey="repurposeTop" />
            <RepurposeHero patient={patient} busy={busy} runResearch={runResearch} />

            {audience !== 'medical' && hasRun && candidates.length > 0 && !candidates.some(c => c.what_it_does) && (
              <div style={{
                ...panelStyle, padding: '0.75rem 1rem',
                borderLeft: `3px solid ${theme.yellow}`,
                background: `${theme.yellow}12`, fontSize: '0.86rem', color: theme.text, lineHeight: 1.5
              }}>
                <strong>Run it again for plain language.</strong> This result was made before the readability update.
                Click <strong>Find drug ideas</strong> again — with <em>Everyday words</em> chosen at the top — to get
                &ldquo;What it is&rdquo; summaries and simpler wording on every drug card.
              </div>
            )}

            <RepurposeExplainer />

            <DeepResearchProgress progress={progress} />

            {drugScreen && drugScreen.libraryTotal > 0 && (
              <div style={{
                ...panelStyle,
                padding: '0.75rem 0.9rem',
                borderLeft: `3px solid ${theme.accent}`,
                display: 'flex', flexWrap: 'wrap', gap: '0.5rem', alignItems: 'center'
              }}>
                <span style={{ color: theme.textDim, fontSize: '0.72rem', fontWeight: 700, letterSpacing: '0.05em', textTransform: 'uppercase' }}>
                  How we picked drug ideas
                </span>
                <span
                  title={`We start from a curated library of ${drugScreen.libraryTotal.toLocaleString()} FDA-tracked drugs (${drugScreen.approvedTotal?.toLocaleString() || '?'} approved in the US). For ${drugScreen.condition || patient.condition || 'your condition'}, we selected ${drugScreen.selectedCount} that match the disease biology — then the AI only cites claims backed by live PubMed literature.`}
                  style={{
                    padding: '0.2rem 0.55rem', borderRadius: 999, fontSize: '0.72rem',
                    background: `${theme.accent}22`, color: theme.accent, fontWeight: 600,
                    border: `1px solid ${theme.accent}55`, cursor: 'help'
                  }}
                >
                  Screened {drugScreen.libraryTotal.toLocaleString()} FDA-tracked drugs → selected {drugScreen.selectedCount} for {drugScreen.condition || patient.condition || 'this condition'}
                </span>
                {drugScreen.selectedNames?.length > 0 && (
                  <span style={{ color: theme.textDim, fontSize: '0.72rem' }}>
                    Starting set includes {drugScreen.selectedNames.slice(0, 6).join(', ')}
                    {drugScreen.selectedNames.length > 6 ? ` +${drugScreen.selectedNames.length - 6} more` : ''}
                  </span>
                )}
              </div>
            )}

            <ValidatorPanel validation={validation} onAudit={onAudit} canAudit={!!repurposeText} />

            {candidates.length > 0 && (
              <div style={panelStyle}>
                <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'baseline', gap: '0.5rem' }}>
                  <h3 style={{ margin: 0, color: theme.accent, fontSize: '1.05rem' }}>
                    {candidates.length} candidate{candidates.length === 1 ? '' : 's'}
                    <span style={{ color: theme.textDim, fontWeight: 500, fontSize: '0.85rem', marginLeft: '0.5rem' }}>
                      · {mechanistic.length} logic-based · {withEvidence.length} with published support
                    </span>
                  </h3>
                </div>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem', marginTop: '0.5rem' }}>
                  {EVIDENCE_LADDER.slice().reverse().map(l => byStrength[l.key] ? (
                    <span key={l.key} title={l.label} style={{
                      padding: '0.25rem 0.6rem', borderRadius: 999, fontSize: '0.7rem',
                      border: `1px solid ${l.color}66`, background: `${l.color}18`,
                      color: l.color, fontWeight: 700
                    }}>
                      {byStrength[l.key]} × {l.label}
                    </span>
                  ) : null)}
                </div>
              </div>
            )}

            <div style={{
              ...panelStyle,
              borderLeft: `4px solid ${theme.accent}`,
              background: `linear-gradient(90deg, ${theme.accent}12 0%, ${theme.panel} 55%)`
            }}>
              <h3 style={{ margin: '0 0 0.35rem', color: theme.accent, fontSize: '1.05rem', display: 'flex', alignItems: 'center', gap: '0.45rem' }}>
                <Brain size={18} />
                {audience === 'medical'
                  ? 'Logic-based candidates (pathway reasoning — verify human data below)'
                  : 'Drug ideas from biology — check the links before asking your doctor'}
              </h3>
              <p style={{ margin: '0 0 0.85rem', color: theme.textDim, fontSize: '0.86rem', lineHeight: 1.55 }}>
                {audience === 'medical'
                  ? 'These are hypothesis-generation ideas from pathway reasoning — not prescriptions. Every item is labeled by evidence tier.'
                  : 'These are educated guesses based on how the disease works and what each drug does — not proven treatments. Each card explains the drug in plain English and why it might be worth asking your doctor about.'}
              </p>
              {mechanistic.length > 0 ? (
                <div style={{ display: 'grid', gap: '0.85rem' }}>
                  {mechanistic.map((c, i) => (
                    <CandidateCard key={`m-${i}`} c={c} rank={i + 1} highlightMechanistic={true} audience={audience} />

              ) : hasRun ? (
                <div style={{
                  textAlign: 'center', padding: '1.25rem', color: theme.textDim,
                  border: `1px dashed ${theme.border}`, borderRadius: 10, fontSize: '0.88rem'
                }}>

                </div>
              ) : (
                <div style={{
                  textAlign: 'center', padding: '1.25rem', color: theme.textDim,
                  border: `1px dashed ${theme.border}`, borderRadius: 10, fontSize: '0.88rem'
                }}>
                  Click &ldquo;Find drug ideas&rdquo; to start — the AI is asked to include logic-based ideas too.
                </div>
              )}
            </div>

            {(withEvidence.length > 0 || (hasRun && mechanistic.length > 0)) && (
              <div style={panelStyle}>
                <h3 style={{ margin: '0 0 0.35rem', color: theme.accent, fontSize: '1.05rem', display: 'flex', alignItems: 'center', gap: '0.45rem' }}>
                  <Database size={18} />
                  Drugs already backed by studies
                </h3>
                <p style={{ margin: '0 0 0.85rem', color: theme.textDim, fontSize: '0.86rem', lineHeight: 1.55 }}>

                </p>
                {withEvidence.length > 0 ? (
                  <div style={{ display: 'grid', gap: '0.85rem' }}>

                  <div style={{
                    textAlign: 'center', padding: '1rem', color: theme.textDim,
                    border: `1px dashed ${theme.border}`, borderRadius: 10, fontSize: '0.88rem'

                    Every idea this time was a logic-based idea, not yet backed by studies.
                  </div>

              </div>

            <CostMeter meta={runMeta} label="Repurpose run cost" />

            {repurposeText && (

                    <button onClick={() => setShowRaw(v => !v)} style={{
                      background: 'transparent', border: `1px solid ${theme.border}`,
                      color: theme.textDim, padding: '0.3rem 0.7rem', borderRadius: 6,
                      fontSize: '0.75rem', cursor: 'pointer'
                    }}>
                      {showRaw ? 'Hide' : 'Show'} raw
                    </button>
                    <AnalysisLanguageToolbar
                      sourceText={repurposeText}
                      translatedText={translatedText}
                      setTranslatedText={setTranslatedText}
                      exportElementId="mrt-repurpose-export-target"
                      exportBaseFilename={`repurpose-${(patient.condition || 'analysis').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}`}
                    />
                </div>
                {showRaw && (
                  <div style={{ marginTop: '0.6rem' }}>
                    {translatedText && (
                      <div data-pdf-exclude="1" style={{ marginBottom: '0.6rem', fontSize: '0.78rem', color: theme.textDim }}>
                        You're seeing the translated version. The original English does not change.
                      </div>
                    )}
                    <Markdown text={renderedRepurposeText} />
                  </div>
                )}
              </div>
            )}
          </div>
        );
      };

      /* ==================== Comparison Chart Tab ==================== */
      const ChartTab = ({ treatments, candidates }) => {
        const exportCsv = () => {
          const rows = [
            ['Provider','Treatment','FDA Status','Length/Frequency','How well it works %','How safe %','Risks','Interactions','Cost']
          ];
          treatments.forEach(t => rows.push([
            t.provider||'', t.treatment||'', t.fda_status||'', t.length_frequency||'',
            t.efficacy_pct||'', t.safety_pct||'', t.risks||'', t.interactions||'', t.cost||''
          ]));
          const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
          const blob = new Blob([csv], { type: 'text/csv' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'treatment-comparison.csv';
          a.click();
        };
        return (
          <div style={panelStyle}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.5rem' }}>
              <h2 style={{ margin: 0, color: theme.accent, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <TrendingUp size={22} /> Treatment Comparison · best at top
              </h2>
              <button style={btn('ghost', treatments.length === 0)} disabled={treatments.length === 0} onClick={exportCsv}>
                <Download size={16} /> Export CSV
              </button>
            </div>
            <p style={{ color: theme.textDim, fontSize: '0.85rem' }}>
              How well it works and how safe it is are both scored 1 to 100 (higher is better for both). Sorted by how well it works.
            </p>
            {treatments.length === 0 && candidates.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '2rem', color: theme.textDim }}>
                Nothing to compare yet. Run a <strong>Detailed Report</strong> or <strong>Drug Repurposing</strong> first.
              </div>
            ) : (
              <>
                {treatments.length > 0 && <ComparisonTable rows={treatments} variant="treatment" />}
                {candidates.length > 0 && (
                  <>
                    <h3 style={{ color: theme.accent, marginTop: '1.25rem', fontSize: '1rem' }}>
                      Drug ideas (not proven)
                    </h3>
                    <p style={{ color: theme.textDim, fontSize: '0.82rem', margin: '0.25rem 0 0' }}>
                      Logic-based rows have dashed <em>Just an idea</em> / lab-only badges; rows backed by studies show how strong the proof is.
                    </p>
                    <ComparisonTable rows={candidates} variant="candidate" />
                  </>
                )}
              </>
            )}
          </div>
        );
      };

      const ComparisonTable = ({ rows, variant }) => {
        const cols = variant === 'treatment'
          ? [
              { k: 'provider',          h: 'Provider / Clinic',   w: 180 },
              { k: 'treatment',         h: 'Treatment description', w: 260 },
              { k: 'fda_status',        h: 'FDA status',          w: 120 },
              { k: 'length_frequency',  h: 'Length / Freq',       w: 140 },
              { k: 'efficacy_pct',      h: 'How well it works',   w: 110, bar: true },
              { k: 'safety_pct',        h: 'How safe',            w: 110, bar: true },
              { k: 'risks',             h: 'Risks',               w: 220 },
              { k: 'interactions',      h: 'Drug interactions',   w: 180 },
              { k: 'cost',              h: 'Cost / Insurance',    w: 140 },
              { k: 'references',        h: 'Sources',             w: 200, links: true }
            ]
          : [
              { k: 'candidate',                 h: 'Drug',            w: 160 },
              { k: 'evidence_strength',         h: 'How strong the proof is',   w: 130, badge: true },
              { k: 'class',                     h: 'Type of drug',    w: 140 },
              { k: 'approved_for',              h: 'Normally used for',    w: 180 },
              { k: 'repurpose_rationale',       h: 'Why it might help', w: 280 },
              { k: 'efficacy_hypothesis_pct',   h: 'Likely to work', w: 110, bar: true },
              { k: 'safety_pct',                h: 'How safe',          w: 110, bar: true },
              { k: 'patient_specific_risks',    h: 'Risks for you', w: 220 },
              { k: 'supporting_evidence',       h: 'Sources',             w: 200, links: true }
            ];
        return (
          <div style={{ overflowX: 'auto', marginTop: '0.75rem' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '0.82rem' }}>
              <thead>
                <tr style={{ background: theme.accentSoft, borderBottom: `2px solid ${theme.accent}` }}>
                  {cols.map(c => (
                    <th key={c.k} style={{ padding: '0.6rem', textAlign: c.bar ? 'center' : 'left',
                      color: theme.accent, fontWeight: 700, minWidth: c.w }}>{c.h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.map((r, i) => (
                  <tr key={i} style={{ borderBottom: `1px solid ${theme.border}`, verticalAlign: 'top' }}>
                    {cols.map(c => {
                      const v = r[c.k];
                      if (c.badge) {
                        return (
                          <td key={c.k} style={{ padding: '0.6rem', lineHeight: 1.5 }}>
                            {v ? <EvidenceStrengthBadge value={v} /> : '—'}
                          </td>
                        );
                      }
                      if (c.bar) {
                        const n = typeof v === 'number' ? v : null;
                        const col = ratingColor(n);
                        // Surface the model's one-line "why" for each %.
                        // The parser stores it on `<field>_note` for both
                        // treatments (efficacy_note/safety_note) and
                        // repurpose candidates (efficacy_hypothesis_note,
                        // safety_note, confidence_note).
                        const noteKey = c.k.replace(/_pct$/, '_note');
                        const note = r[noteKey];
                        return (
                          <td
                            key={c.k}
                            style={{ padding: '0.6rem', textAlign: 'center', cursor: note ? 'help' : 'default' }}
                            title={note || ''}
                          >
                            <div style={{ color: col, fontWeight: 700 }}>{n != null ? n + '%' : '—'}</div>
                            {n != null && (
                              <div style={{ width: 70, height: 5, background: theme.panel,
                                border: `1px solid ${theme.border}`,
                                borderRadius: 3, margin: '4px auto 0', overflow: 'hidden' }}>
                                <div style={{ width: `${n}%`, height: '100%', background: col }} />
                              </div>
                            )}
                            {note && (
                              <div style={{
                                marginTop: 5, fontSize: '0.7rem', color: theme.textDim,
                                lineHeight: 1.4, fontStyle: 'italic', textAlign: 'left'
                              }}>
                                {note.length > 140 ? note.slice(0, 137) + '…' : note}
                              </div>
                            )}
                          </td>
                        );
                      }
                      if (c.links) {
                        const cellLinks = extractLinksFromText(v);
                        if (!cellLinks.length && !v) return <td key={c.k} style={{ padding: '0.6rem', lineHeight: 1.5 }}>—</td>;
                        if (!cellLinks.length) return (
                          <td key={c.k} style={{ padding: '0.6rem', lineHeight: 1.5 }}>
                            <Markdown text={v} />
                          </td>
                        );
                        return (
                          <td key={c.k} style={{ padding: '0.6rem', lineHeight: 1.5 }}>
                            <div style={{ display: 'grid', gap: '0.25rem' }}>
                              {cellLinks.map((l, j) => (
                                <a key={j} href={l.url} target="_blank" rel="noopener noreferrer"
                                  style={{ color: theme.accent, fontSize: '0.78rem', wordBreak: 'break-all' }}>
                                  {l.label} ↗
                                </a>
                              ))}
                            </div>
                          </td>
                        );
                      }
                      return <td key={c.k} style={{ padding: '0.6rem', lineHeight: 1.5 }}>{v || '—'}</td>;
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      };

      /* ==================== References Tab ==================== */
      // Two sections now:
      //   1. The grounded evidence pack that was fed to Claude — with per-source
      //      access-level badges (full-text / abstract / metadata-only).
      //   2. The raw URLs Claude's narrative emitted — parsed from its text.
      const RefsTab = ({ references, evidencePack, evidenceSummary }) => {
        const pubmedRefs = references.filter(r => r.url.includes('pubmed') || r.url.includes('doi.org'));
        const trialRefs = references.filter(r => r.url.includes('clinicaltrials.gov'));
        const otherRefs = references.filter(r => !pubmedRefs.includes(r) && !trialRefs.includes(r));
        const Section = ({ title, items }) => items.length === 0 ? null : (
          <div style={{ marginBottom: '1.25rem' }}>
            <h3 style={{ color: theme.accent, fontSize: '1rem', marginBottom: '0.5rem' }}>{title} ({items.length})</h3>
            <div style={{ display: 'grid', gap: '0.5rem' }}>
              {items.map((r, i) => (
                <div key={i} style={{
                  padding: '0.6rem 0.75rem', background: theme.panel,
                  borderRadius: 8, border: `1px solid ${theme.border}`
                }}>
                  <a href={r.url} target="_blank" rel="noopener"
                    style={{ fontSize: '0.88rem', wordBreak: 'break-all' }}>
                    {r.quote || r.url}
                  </a>
                  {r.quote && <div style={{ fontSize: '0.85rem', fontStyle: 'italic', marginTop: '0.3rem', color: theme.textDim }}>
                    “{r.quote}”
                  </div>}
                </div>
              ))}
            </div>
          </div>
        );
        return (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
            <div style={panelStyle}>
              <h2 style={{ margin: 0, color: theme.accent, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <Book size={22} /> Sources & Research
              </h2>
              <p style={{ color: theme.textDim, fontSize: '0.9rem' }}>
                Every source the AI was allowed to use, with a badge showing how much of each paper
                we could actually read. Many medical journals charge for access — we only use what is
                free and legal to share (the whole paper when it is open, or just the short summary
                otherwise), and the AI is not allowed to claim more than it saw.
              </p>
              {evidenceSummary?.accessBreakdown && (
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem', marginTop: '0.75rem' }}>
                  <AccessBadge level="full-text"     n={evidenceSummary.accessBreakdown['full-text']} />
                  <AccessBadge level="abstract"      n={evidenceSummary.accessBreakdown['abstract']} />
                  <AccessBadge level="metadata-only" n={evidenceSummary.accessBreakdown['metadata-only']} />
                </div>
              )}
            </div>

            {evidencePack && evidencePack.length > 0 && (
              <div style={panelStyle}>
                <h3 style={{ marginTop: 0, color: theme.accent, fontSize: '1rem' }}>
                  Sources the AI used ({evidencePack.length})
                </h3>
                <div style={{ display: 'grid', gap: '0.5rem' }}>
                  {evidencePack.slice(0, 40).map((p, i) => {
                    const url = p.pmcUrl || p.pubmedUrl || p.doiUrl || p.oaUrl || p.landingUrl || p.europePmcUrl;
                    const excerpt = (p.fullText || p.abstract || '').slice(0, 260);
                    return (
                      <div key={i} style={{
                        padding: '0.75rem', background: theme.panel,
                        borderRadius: 8, border: `1px solid ${theme.border}`
                      }}>
                        <div style={{ display: 'flex', gap: '0.4rem', flexWrap: 'wrap', alignItems: 'center' }}>
                          {p.isCuratedKB && <KBBadge category={p.category} />}
                          <AccessBadge level={p.accessLevel || 'metadata-only'} />
                          {p.journalTier && (
                            <span style={{
                              fontSize: '0.7rem', padding: '0.15rem 0.5rem',
                              borderRadius: 4, background: theme.accentSoft,
                              color: theme.accent, fontWeight: 600
                            }}>Tier {p.journalTier}</span>
                          )}
                          <CountryBadge country={p.firstAuthorCountry} />
                          {(p.qualityFlags || [])
                            .filter((f) => f.key !== 'top-tier-journal' && f.key !== 'curated-kb')
                            .slice(0, 4)
                            .map((f, idx) => <QualityFlagBadge key={idx} flag={f} />)}
                          {(p.sources || []).map((s) => (
                            <span key={s} style={{
                              fontSize: '0.7rem', padding: '0.15rem 0.5rem',
                              borderRadius: 4, background: theme.panel,
                              color: theme.textDim
                            }}>{s}</span>
                          ))}
                          {p.unpaywall && (
                            <span title={`A free, legal full copy was found online (${p.unpaywall.oaStatus}, ${p.unpaywall.version})`} style={{
                              fontSize: '0.7rem', padding: '0.15rem 0.5rem',
                              borderRadius: 4, background: 'rgba(110, 231, 183, 0.15)',
                              color: theme.green, fontWeight: 600
                            }}>Free full copy</span>
                          )}
                        </div>
                        <div style={{ fontWeight: 600, marginTop: '0.4rem', fontSize: '0.92rem' }}>
                          {p.title || '(untitled)'}
                        </div>
                        <div style={{ fontSize: '0.78rem', color: theme.textDim, marginTop: 2 }}>
                          {p.journal || 'Unknown journal'}{p.year ? ` · ${p.year}` : ''}
                          {typeof p.citedByCount === 'number' ? ` · cited ${p.citedByCount}×` : ''}
                          {p.authorLine ? ` · ${p.authorLine}` : ''}
                        </div>
                        {excerpt && (
                          <div style={{
                            fontSize: '0.82rem', color: theme.text, marginTop: '0.4rem',
                            fontStyle: 'italic', lineHeight: 1.5
                          }}>
                            “{excerpt}{(p.fullText || p.abstract || '').length > 260 ? '…' : ''}”
                          </div>
                        )}
                        {url && (
                          <div style={{ marginTop: '0.4rem' }}>
                            <a href={url} target="_blank" rel="noopener"
                               style={{ fontSize: '0.82rem', wordBreak: 'break-all' }}>
                              {url}
                            </a>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            <div style={panelStyle}>
              <h3 style={{ marginTop: 0, color: theme.accent, fontSize: '1rem' }}>
                Links the AI gave in your report
              </h3>
              <p style={{ color: theme.textDim, fontSize: '0.85rem', marginTop: 0 }}>
                Every link the AI gave you, across all tabs, with duplicates removed. If a link is
                broken, that is a warning sign — the second-AI check also tests these links.
              </p>
              {references.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '1.5rem', color: theme.textDim }}>
                  No sources yet. Run any research tab to fill this in.
                </div>
              ) : (
                <div style={{ marginTop: '0.75rem' }}>
                  <Section title="PubMed / DOI" items={pubmedRefs} />
                  <Section title="ClinicalTrials.gov" items={trialRefs} />
                  <Section title="Other" items={otherRefs} />
                </div>
              )}
            </div>
          </div>
        );
      };

      /* ==================== Footer ==================== */
      const TermsLink = () => {
        const { openTerms } = React.useContext(TermsContext);
        return (
          <button type="button" onClick={openTerms} style={{
            background: 'transparent', border: 'none', color: theme.accent,
            cursor: 'pointer', fontWeight: 600, fontFamily: 'inherit', fontSize: 'inherit', padding: 0
          }}>
            Terms of Use
          </button>
        );
      };

      const Footer = ({ runtimeConfig }) => (
        <footer style={{
          maxWidth: 1400, margin: '0 auto', padding: '1.5rem 2rem 2.5rem',
          color: theme.textDim, fontSize: '0.78rem'
        }}>
          <AdSlot runtimeConfig={runtimeConfig} slotKey="footer" minHeight={80} />
          <div style={{ borderTop: `1px solid ${theme.border}`, paddingTop: '1rem', lineHeight: 1.65 }}>
              <div style={{ marginBottom: '0.6rem' }}>
              <strong>For learning and research only.</strong> researchingmycondition.com is not medical advice,
              and using it does not make us your doctor. Talk to a licensed doctor before you make any
              treatment decision. This early version does not follow HIPAA privacy rules — do not type
              anything that could identify a person.{' '}
              <TermsLink />
            </div>
            <div style={{ color: theme.textDim, opacity: 0.85 }}>
              <strong>Where the facts come from:</strong> ClinicalTrials.gov · NCBI PubMed · Europe PMC ·
              OpenAlex · openFDA · Unpaywall · Cochrane Library · our trusted, hand-picked sources.
              <br />
              <strong>How it's made:</strong> An AI writes the report, and a second, separate AI can
              re-check every claim against the same research (when set up).
            </div>
          </div>
        </footer>
      );

      /* ==================== Sticky disclaimer banner ====================
         Dorothy explicitly asked: "can we have a banner at the bottom of
         everything that says this is not medical advice... nothing
         discovered on this site should be relied upon in the absence of
         a medical doctor." This bar sits fixed at the bottom of the
         viewport on every screen (incl. gate, profile, results). The
         body padding-bottom is bumped so content never hides behind it.
      ================================================================== */
      const StickyDisclaimer = () => (
        <div
          role="contentinfo"
          aria-label="Medical disclaimer"
          style={{
            position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 9999,
            background: 'rgba(120, 20, 20, 0.96)',
            color: '#fff5f5',
            borderTop: '2px solid rgba(255, 255, 255, 0.25)',
            boxShadow: '0 -4px 18px rgba(0,0,0,0.35)',
            padding: '0.55rem 0.9rem',
            fontSize: '0.78rem',
            lineHeight: 1.45,
            textAlign: 'center'
          }}
        >
          <strong style={{ color: '#fff' }}>NOT MEDICAL ADVICE.</strong>{' '}
          This tool is for learning only. Do not rely on anything here
          without a licensed doctor. Using it does not make us your doctor.
          Always check with your doctor before you make any treatment
          decision.
        </div>
      );

      /* ==================== Access gate UI ====================
         The first screen the user sees on a fresh device. If the deploy
         has MRT_ACCESS_PASSCODE set, the user MUST enter a matching
         passcode before the app loads. If the gate is OFF on the server
         (env var unset) we let the app render immediately — that path
         is for local dev and the test harness.
      ======================================================== */
      const probeAccessGate = async () => {
        // Cheap GET-like probe via the runtime-config mode of /api/research.
        // Returns 200 when gate is off or passcode is valid, 401 when blocked.
        try {
          const r = await __mrtNativeFetch('/api/research', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(getStoredPasscode() ? { 'x-access-passcode': getStoredPasscode() } : {})
            },
            body: JSON.stringify({ mode: 'runtime-config' })
          });
          if (r.status === 401) {
            const body = await r.json().catch(() => null);
            return { ok: false, gateEnabled: true, reason: body?.error || 'Access denied.' };
          }
          if (!r.ok) return { ok: false, gateEnabled: false, reason: `Probe HTTP ${r.status}` };
          return { ok: true, gateEnabled: false };
        } catch (e) {
          return { ok: false, gateEnabled: false, reason: e?.message || 'Network error' };
        }
      };

      const AccessGate = () => {
        // 'probing' on first paint so we don't flash either screen.
        const [state, setState] = useState({ status: 'probing' });
        const [input, setInput] = useState('');
        const [submitting, setSubmitting] = useState(false);
        const [error, setError] = useState('');

        const runProbe = async () => {
          const result = await probeAccessGate();
          if (result.ok) {
            setState({ status: 'allowed' });
          } else if (result.gateEnabled) {
            setStoredPasscode('');
            setState({ status: 'blocked', reason: result.reason });
          } else {
            // Network error or non-gate failure — let the app render
            // anyway so the existing in-app error UI can surface details.
            setState({ status: 'allowed' });
          }
        };

        useEffect(() => { runProbe(); }, []);

        useEffect(() => {
          const onDenied = () => {
            setStoredPasscode('');
            setState({ status: 'blocked', reason: 'Access passcode rejected. Please re-enter.' });
          };
          window.addEventListener('mrt:access-denied', onDenied);
          return () => window.removeEventListener('mrt:access-denied', onDenied);
        }, []);

        const submit = async (e) => {
          e?.preventDefault?.();
          const v = input.trim();
          if (!v) return;
          setSubmitting(true);
          setError('');
          try {
            const r = await __mrtNativeFetch('/api/research', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-access-passcode': v },
              body: JSON.stringify({ mode: 'runtime-config' })
            });
            if (r.ok) {
              setStoredPasscode(v);
              setState({ status: 'allowed' });
            } else if (r.status === 401) {
              setError('That passcode was rejected. Double-check with the admin.');
            } else {
              setError(`Server returned HTTP ${r.status}. Try again in a moment.`);
            }
          } catch (err) {
            setError(err?.message || 'Network error.');
          } finally {
            setSubmitting(false);
          }
        };

        if (state.status === 'probing') {
          return (
            <>
              <div style={{
                minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center',
                color: '#9bb4c0', fontFamily: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif',
                fontSize: '0.95rem'
              }}>
                Checking access…
              </div>
              <StickyDisclaimer />
            </>
          );
        }
        if (state.status === 'blocked') {
          return (
            <>
              <div style={{
                minHeight: '100vh',
                background: 'radial-gradient(ellipse at top, #0d2030 0%, #061018 55%, #030910 100%)',
                color: '#eef5fa',
                fontFamily: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                padding: '2rem 1rem 5rem'
              }}>
                <form onSubmit={submit} style={{
                  maxWidth: 460, width: '100%',
                  background: 'rgba(16, 38, 56, 0.92)',
                  border: '1px solid rgba(125, 211, 252, 0.22)',
                  borderRadius: 12,
                  padding: '2rem 1.75rem',
                  boxShadow: '0 24px 60px rgba(0, 0, 0, 0.55)'
                }}>
                  <h1 style={{
                    margin: '0 0 0.4rem', fontSize: '1.45rem',
                    fontFamily: '"Crimson Pro", Georgia, serif', color: '#22d3ee'
                  }}>
                    Private preview
                  </h1>
                  <p style={{ margin: '0 0 1.25rem', color: '#b8cdd9', lineHeight: 1.5, fontSize: '0.92rem' }}>
                    researchingmycondition.com is restricted to invited testers.
                    Enter the access passcode you were given to continue.
                  </p>
                  <label htmlFor="mrt-passcode" style={{
                    display: 'block', fontSize: '0.78rem', color: '#b8cdd9',
                    textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 6
                  }}>
                    Access passcode
                  </label>
                  <input
                    id="mrt-passcode"
                    type="password"
                    autoComplete="off"
                    autoCapitalize="none"
                    autoCorrect="off"
                    spellCheck={false}
                    autoFocus
                    value={input}
                    onChange={(e) => setInput(e.target.value)}
                    placeholder="Enter passcode"
                    style={{
                      width: '100%', boxSizing: 'border-box',
                      padding: '0.7rem 0.85rem', fontSize: '0.95rem',
                      background: 'rgba(3, 10, 18, 0.55)',
                      border: '1px solid rgba(125, 211, 252, 0.32)',
                      color: '#f5fafd', borderRadius: 8, outline: 'none'
                    }}
                  />
                  {error && (
                    <div style={{
                      marginTop: '0.7rem', color: '#fda4af', fontSize: '0.85rem'
                    }}>
                      {error}
                    </div>
                  )}
                  {state.reason && !error && (
                    <div style={{
                      marginTop: '0.7rem', color: '#fcd34d', fontSize: '0.82rem', opacity: 0.85
                    }}>
                      {state.reason}
                    </div>
                  )}
                  <button
                    type="submit"
                    disabled={submitting || !input.trim()}
                    style={{
                      marginTop: '1.25rem', width: '100%',
                      padding: '0.75rem 1rem', fontSize: '0.95rem',
                      background: submitting || !input.trim() ? 'rgba(34, 211, 238, 0.35)' : '#22d3ee',
                      color: '#062032',
                      border: 'none', borderRadius: 8, fontWeight: 600,
                      cursor: submitting || !input.trim() ? 'not-allowed' : 'pointer'
                    }}
                  >
                    {submitting ? 'Checking…' : 'Unlock'}
                  </button>
                  <p style={{
                    marginTop: '1.25rem', fontSize: '0.75rem', color: '#7c97a3', lineHeight: 1.5
                  }}>
                    If you don't have a passcode, contact the project owner
                    (shaque025@gmail.com). Your passcode is stored only on
                    this device.
                  </p>
                </form>
              </div>
              <StickyDisclaimer />
            </>
          );
        }
        // allowed → render the real app + persistent disclaimer.
        return (
          <>
            <TermsAcceptanceGate>
              <App />
            </TermsAcceptanceGate>
            <StickyDisclaimer />
          </>
        );
      };

      ReactDOM.render(<AccessGate />, document.getElementById('root'));
    </script>
</body>
</html>
