      };

      const KBPanel = ({ kb }) => {
        const [expanded, setExpanded] = useState(false);
        if (!kb || !kb.matched) return null;
        const facts = (kb.canonicalFacts || []).slice(0, expanded ? 99 : 4);
        const lifestyle = (kb.lifestyleRecommendations || []).slice(0, expanded ? 99 : 3);
        const redFlags = (kb.redFlags || []).slice(0, expanded ? 99 : 3);
        return (
          <div style={{
            ...panelStyle,
            borderLeft: `3px solid ${theme.accent}`,
            background: `linear-gradient(90deg, ${theme.accent}10 0%, ${panelStyle.background} 60%)`
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.5rem' }}>
              <h3 style={{ margin: 0, color: theme.accent, fontSize: '1rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <Award size={18} /> Trusted medical references · {kb.condition}
              </h3>
              <div style={{ display: 'flex', gap: '0.4rem', flexWrap: 'wrap' }}>
                <span style={{
                  padding: '0.2rem 0.6rem', borderRadius: 999, fontSize: '0.7rem',
                  background: `${theme.accent}22`, color: theme.accent, fontWeight: 600
                }}>
                  {kb.itemCount} saved references
                </span>
                {kb.version && (
                  <span style={{
                    padding: '0.2rem 0.6rem', borderRadius: 999, fontSize: '0.7rem',
                    background: theme.panel, color: theme.textDim
                  }}>
                    v{kb.version}
                  </span>
                )}
                {kb.lastRefreshedAt && (
                  <span style={{
                    padding: '0.2rem 0.6rem', borderRadius: 999, fontSize: '0.7rem',
                    background: `${theme.green}22`, color: theme.green, fontWeight: 600
                  }}>
                    Updated {new Date(kb.lastRefreshedAt).toLocaleDateString()}
                  </span>
                )}
              </div>
            </div>
            <p style={{ color: theme.textDim, fontSize: '0.85rem', marginTop: '0.5rem' }}>
              {kb.source === 'dynamic-brain'
                ? <>Reference pack built from PubMed, Perplexity, and Claude for <strong>{kb.condition}</strong>. Saved for future searches — still verify with your specialist.</>
                : <>These are trusted medical references for {kb.condition} — major guidelines, important studies, FDA labels, and respected reviews. We always include them so the information you see is grounded in solid sources.</>}
            </p>
            {kb.trialHighlights?.length > 0 && (
              <div style={{ marginTop: '0.75rem' }}>
                <div style={{ fontSize: '0.8rem', fontWeight: 600, color: theme.text, marginBottom: '0.35rem' }}>
                  Recruiting trials (refreshed daily from ClinicalTrials.gov)
                </div>
                <ul style={{ margin: 0, paddingLeft: '1.1rem', color: theme.textDim, fontSize: '0.85rem', lineHeight: 1.55 }}>
                  {kb.trialHighlights.slice(0, expanded ? 99 : 4).map((t, i) => (
                    <li key={i}>
                      {t.url ? <a href={t.url} target="_blank" rel="noopener noreferrer" style={{ color: theme.accent }}>{t.nctId}</a> : t.nctId}
                      {' — '}{t.title?.slice(0, 100)}{t.title?.length > 100 ? '…' : ''}
                    </li>
                  ))}
                </ul>
              </div>
            )}
            {facts.length > 0 && (
              <div style={{ marginTop: '0.75rem' }}>
                <div style={{ fontSize: '0.8rem', fontWeight: 600, color: theme.text, marginBottom: '0.35rem' }}>
                  Key facts from research
                </div>
                <ul style={{ margin: 0, paddingLeft: '1.1rem', color: theme.textDim, fontSize: '0.85rem', lineHeight: 1.55 }}>
                  {facts.map((f, i) => <li key={i}>{f.claim}</li>)}
                </ul>
              </div>
            )}
            {redFlags.length > 0 && (
              <div style={{ marginTop: '0.75rem' }}>
                <div style={{ fontSize: '0.8rem', fontWeight: 600, color: theme.red, marginBottom: '0.35rem' }}>
                  Safety considerations reported in literature
                </div>
                <ul style={{ margin: 0, paddingLeft: '1.1rem', color: theme.textDim, fontSize: '0.85rem', lineHeight: 1.55 }}>
                  {redFlags.map((r, i) => <li key={i}>{r}</li>)}
                </ul>
              </div>
            )}
            {lifestyle.length > 0 && (
              <div style={{ marginTop: '0.75rem' }}>
                <div style={{ fontSize: '0.8rem', fontWeight: 600, color: theme.green, marginBottom: '0.35rem' }}>
                  Lifestyle / non-drug guidance
                </div>
                <ul style={{ margin: 0, paddingLeft: '1.1rem', color: theme.textDim, fontSize: '0.85rem', lineHeight: 1.55 }}>
                  {lifestyle.map((l, i) => <li key={i}>{l.recommendation}</li>)}
                </ul>
              </div>
            )}
            <button onClick={() => setExpanded(v => !v)} style={{
              marginTop: '0.75rem',
              background: 'transparent', border: `1px solid ${theme.accent}66`,
              color: theme.accent, padding: '0.35rem 0.8rem', borderRadius: 6,
              fontSize: '0.8rem', cursor: 'pointer', fontWeight: 600
            }}>
              {expanded ? 'Show less' : `Show all facts, safety considerations, and lifestyle guidance`}
            </button>
          </div>
        );
      };

      /* ==================== Source-quality flags + panel ==================== */
      // Color + icon per quality-flag severity. The severity taxonomy matches
      // what api/evidence.js computeQualityFlags() emits:
      //   positive = evidence-strength boost (RCT, Cochrane, A+ journal, KB)
      //   warning  = integrity concern (preprint, country-penalised, low-integrity)
      //   critical = hard-exclusion class (retracted, integrity-flagged publisher)
      const FLAG_COLORS = {
        positive: theme.green,
        warning: theme.yellow,
        critical: theme.red
      };
      const QualityFlagBadge = ({ flag }) => {
        const color = FLAG_COLORS[flag.severity] || theme.textDim;
        return (
          <span title={flag.label} style={{
            display: 'inline-flex', alignItems: 'center', gap: '0.25rem',
            padding: '0.15rem 0.5rem', borderRadius: 4, fontSize: '0.68rem',
            border: `1px solid ${color}66`, background: `${color}1a`,
            color, fontWeight: 700, letterSpacing: 0.3, textTransform: 'uppercase',
            whiteSpace: 'nowrap'
          }}>
            {flag.label}
          </span>
        );
      };

      // Country flag — shows first-author institution country. Styled green
      // for strong-integrity jurisdictions, yellow for neutral, red for
      // documented-concern jurisdictions.
      const COUNTRY_TIER = {
        US: 'strong', GB: 'strong', DE: 'strong', FR: 'strong', NL: 'strong',
        SE: 'strong', CH: 'strong', DK: 'strong', NO: 'strong', FI: 'strong',
        IE: 'strong', BE: 'strong', AT: 'strong', IT: 'strong', ES: 'strong',
        CA: 'strong', AU: 'strong', NZ: 'strong', JP: 'strong', SG: 'strong', IL: 'strong',
        CN: 'concern', RU: 'concern', IR: 'concern', PK: 'concern',
        IN: 'concern', VN: 'concern', MX: 'concern',
        KR: 'neutral', TW: 'neutral', HK: 'neutral', PT: 'neutral',
        CZ: 'neutral', PL: 'neutral', GR: 'neutral', TR: 'neutral'
      };
      const CountryBadge = ({ country }) => {
        if (!country) return null;
        const tier = COUNTRY_TIER[country] || 'neutral';
        const color = tier === 'strong' ? theme.green
                    : tier === 'concern' ? theme.red
                    : theme.textDim;
        const title = tier === 'concern'
          ? `Lead author is from ${country}. Research from here can be harder to check, so we ranked this paper a bit lower.`
          : tier === 'strong'
          ? `Lead author is from ${country}. Research from here is usually easy to check.`
          : `Lead author is from ${country}.`;
        return (
          <span title={title} style={{
            display: 'inline-flex', alignItems: 'center', gap: '0.25rem',
            padding: '0.15rem 0.5rem', borderRadius: 4, fontSize: '0.68rem',
            border: `1px solid ${color}55`, background: `${color}15`,
            color, fontWeight: 700, letterSpacing: 0.4
          }}>
            🌐 {country}
          </span>
        );
      };

      // Dossier panel — shows what the realtime disease-intake agent knows
      // about the user's condition. This is the agent's answer to the
      // user's explicit ask: "shouldn't there be an AI to do disease search,
      // so I put in IPF and then in realtime the agent does research?" Yes,
      // and here's exactly what it found — transparent by default, with an
      // uncertainty score so you know when to trust it vs when to push.
      /* ==================== Deep Research Progress ==================== */
      // ChatGPT-style stepped progress bar for the two-phase research
      // pipeline. Driven off the `progress` state shape in App. Shows:
      //   - Mode title + live elapsed-seconds counter
      //   - Animated gradient progress bar (% = done steps / total steps)
      //   - Stepped checklist: pending / running / done / skipped / error
      //     with icon, label, one-line description and live detail text
      //     (e.g. "42 unique peer-reviewed sources", "3200 tokens generated")
      // Intentionally "honest" — nothing is faked. Every step corresponds
      // to real work the backend is doing.
      const DeepResearchProgress = ({ progress }) => {
        if (!progress) return null;
        const [now, setNow] = useState(Date.now());
        useEffect(() => {
          if (!progress.active) return;
          const id = setInterval(() => setNow(Date.now()), 250);
          return () => clearInterval(id);
        }, [progress.active]);
        const elapsed = Math.max(0, Math.round(((progress.active ? now : (progress.finishedAt || now)) - progress.startedAt) / 100) / 10);
        const steps = progress.steps || [];
        const doneCount = steps.filter(s => s.status === 'done' || s.status === 'skipped').length;
        const totalCount = steps.length;
        const pct = totalCount ? Math.max(6, Math.round((doneCount / totalCount) * 100)) : 0;
        const isError = steps.some(s => s.status === 'error') || !!progress.error;
        const isDone = !progress.active && !isError && doneCount === totalCount;
        const modeLabel = progress.mode === 'repurpose' ? 'Drug Repurposing' : 'Detailed Report';

        const statusIcon = (s) => {
          const sz = 16;
          if (s.status === 'running') return <Loader size={sz} className="spin" color={theme.accent} />;
          if (s.status === 'done')    return <CheckCircle size={sz} color={theme.green} />;
          if (s.status === 'error')   return <XCircle size={sz} color={theme.red} />;
          if (s.status === 'skipped') return <CheckCircle size={sz} color={theme.textDim} />;
          // pending: empty circle
          return (
            <span style={{
              display: 'inline-block', width: sz, height: sz, borderRadius: 999,
              border: `2px solid ${theme.border}`, boxSizing: 'border-box'
            }} />
          );
        };

        return (
          <div style={{
            ...panelStyle,
            background: `linear-gradient(180deg, ${theme.accentSoft} 0%, ${panelStyle.background} 65%)`,
            borderLeft: `3px solid ${isError ? theme.red : isDone ? theme.green : theme.accent}`
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem', marginBottom: '0.3rem' }}>
              <div style={{
                width: 28, height: 28, borderRadius: 8,
                background: `linear-gradient(135deg, ${theme.accent} 0%, ${theme.secondary} 100%)`,
                display: 'flex', alignItems: 'center', justifyContent: 'center'
              }}>
                {isError ? <XCircle size={15} color={theme.primaryText} />
                  : isDone ? <CheckCircle size={15} color={theme.primaryText} />
                  : <Brain size={15} color={theme.primaryText} />}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: '1rem', fontWeight: 700, color: theme.text, fontFamily: '"Crimson Pro", Georgia, serif' }}>
                  {modeLabel} · {isError ? 'failed' : isDone ? 'complete' : 'in progress'}
                </div>
                <div style={{ fontSize: '0.78rem', color: theme.textDim }}>
                  {doneCount} of {totalCount} stages · {elapsed.toFixed(1)}s elapsed
                </div>
              </div>
              {progress.active && !isError && (
                <span style={{
                  fontSize: '0.72rem', color: theme.accent, fontWeight: 600,
                  padding: '0.2rem 0.55rem', borderRadius: 999,
                  background: `${theme.accent}18`, border: `1px solid ${theme.accent}44`,
                  display: 'inline-flex', alignItems: 'center', gap: 6
                }}>
                  <span className="mrt-pulse-dot" style={{
                    width: 6, height: 6, borderRadius: 999, background: theme.accent, display: 'inline-block'
                  }} />
                  live
                </span>
              )}
            </div>

            {/* Progress bar */}
            <div style={{
              height: 6, borderRadius: 999, background: theme.panel,
              overflow: 'hidden', margin: '0.7rem 0 1rem'
            }}>
              <div className={progress.active && !isError ? 'mrt-shimmer-bar' : ''} style={{
                width: `${pct}%`, height: '100%', borderRadius: 999,
                background: isError
                  ? '#f87171'
                  : `linear-gradient(90deg, ${theme.accent} 0%, #6ee7b7 50%, ${theme.accent} 100%)`,
                transition: 'width 400ms ease'
              }} />
            </div>

            {/* Stepped checklist */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.55rem' }}>
              {steps.map((s, i) => (
                <div key={s.id} style={{
                  display: 'flex', alignItems: 'flex-start', gap: '0.6rem',
                  opacity: s.status === 'pending' ? 0.5 : 1,
                  transition: 'opacity 200ms ease'
                }}>
                  <div style={{ paddingTop: 2 }}>{statusIcon(s)}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{
                      display: 'flex', alignItems: 'baseline', gap: '0.4rem', flexWrap: 'wrap'
                    }}>
                      <span style={{
                        fontSize: '0.88rem', fontWeight: 600,
                        color: s.status === 'running' ? theme.accent : theme.text
                      }}>
                        {s.label}
                      </span>
                      {s.detail && (
                        <span style={{ fontSize: '0.78rem', color: theme.green, fontWeight: 600 }}>
                          — {s.detail}
                        </span>
                      )}
                    </div>
                    <div style={{ fontSize: '0.75rem', color: theme.textDim, marginTop: 1 }}>
                      {s.desc}
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {isError && (
              <div style={{
                marginTop: '0.9rem', padding: '0.6rem 0.8rem', borderRadius: 8,
                background: 'rgba(248, 113, 113, 0.08)', border: '1px solid rgba(248, 113, 113, 0.35)',
                fontSize: '0.82rem', color: '#fca5a5'
              }}>
                <strong>{progress.error || 'Something failed'}</strong>
                <div style={{ marginTop: 3, color: theme.textDim }}>
                  Your research is saved, so trying again is usually fast. If it keeps failing, check the Chat tab for a quick answer in the meantime.
                </div>
              </div>
            )}
          </div>
        );
      };

      const DossierPanel = ({ dossier }) => {
        const [expanded, setExpanded] = useState(true);
        if (!dossier || !dossier.canonical) return null;
        const unc = typeof dossier.uncertainty === 'number' ? dossier.uncertainty : null;
        const uncColor = unc == null ? theme.textDim
          : unc < 0.3 ? theme.green
          : unc < 0.6 ? theme.yellow
          : theme.red;
        const uncLabel = unc == null ? 'n/a'
          : unc < 0.3 ? 'high confidence'
          : unc < 0.6 ? 'moderate confidence'
          : 'low confidence — verify everything';
        return (
          <div style={{ ...panelStyle, borderLeft: `3px solid ${theme.accent}` }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.5rem' }}>
              <h3 style={{ margin: 0, color: theme.accent, fontSize: '1rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <BookOpen size={18} /> What the AI found about "{dossier.canonical}"
                {dossier.cacheHit && (
                  <span style={{
                    padding: '0.15rem 0.5rem', borderRadius: 999, fontSize: '0.65rem',
                    background: `${theme.green}22`, color: theme.green, fontWeight: 700,
                    border: `1px solid ${theme.green}55`
                  }}>
                    cached
                  </span>
                )}
                {dossier.cacheDisabled && (
                  <span
                    title="We are not saving past results right now. Each run searches fresh, so the same question asked twice can give different answers — this is on purpose while we test how the tool works."
                    style={{
                      padding: '0.15rem 0.5rem', borderRadius: 999, fontSize: '0.65rem',
                      background: `${theme.secondary}22`,
                      color: theme.secondary,
                      fontWeight: 700,
                      border: `1px solid ${theme.secondary}55`,
                      cursor: 'help'
                    }}
                  >
                    fresh each time
                  </span>
                )}
              </h3>
              <button onClick={() => setExpanded(v => !v)} style={{
                background: 'transparent', border: `1px solid ${theme.border}`,
                color: theme.textDim, padding: '0.3rem 0.7rem', borderRadius: 6,
                fontSize: '0.75rem', cursor: 'pointer'
              }}>
                {expanded ? 'Collapse' : 'Expand'}
              </button>
            </div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem', marginTop: '0.6rem' }}>
              {dossier.subspecialty && (
                <span style={{
                  padding: '0.2rem 0.55rem', borderRadius: 999, fontSize: '0.72rem',
                  background: `${theme.accent}15`, color: theme.accent, fontWeight: 600,
                  border: `1px solid ${theme.accent}44`
                }}>
                  {dossier.subspecialty}
                </span>
              )}
              {dossier.icd10 && (
                <span style={{
                  padding: '0.2rem 0.55rem', borderRadius: 999, fontSize: '0.72rem',
                  background: `${theme.textDim}15`, color: theme.textDim, fontWeight: 600,
                  border: `1px solid ${theme.border}`
                }}>
                  ICD-10 {dossier.icd10}
                </span>
              )}
              <span style={{
                padding: '0.2rem 0.55rem', borderRadius: 999, fontSize: '0.72rem',
                background: `${uncColor}15`, color: uncColor, fontWeight: 700,
                border: `1px solid ${uncColor}55`
              }}>
                uncertainty {unc == null ? '?' : unc.toFixed(2)} · {uncLabel}
              </span>
              {dossier.generatedBy && (
                <span style={{
                  padding: '0.2rem 0.55rem', borderRadius: 999, fontSize: '0.72rem',
                  background: `${theme.textDim}10`, color: theme.textDim,
                  border: `1px solid ${theme.border}`
                }}>
                  built by AI
                </span>
              )}
            </div>
            {expanded && (
              <div style={{ marginTop: '0.9rem', fontSize: '0.85rem', color: theme.text, lineHeight: 1.55, display: 'grid', gap: '0.9rem' }}>
                {dossier.synonyms?.length > 0 && (
                  <div>
                    <div style={{ fontWeight: 700, color: theme.textDim, fontSize: '0.75rem', textTransform: 'uppercase', letterSpacing: 0.4, marginBottom: 4 }}>
                      Other names we searched
                    </div>
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.3rem' }}>
                      {dossier.synonyms.map((s, i) => (
                        <span key={i} style={{
                          padding: '0.15rem 0.5rem', borderRadius: 4, fontSize: '0.72rem',
                          background: `${theme.accent}10`, color: theme.accent,
                          border: `1px solid ${theme.accent}44`
                        }}>{s}</span>
                      ))}
                    </div>
                  </div>
                )}
                {dossier.meshTerms?.length > 0 && (
                  <div>
                    <div style={{ fontWeight: 700, color: theme.textDim, fontSize: '0.75rem', textTransform: 'uppercase', letterSpacing: 0.4, marginBottom: 4 }}>
                      Official medical search terms
                    </div>
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.3rem' }}>
                      {dossier.meshTerms.map((m, i) => (
                        <span key={i} style={{
                          padding: '0.15rem 0.5rem', borderRadius: 4, fontSize: '0.72rem',
                          background: `${theme.textDim}15`, color: theme.textDim,
                          border: `1px solid ${theme.border}`
                        }}>{m}</span>
                      ))}
                    </div>
                  </div>
                )}
                {dossier.topCenters?.length > 0 && (
                  <div>
                    <div style={{ fontWeight: 700, color: theme.textDim, fontSize: '0.75rem', textTransform: 'uppercase', letterSpacing: 0.4, marginBottom: 4, display: 'flex', alignItems: 'center', gap: '0.35rem' }}>
                      Top centers for this condition
                      <span
                        title="These are top centers for this exact condition, ranked by how much they lead in treating and studying it — not by how famous the hospital is overall."
                        style={{
                          display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                          width: 15, height: 15, borderRadius: '50%',
                          border: `1px solid ${theme.border}`, color: theme.textDim,
                          fontSize: '0.65rem', cursor: 'help', lineHeight: 1
                        }}
                      >
                        ?
                      </span>
                    </div>
                    <div style={{ display: 'grid', gap: '0.3rem' }}>
                      {dossier.topCenters.map((c, i) => (
                        <div key={i} style={{ fontSize: '0.82rem' }}>
                          <strong style={{ color: theme.accent }}>{c.name}</strong>
                          {(c.city || c.country) && (
                            <span style={{ color: theme.textDim }}>
                              {' '}· {[c.city, c.country].filter(Boolean).join(', ')}
                            </span>
                          )}
                          {c.why && <span style={{ color: theme.textDim }}> — {c.why}</span>}
                        </div>
                      ))}
                    </div>

                {dossier.patientAdvocacy?.length > 0 && (

                    <div style={{ display: 'grid', gap: '0.3rem' }}>
                      {dossier.patientAdvocacy.map((a, i) => (

                {dossier.landmarkTrials?.length > 0 && (

                {dossier.redFlags?.length > 0 && (

                    </div>
                    <ul style={{ margin: 0, paddingLeft: '1.2rem', color: theme.text }}>

                {dossier.commonComorbidities?.length > 0 && (

                {dossier.notes && (
                  <div style={{
                    fontSize: '0.78rem', color: theme.textDim, fontStyle: 'italic',

        );
      };

      // Quality-breakdown panel — plain-language summary of how sources were checked.
      const QualityPanel = ({ qb }) => {
        const [expanded, setExpanded] = useState(false);
        const [integrityFlaggedOpen, setIntegrityFlaggedOpen] = useState(false);
        if (!qb) return null;
        const hasExclusions = (qb.retractedExcluded || 0) > 0 || (qb.predatoryExcluded || 0) > 0;
        return (
          <div style={{
            ...panelStyle,
            borderLeft: `3px solid ${hasExclusions ? theme.red : theme.green}`,
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.5rem' }}>
              <h3 style={{ margin: 0, color: theme.accent, fontSize: '1rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <Shield size={18} /> How we checked the medical literature · {qb.totalScreened} papers reviewed
              </h3>
              <button onClick={() => setExpanded(v => !v)} style={{
                background: 'transparent', border: `1px solid ${theme.border}`,
                color: theme.textDim, padding: '0.3rem 0.7rem', borderRadius: 6,
                fontSize: '0.75rem', cursor: 'pointer'
              }}>
                {expanded ? 'Hide details' : 'Show details'}
              </button>
            </div>
            <p style={{ margin: '0.5rem 0 0', fontSize: '0.84rem', color: theme.textDim, lineHeight: 1.5 }}>
              We search PubMed, Europe PMC, OpenAlex, and Cochrane on every run — the knowledge base helps us find the right topics, not replace live search.
            </p>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem', marginTop: '0.6rem' }}>
              <span style={{
                padding: '0.25rem 0.6rem', borderRadius: 999, fontSize: '0.72rem',
                background: `${theme.green}22`, color: theme.green, fontWeight: 700,
                border: `1px solid ${theme.green}55`
              }}>
                {qb.totalScreened - (qb.retractedExcluded || 0) - (qb.predatoryExcluded || 0)} papers used for this analysis
              </span>
              {(qb.retractedExcluded || 0) > 0 && (
                <span style={{
                  padding: '0.25rem 0.6rem', borderRadius: 999, fontSize: '0.72rem',
                  background: `${theme.red}22`, color: theme.red, fontWeight: 700,
                  border: `1px solid ${theme.red}55`
                }}>
                  {qb.retractedExcluded} retracted paper{qb.retractedExcluded === 1 ? '' : 's'} removed
                </span>
              )}
              {(qb.predatoryExcluded || 0) > 0 && (
                <span style={{
                  padding: '0.25rem 0.6rem', borderRadius: 999, fontSize: '0.72rem',
                  background: `${theme.red}22`, color: theme.red, fontWeight: 700,
                  border: `1px solid ${theme.red}55`
                }}>
                  {qb.predatoryExcluded} publisher{qb.predatoryExcluded === 1 ? '' : 's'} known for poor quality removed
                </span>
              )}
              {(qb.preprintsInPool || 0) > 0 && (
                <span style={{
                  padding: '0.25rem 0.6rem', borderRadius: 999, fontSize: '0.72rem',
                  background: `${theme.yellow}22`, color: theme.yellow, fontWeight: 700,
                  border: `1px solid ${theme.yellow}55`
                }}>
                  {qb.preprintsInPool} early draft{qb.preprintsInPool === 1 ? '' : 's'} flagged (preprints — not yet checked by other experts)

            </div>
            <details
              open={integrityFlaggedOpen}
              onToggle={(e) => setIntegrityFlaggedOpen(e.target.open)}

            >
              <summary style={{ cursor: 'pointer', color: theme.accent, fontWeight: 600 }}>
                What are low-integrity publishers?
              </summary>
              <div style={{ marginTop: '0.45rem' }}>
                <strong style={{ color: theme.text }}>Publishers flagged for documented integrity concerns.</strong>
                {' '}These are venues with publicly documented pay-to-publish practices, mass retractions, or similar
                integrity issues — not a judgment about any country or author. This is{' '}
                <strong style={{ color: theme.text }}>not</strong> the same as country of origin — we do not hide papers
                from any country. Examples frequently cited in integrity watchlists include:
                <ul style={{ margin: '0.45rem 0', paddingLeft: '1.2rem' }}>
                  {INTEGRITY_FLAGGED_PUBLISHER_EXAMPLES.map((name) => (
                    <li key={name}>{name}</li>
                  ))}
                </ul>
                Papers from any country can still be found; the flag only changes how we rank them, not whether they show up in search.
                We do not send flagged papers from these sources to the AI when we spot them; solid
                research from any part of the world can still be used on its own merits.
              </div>
            </details>
            {expanded && (
              <div style={{ marginTop: '0.85rem', fontSize: '0.82rem', color: theme.textDim, lineHeight: 1.55 }}>
                <div style={{ marginBottom: '0.5rem' }}>
                  <strong style={{ color: theme.text }}>How this works.</strong>
                  {' '}                  We score each paper on the journal's reputation, the study type (a real study vs. an opinion piece),
                  how recent it is, and how often other papers cite it. Papers that were pulled back (retracted) and
                  publishers known for quality problems are removed before the AI reads them. Early drafts (preprints) are
                  kept but marked as not yet checked by other experts.
                </div>
                {(qb.topTierInPromptPack > 0 || qb.rctOrMetaInPromptPack > 0) && (
                  <div style={{ marginBottom: '0.5rem', fontSize: '0.78rem', color: theme.textDim }}>
                    Technical detail: {qb.topTierInPromptPack} top-journal · {qb.rctOrMetaInPromptPack} clinical trial or systematic review in the analysis set.
                  </div>
                )}
                {(qb.retractedTitles || []).length > 0 && (
                  <div style={{ marginTop: '0.6rem' }}>
                    <div style={{ color: theme.red, fontWeight: 700, marginBottom: '0.25rem' }}>

                    </div>
                    <ul style={{ margin: 0, paddingLeft: '1.1rem' }}>
                      {qb.retractedTitles.map((r, i) => (

                          "{(r.title || '(untitled)').slice(0, 140)}" ({r.journal || 'journal unknown'})
                        </li>
                      ))}

                  </div>
                )}
                {(qb.predatoryTitles || []).length > 0 && (

                    <div style={{ color: theme.red, fontWeight: 700, marginBottom: '0.25rem' }}>
                      Papers from low-quality publishers we left out:
                    </div>
                    <ul style={{ margin: 0, paddingLeft: '1.1rem' }}>
                      {qb.predatoryTitles.map((r, i) => (

                {qb.countryCounts && Object.keys(qb.countryCounts).length > 0 && (

      };

      /* ==================== Cross-AI Validator Panel ==================== */
      // Renders the second-AI (Perplexity / OpenAI / xAI) audit of Claude's
      // output. This is the safeguard against hallucinated citations:
      // an INDEPENDENT model rechecks every factual claim against the same
      // grounded evidence pack and flags disputed / unsupported / hallucinated.
      const agreementColor = (level) => {
        if (level === 'high') return theme.green;
        if (level === 'moderate') return theme.yellow;
        if (level === 'low') return theme.red;
        return theme.textDim;
      };

      const ValidatorPanel = ({ validation, onAudit, canAudit }) => {
        // When no validation has been requested yet and the analysis is
        // ready, offer the audit button. The validator is opt-in so we
        // only burn Perplexity tokens when the user actually wants the
        // independent second opinion.
        if (!validation) {
          if (!canAudit || !onAudit) return null;
          return (
            <div style={panelStyle}>
              <h3 style={{ marginTop: 0, color: theme.accent, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <Scales size={18} /> Double-check with a second AI (optional)
              </h3>
              <p style={{ color: theme.textDim, fontSize: '0.9rem', margin: '0 0 0.9rem' }}>
                Have a second, separate AI go over this report and the same research we found.
                It will point out any claims that are not backed up, links that don't work, and
                things it thinks are missing. This usually takes about 5 to 10 seconds.
              </p>
              <button onClick={onAudit} style={{ ...btn, background: theme.accent, color: '#fff', borderColor: theme.accent }}>
                <Scales size={16} style={{ marginRight: 6 }} /> Check this report
              </button>
            </div>
          );
        }
        if (validation._auditing) {
          return (
            <div style={panelStyle}>
              <h3 style={{ marginTop: 0, color: theme.accent, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <Scales size={18} /> Second AI is checking…
              </h3>
              <p style={{ color: theme.textDim, fontSize: '0.9rem', margin: 0 }}>
                A second, separate AI is checking every fact. This usually takes 5 to 10 seconds.
              </p>
            </div>
          );
        }
        if (validation.error) {
          return (
            <div style={panelStyle}>
              <h3 style={{ marginTop: 0, color: theme.yellow, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <Scales size={18} /> Second AI check — not available
              </h3>
              <p style={{ color: theme.textDim, fontSize: '0.9rem', margin: 0 }}>
                {validation.error}{validation.hint ? ` — ${validation.hint}` : ''}
              </p>
            </div>
          );
        }
        const p = validation.primary;
        if (!p) {
          return (
            <div style={panelStyle}>
              <h3 style={{ marginTop: 0, color: theme.yellow, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <Scales size={18} /> Second AI check — no answer
              </h3>
              <p style={{ color: theme.textDim, fontSize: '0.9rem', margin: 0 }}>
                We tried {(validation.validators || []).length || 'no'} second AI{(validation.validators || []).length === 1 ? '' : 's'}, but none sent back results.
              </p>
            </div>
          );
        }
        const disputed = p.disputed || [];
        const unsupported = p.unsupported || [];
        const hallucinated = p.hallucinatedCitations || [];
        const confirmed = p.confirmed || [];
        const missing = p.missingPerspectives || [];
        return (
          <div style={{ ...panelStyle, borderLeft: `4px solid ${agreementColor(p.agreement)}` }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '1rem', flexWrap: 'wrap' }}>
              <div>
                <h3 style={{ margin: 0, color: theme.accent, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                  <Scales size={20} /> Checked by a second AI
                </h3>
                <p style={{ margin: '0.25rem 0 0', color: theme.textDim, fontSize: '0.85rem' }}>
                  A second, separate AI checked every fact in this report against the same research we found.
                  {validation.consensus && validation.consensus.totalValidators > 1 && (
                    <> Across {validation.consensus.totalValidators} separate AIs, they showed <strong>{validation.consensus.level}</strong> agreement ({validation.consensus.validatorsAgreeing} of {validation.consensus.totalValidators} agreed).</>
                  )}
                </p>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div style={{
                  fontSize: '2.5rem', fontWeight: 700, lineHeight: 1,
                  color: agreementColor(p.agreement)
                }}>
                  {p.overallScore ?? '?'}<span style={{ fontSize: '1rem' }}>/100</span>
                </div>
                <div style={{
                  fontSize: '0.75rem', textTransform: 'uppercase', letterSpacing: '0.08em',
                  color: agreementColor(p.agreement), fontWeight: 700
                }}>
                  {p.agreement || 'n/a'} agreement
                </div>
              </div>
            </div>

            {p.overall && (
              <div style={{
                marginTop: '0.9rem', padding: '0.8rem 1rem',
                background: theme.panel, borderRadius: 8,
                fontSize: '0.92rem', lineHeight: 1.55
              }}>
                {p.overall}
              </div>
            )}

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))',
              gap: '0.5rem', marginTop: '0.9rem' }}>
              <ValidatorStat label="Backed up"     n={confirmed.length}   color={theme.green}  Icon={CheckCircle} />
              <ValidatorStat label="Disagreed with"      n={disputed.length}    color={theme.yellow} Icon={AlertCircle} />
              <ValidatorStat label="Not backed by sources"   n={unsupported.length} color={theme.yellow} Icon={AlertCircle} />
              <ValidatorStat label="Made-up sources" n={hallucinated.length} color={theme.red} Icon={XCircle} />
            </div>

            {disputed.length > 0 && (
              <ValidatorList title="Claims the second AI disagreed with" color={theme.yellow}
                items={disputed.map((d) => ({ primary: d.claim, reason: d.reason, correction: d.correction }))} />
            )}
            {unsupported.length > 0 && (
              <ValidatorList title="Claims not backed by the sources we found" color={theme.yellow}
                items={unsupported.map((d) => ({ primary: d.claim, reason: d.reason }))} />
            )}
            {hallucinated.length > 0 && (
              <ValidatorList title="Made-up or broken links" color={theme.red}
                items={hallucinated.map((d) => ({ primary: d.url, reason: d.issue, isUrl: true }))} />
            )}
            {missing.length > 0 && (
              <ValidatorList title="Things the second AI says are missing" color={theme.accent}
                items={missing.map((m) => ({ primary: m }))} />
            )}

            {validation.validators && validation.validators.length > 1 && (
              <details style={{ marginTop: '0.75rem' }}>
                <summary style={{ cursor: 'pointer', color: theme.textDim, fontSize: '0.85rem' }}>
                  Details ({validation.validators.length} second AI{validation.validators.length === 1 ? '' : 's'})
                </summary>
                <div style={{ display: 'grid', gap: '0.4rem', marginTop: '0.5rem' }}>
                  {validation.validators.map((v, i) => (
                    <div key={i} style={{ fontSize: '0.8rem', color: theme.textDim, padding: '0.4rem 0.6rem',
                      background: theme.panel, borderRadius: 6 }}>
                      <strong style={{ color: theme.text }}>Second AI {i + 1}</strong>
                      {v.error ? <> — <span style={{ color: theme.red }}>error: {v.error}</span></>
                              : v.parsed ? <> — agreement: {v.parsed.agreement || '?'} · score: {v.parsed.overallScore ?? '?'}</>
                              : <> — no result</>}
                    </div>
                  ))}
                </div>
              </details>
            )}
          </div>
        );
      };

      const ValidatorStat = ({ label, n, color, Icon }) => (
        <div style={{
          padding: '0.6rem 0.75rem', background: theme.panel,
          border: `1px solid ${color}33`, borderRadius: 8,
          display: 'flex', alignItems: 'center', gap: '0.5rem'
        }}>
          <Icon size={18} color={color} />
          <div>
            <div style={{ fontSize: '1.15rem', fontWeight: 700, color, lineHeight: 1 }}>{n}</div>
            <div style={{ fontSize: '0.75rem', color: theme.textDim, marginTop: 2 }}>{label}</div>
          </div>
        </div>
      );

      const ValidatorList = ({ title, color, items }) => (
        <div style={{ marginTop: '0.9rem' }}>
          <h4 style={{ margin: '0 0 0.4rem', color, fontSize: '0.9rem' }}>{title}</h4>
          <div style={{ display: 'grid', gap: '0.4rem' }}>
            {items.map((it, i) => (
              <div key={i} style={{
                padding: '0.5rem 0.75rem', borderLeft: `3px solid ${color}`,
                background: theme.panel, borderRadius: 4
              }}>
                <div style={{ fontSize: '0.9rem', wordBreak: 'break-word' }}>
                  {it.isUrl
                    ? <a href={it.primary} target="_blank" rel="noopener">{it.primary}</a>
                    : <span>{it.primary}</span>}
                </div>
                {it.reason && (
                  <div style={{ fontSize: '0.8rem', color: theme.textDim, marginTop: 2 }}>
                    {it.reason}
                  </div>
                )}
                {it.correction && (
                  <div style={{ fontSize: '0.8rem', color: theme.green, marginTop: 2 }}>
                    → {it.correction}
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );

      /* ==================== Cost Meter ====================
         Dorothy's question from the WhatsApp thread: "how much more
         expensive is Opus, and what does it cost per 1k users?" This
         strip renders a live, per-run, numeric answer using the
         token-usage payload the server already returns. Pricing is a
         rough on-device lookup — the real number for Dorothy is the
         per-run cost on the model you actually shipped.
      ===================================================== */
      // Approximate Anthropic public pricing snapshot. These are
      // intentionally inline so the meter degrades to "model unknown"
      // gracefully when a future model isn't in the table. Update when
      // Anthropic ships new tier pricing.
      //   { in: USD per 1M input tokens, out: USD per 1M output tokens }
      const MODEL_PRICES_USD_PER_M = [
        { match: /opus/i,           in: 15.00, out: 75.00 },
        { match: /sonnet-4|sonnet/i, in: 3.00,  out: 15.00 },
        { match: /haiku/i,           in: 0.80,  out: 4.00  }
      ];
      const priceFor = (model) => {
        if (!model) return null;
        return MODEL_PRICES_USD_PER_M.find((p) => p.match.test(model)) || null;
      };
      const fmtUsd = (n) => {
        if (n == null || !isFinite(n)) return '—';
        if (n >= 1)   return `$${n.toFixed(2)}`;
        if (n >= 0.1) return `$${n.toFixed(3)}`;
        return `$${n.toFixed(4)}`;
      };
      const CostMeter = ({ meta, label }) => {
        if (!meta || !meta.outputTokens) return null;
        const p = priceFor(meta.model);
        const inCost  = p ? (meta.inputTokens  / 1_000_000) * p.in  : null;
        const outCost = p ? (meta.outputTokens / 1_000_000) * p.out : null;
        const runCost = inCost != null && outCost != null ? inCost + outCost : null;
        const projection1k = runCost != null ? runCost * 1000 : null;
        return (
          <div data-pdf-exclude="1" style={{
            ...panelStyle,
            padding: '0.6rem 0.85rem',
            display: 'flex', flexWrap: 'wrap', gap: '0.65rem 1.2rem', alignItems: 'center',
            fontSize: '0.78rem', color: theme.textDim,
            borderLeft: `3px solid ${theme.accent}55`
          }}>
            <strong style={{ color: theme.accent, fontSize: '0.78rem', letterSpacing: '0.04em' }}>
              {label || 'Run cost'}
            </strong>
            <span title="A rough estimate of what this one run costs to make. It does not include the second-AI check or the research lookups.">
              This run: <strong style={{ color: theme.text }}>{fmtUsd(runCost)}</strong>
            </span>
            <span title="A rough guess if 1,000 people ran the same thing. The real cost is usually lower.">
              × 1,000 people: <strong style={{ color: theme.text }}>{fmtUsd(projection1k)}</strong>
            </span>
          </div>
        );
      };

      /* ==================== Research Tab ==================== */
      const ResearchTab = ({ patient, busy, runResearch, researchText, treatments,
                              validation, evidenceSummary, dossier, progress, coverageAudit,
                              chatHistory, userQuery, setUserQuery, sendChat, onAudit, runtimeConfig,
                              runMeta }) => {
        const cond = patient.condition || 'this condition';
        const isIpf = /idiopathic\s*pulmonary\s*fibrosis|\bipf\b|\buip\b/i.test(cond);
        const [translatedText, setTranslatedText] = useState('');
        const renderedResearchText = translatedText || researchText;
        const baseQuickPrompts = [
          `Why did you rank the top treatment #1 over the others? Walk me through the tradeoff.`,
          `Check every treatment you recommended against my current medications for interactions.`,
          `What is the single most important question I should ask my doctor next week?`,
          `What are the realistic side effects I should actually expect, ranked by how common they are?`,
          `If I only had one treatment option to pursue next month, which one and why?`,
          `What side effects should make me call my doctor right away?`,

      };

      const Glossary = () => (
        <details style={{ ...panelStyle, cursor: 'pointer' }}>
          <summary style={{ color: theme.accent, fontWeight: 700, fontSize: '0.95rem', listStyle: 'none' }}>
            Trial words explained (OLE, Expanded Access, PTA) ▾
          </summary>
          <div style={{ marginTop: '0.75rem' }}>
            <table style={{ width: '100%', fontSize: '0.88rem' }}>
              <tbody>
                {[
                  ['Open-Label Extension (OLE)', 'If the trial drug seems to work, people in the study can keep taking it after it ends — everyone gets the real drug, not a placebo.'],
                  ['Expanded Access / Compassionate Use', 'A way to get a drug that is not yet FDA-approved, outside of a normal study — usually for a serious illness.'],
                  ['Post-Trial Access (PTA)', 'After the study ends, you can keep getting the drug for free.']
                ].map(([k,v]) => (
                  <tr key={k} style={{ borderTop: `1px solid ${theme.border}` }}>
                    <td style={{ padding: '0.5rem 0.75rem', fontWeight: 600, color: theme.text, width: 240, verticalAlign: 'top' }}>{k}</td>
                    <td style={{ padding: '0.5rem 0.75rem', color: theme.textDim, lineHeight: 1.5 }}>{v}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </details>
      );

      const ClinicalTrialsSnapshot = ({ patient, data }) => {
        if (!data?.studies?.length) return null;
        const studies = data.studies || [];
        const kb = data.kbContext;
        const dropped = data.breakdown?.droppedWrongCondition || 0;

        const byPhaseLate = studies
          .filter((s) => (s.relevanceScore || 0) >= 15)
          .filter((s) => (s.phases || []).join(',').includes('PHASE3') || (s.phases || []).join(',').includes('PHASE2'))
          .slice(0, 8);

        const interventionText = (s) => {
          const iv = (s.interventions || []).map((i) => i.name).filter(Boolean).slice(0, 2).join(' + ');
          return iv || s.briefTitle || '';
        };

        return (
          <div style={panelStyle}>
            <h3 style={{ marginTop: 0, color: theme.accent, fontSize: '1rem' }}>
              Snapshot · {data.total} trials ranked for {patient?.condition || 'this condition'}
            </h3>
            {dropped > 0 && (
              <p style={{ margin: '0 0 0.75rem', fontSize: '0.82rem', color: theme.yellow, lineHeight: 1.45 }}>
                We removed {dropped} stud{dropped === 1 ? 'y' : 'ies'} whose listed conditions did not match <strong>{patient?.condition || 'your search'}</strong>.
              </p>
            )}
            <div style={{ display: 'grid', gap: '0.85rem' }}>
              {kb?.approvedDrugs?.length > 0 && (
                <div>
                  <div style={{ fontSize: '0.82rem', fontWeight: 700, color: theme.text }}>Approved treatments (for context — not from trials)</div>
                  <ul style={{ margin: '0.35rem 0 0', paddingLeft: '1rem', color: theme.textDim, fontSize: '0.82rem', lineHeight: 1.55 }}>
                    {kb.approvedDrugs.map((d, i) => (
                      <li key={i}><strong style={{ color: theme.text }}>{d.name}</strong>{d.status ? ` — ${d.status}` : ''}</li>
                    ))}
                  </ul>
                </div>
              )}
              {kb?.pipelineHighlights?.length > 0 && (
                <div>
                  <div style={{ fontSize: '0.82rem', fontWeight: 700, color: theme.text }}>Drugs in trials (from saved research)</div>
                  <ul style={{ margin: '0.35rem 0 0', paddingLeft: '1rem', color: theme.textDim, fontSize: '0.82rem', lineHeight: 1.55 }}>
                    {kb.pipelineHighlights.map((d, i) => (
                      <li key={i}><strong style={{ color: theme.text }}>{d.name}</strong>{d.status ? ` — ${d.status}` : ''}</li>
                    ))}
                  </ul>
                </div>
              )}
              {kb?.keyFacts?.length > 0 && (
                <div>
                  <div style={{ fontSize: '0.82rem', fontWeight: 700, color: theme.text }}>Key facts from research</div>
                  <ul style={{ margin: '0.35rem 0 0', paddingLeft: '1rem', color: theme.textDim, fontSize: '0.82rem', lineHeight: 1.55 }}>
                    {kb.keyFacts.map((f, i) => <li key={i}>{typeof f === 'string' ? f : f}</li>)}
                  </ul>
                </div>
              )}
              {!kb && data.dossier?.canonical && (
                <p style={{ margin: 0, fontSize: '0.82rem', color: theme.textDim, lineHeight: 1.5 }}>
                  Searching as <strong style={{ color: theme.text }}>{data.dossier.canonical}</strong>
                  {data.dossier.subspecialty ? ` (${data.dossier.subspecialty})` : ''}.
                  {runtimeConfig?.dynamicKb?.enabled
                    ? ' No reference pack yet — building one from PubMed + Perplexity for next time.'
                    : ' No saved reference pack for this condition yet — trials and live literature still apply.'}
                </p>
              )}
              {!kb && !data.dossier?.canonical && (
                <p style={{ margin: 0, fontSize: '0.82rem', color: theme.textDim, lineHeight: 1.5 }}>
                  Confirm approved baseline options with your specialist — this list is trial-focused.
                </p>
              )}

              <div>
                <div style={{ fontSize: '0.82rem', fontWeight: 700, color: theme.text }}>Top late-stage trials (phase 2/3) in this list</div>
                <ul style={{ margin: '0.35rem 0 0', paddingLeft: '1rem', color: theme.textDim, fontSize: '0.82rem', lineHeight: 1.55 }}>
                  {byPhaseLate.map((s) => (
                    <li key={s.nctId || s.briefTitle}>
                      <strong style={{ color: theme.text }}>{(s.phases || []).join(', ') || 'N/A'}</strong> — {interventionText(s)}
                      {s.relevanceLabel === 'unlikely match' && (
                        <span style={{ color: theme.yellow }}> · verify this applies to you</span>
                      )}
                    </li>
                  ))}
                  {byPhaseLate.length === 0 && <li>No strong phase 2/3 matches in the current filtered set.</li>}
                </ul>
              </div>
            </div>
          </div>
        );
      };

      // Shared score breakdown for the trials table + explainer panel.
      const trialPromiseBreakdown = (s) => {
        const WESTERN = new Set([
          'United States', 'Canada', 'United Kingdom', 'Germany', 'France', 'Italy',
          'Spain', 'Netherlands', 'Sweden', 'Denmark', 'Norway', 'Finland', 'Belgium',
          'Switzerland', 'Ireland', 'Austria', 'Australia', 'New Zealand', 'Japan'
        ]);
        const CHINA_LIKE = new Set(['China', 'Vietnam', 'Mexico', 'India']);
        const phase = (s.phases || []).join(',');
        const chunks = [];
        if (s.relevanceReason) {
          chunks.push({
            label: s.relevanceLabel || 'Condition match',
            value: s.relevanceScore >= 45 ? '+12' : s.relevanceScore >= 15 ? '+4' : s.relevanceScore < 0 ? '-50' : '0',
            color: s.relevanceScore >= 15 ? theme.green : s.relevanceScore < 0 ? theme.red : theme.yellow,
            why: s.relevanceReason
          });
        }
        if (phase.includes('PHASE3')) chunks.push({ label: 'Phase 3', value: '+40', color: theme.green,
          why: 'Largest stage before FDA approval — strongest evidence that the drug works.' });
        else if (phase.includes('PHASE2')) chunks.push({ label: 'Phase 2', value: '+25', color: theme.green,
          why: 'Tests whether the drug works in people — earlier than phase 3 but real human data.' });
        else if (phase.includes('PHASE1')) chunks.push({ label: 'Phase 1', value: '+10', color: theme.yellow,
          why: 'Mostly checks safety and dose — we do not yet know if it helps your condition.' });
        if (s.acceptingNewPatients) chunks.push({ label: 'Still enrolling', value: '+15', color: theme.green,
          why: 'You can contact a study site today to see if you qualify.' });
        if (!s.hasPlacebo) chunks.push({ label: 'No placebo', value: '+10', color: theme.green,
          why: 'Everyone gets the real drug — not a dummy pill.' });
        if (s.designations?.hasOpenLabelExtension) chunks.push({ label: 'Can keep drug after', value: '+15', color: theme.green,
          why: 'Open-Label Extension: you may keep the drug after the main study ends.' });
        if (s.designations?.hasExpandedAccess) chunks.push({ label: 'Outside trial access', value: '+20', color: theme.green,
          why: 'Expanded Access: you may get the drug even if you cannot join the trial.' });
        if ((s.topCenterScore || 0) > 0) chunks.push({ label: 'Top hospital site', value: `+${s.topCenterScore}`, color: theme.accent,
          why: 'At least one site is a leading center for this disease.' });
        const westernHit = (s.countries || []).some(c => WESTERN.has(c));
        const chinaHit = (s.countries || []).some(c => CHINA_LIKE.has(c));
        if (westernHit) chunks.push({ label: 'US/Western site', value: '+10', color: theme.accent,
          why: 'Has a site in the US, Canada, or Western Europe — easier to verify and travel to.' });
        if (chinaHit) chunks.push({ label: 'Hard-to-check site', value: '-15', color: theme.red,
          why: 'Runs in a region where safety data is harder to verify from the US.' });
        if (s.oversight?.oversightHasDMC) chunks.push({ label: 'Safety watchdog', value: '+4', color: theme.green,
          why: 'An independent team monitors safety and can stop the study early if needed.' });
        return chunks;
      };

      const TrialScoreExplainer = ({ trial, onClose }) => {
        if (!trial) return null;
        const chunks = trialPromiseBreakdown(trial);
        return (
          <div id="mrt-trial-why-panel" style={{
            ...panelStyle,
            borderLeft: `4px solid ${theme.accent}`,
            marginBottom: '0.75rem'
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '0.75rem', flexWrap: 'wrap' }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: '0.72rem', fontWeight: 700, color: theme.accent, textTransform: 'uppercase', letterSpacing: 0.4 }}>
                  Why this score?
                </div>
                <div style={{ fontWeight: 700, color: theme.text, marginTop: 4, lineHeight: 1.35 }}>
                  {trial.briefTitle}
                </div>
                <div style={{ fontSize: '0.78rem', color: theme.textDim, marginTop: 2 }}>
                  {trial.nctId} · Promise score <strong style={{ color: theme.text }}>{trial.promiseScore}</strong>
                  {trial.relevanceLabel && <> · Match: <strong style={{ color: theme.text }}>{trial.relevanceLabel}</strong></>}
                </div>
              </div>
              <button type="button" onClick={onClose} style={{ ...btn('ghost', false), padding: '0.35rem 0.65rem', fontSize: '0.78rem' }}>Close</button>
            </div>
            <div style={{ marginTop: '0.85rem', display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
              {chunks.map((c, i) => (
                <div key={i} style={{
                  display: 'flex', alignItems: 'flex-start', gap: '0.6rem',
                  padding: '0.5rem 0.65rem', borderRadius: 8,
                  border: `1px solid ${c.color}44`, background: `${c.color}10`
                }}>
                  <span style={{
                    flex: '0 0 auto', minWidth: 110, textAlign: 'center',
                    padding: '0.18rem 0.5rem', borderRadius: 999,
                    border: `1px solid ${c.color}77`, color: c.color, background: `${c.color}20`,
                    fontSize: '0.74rem', fontWeight: 700
                  }}>
                    {c.label} {c.value}
                  </span>
                  <span style={{ fontSize: '0.84rem', color: theme.text, lineHeight: 1.5 }}>{c.why}</span>
                </div>
              ))}
            </div>
            <div style={{ marginTop: '0.75rem' }}>
              <a href={trial.url} target="_blank" rel="noopener noreferrer" style={{ color: theme.accent, fontWeight: 600, fontSize: '0.85rem' }}>
                Open on ClinicalTrials.gov ↗
              </a>
            </div>
          </div>
        );
      };

      const TrialsTable = ({ data }) => {
        const [sortMode, setSortMode] = useState('promise');
        const [whyTrial, setWhyTrial] = useState(null);
        const phaseRank = (s) => {
          const p = (s.phases || []).join(',');
          if (p.includes('PHASE3')) return 4;
          if (p.includes('PHASE2')) return 3;
          if (p.includes('PHASE1')) return 2;
          return 1;
        };
        const efficacyProxyScore = (s) => {
          let n = 0;
          n += phaseRank(s) * 30;
          if (!s.hasPlacebo) n += 15;
          if (s.acceptingNewPatients) n += 10;
          if (s.oversight?.oversightHasDMC) n += 6;
          return n;
        };
        const rows = [...(data.studies || [])].sort((a, b) => {
          if (sortMode === 'efficacy') return efficacyProxyScore(b) - efficacyProxyScore(a);
          if (sortMode === 'access') {
            const aScore = (a.designations?.hasExpandedAccess ? 3 : 0) + (a.designations?.hasOpenLabelExtension ? 2 : 0) + (a.designations?.hasPostTrialAccess ? 1 : 0) + (a.acceptingNewPatients ? 2 : 0);
            const bScore = (b.designations?.hasExpandedAccess ? 3 : 0) + (b.designations?.hasOpenLabelExtension ? 2 : 0) + (b.designations?.hasPostTrialAccess ? 1 : 0) + (b.acceptingNewPatients ? 2 : 0);
            return bScore - aScore;
          }
          return (b.promiseScore || 0) - (a.promiseScore || 0);
        });
        const matchColor = (label) => {
          if (label === 'strong match') return theme.green;
          if (label === 'likely match') return theme.accent;
          if (label === 'weak match' || label === 'unlikely match') return theme.yellow;
          if (label === 'wrong disease') return theme.red;
          return theme.textDim;
        };
        return (
        <div style={panelStyle}>
          <TrialScoreExplainer trial={whyTrial} onClose={() => setWhyTrial(null)} />
          <h3 style={{ marginTop: 0, color: theme.accent, fontSize: '1rem', display: 'flex', alignItems: 'center', gap: '0.45rem', flexWrap: 'wrap' }}>
            Top {Math.min(25, rows.length)} trials · {data.total} matched after filtering
            {(data.breakdown?.droppedWrongCondition || 0) > 0 && (
              <span style={{ fontSize: '0.78rem', color: theme.textDim, fontWeight: 400 }}>
                ({data.breakdown.droppedWrongCondition} wrong-disease studies removed)
              </span>
            )}
          </h3>
          <p style={{ margin: '0 0 0.65rem', fontSize: '0.82rem', color: theme.textDim, lineHeight: 1.45 }}>
            Tap <strong>Why this score?</strong> on any row to see exactly how the number was built.
          </p>
          <div style={{ marginBottom: '0.65rem', display: 'flex', alignItems: 'center', gap: '0.5rem', flexWrap: 'wrap' }}>
            <span style={{ fontSize: '0.78rem', color: theme.textDim }}>Sort by:</span>
            <select
              value={sortMode}
              onChange={(e) => setSortMode(e.target.value)}
              style={{ ...inputStyle, width: 'auto', padding: '0.3rem 0.5rem', fontSize: '0.78rem' }}
              title="Choose ranking emphasis"
            >
              <option value="promise">Overall promise (balanced)</option>
              <option value="efficacy">How likely it is to work</option>
              <option value="access">Easiest to get the drug</option>
            </select>
          </div>
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '0.82rem' }}>
              <thead>
                <tr style={{ background: theme.accentSoft, borderBottom: `2px solid ${theme.accent}` }}>
                  {['Title / NCT','Phase','Status','Accepting','Placebo','Special status','Countries','Safety checks','Score',''].map(h => (
                    <th key={h} style={{ padding: '0.6rem', textAlign: 'left', color: theme.accent, fontWeight: 700 }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.slice(0, 25).map((s, idx) => {
                  const rowKey = s.nctId || `${s.briefTitle || 'trial'}-${idx}`;
                  const isSelected = whyTrial?.nctId === s.nctId;
                  return (
                      <tr key={rowKey} style={{
                        borderBottom: `1px solid ${theme.border}`,
                        verticalAlign: 'top',
                        background: isSelected ? `${theme.accent}12` : 'transparent'
                      }}>
                        <td style={{ padding: '0.6rem', maxWidth: 360 }}>
                          <div style={{ color: theme.accent, fontWeight: 600 }}>{s.briefTitle}</div>
                          <div style={{ color: theme.textDim, fontSize: '0.75rem' }}>{s.nctId} · {s.sponsor || ''}</div>
                          {s.relevanceLabel && (
                            <span style={{
                              display: 'inline-block', marginTop: 4, fontSize: '0.68rem', fontWeight: 700,
                              padding: '0.12rem 0.4rem', borderRadius: 999,
                              color: matchColor(s.relevanceLabel),
                              border: `1px solid ${matchColor(s.relevanceLabel)}55`,
                              background: `${matchColor(s.relevanceLabel)}12`
                            }}>
                              {s.relevanceLabel}
                            </span>
                          )}
                        </td>
                        <td style={{ padding: '0.6rem' }}>{(s.phases || []).join(', ') || '—'}</td>
                        <td style={{ padding: '0.6rem' }}>{s.status}</td>
                        <td style={{ padding: '0.6rem', color: s.acceptingNewPatients ? theme.green : theme.textDim }}>
                          {s.acceptingNewPatients ? 'Yes' : 'No'}
                        </td>
                        <td style={{ padding: '0.6rem', color: s.hasPlacebo ? theme.yellow : theme.green }}>
                          {s.hasPlacebo ? 'Yes' : 'No'}
                        </td>
                        <td style={{ padding: '0.6rem', fontSize: '0.75rem' }}>
                          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.25rem' }}>
                            {s.designations?.hasOpenLabelExtension && <span title="Open-Label Extension: if the drug works, you can keep taking it after the study ends." style={{ padding: '0.12rem 0.35rem', borderRadius: 999, border: `1px solid ${theme.accent}55`, color: theme.accent }}>Can keep drug after</span>}
                            {s.designations?.hasExpandedAccess && <span title="A way to get a not-yet-approved drug outside of the study, usually for a serious illness." style={{ padding: '0.12rem 0.35rem', borderRadius: 999, border: `1px solid ${theme.green}55`, color: theme.green }}>Can get drug outside trial</span>}
                            {s.designations?.hasPostTrialAccess && <span title="The company keeps giving you the drug after the study ends, even before the FDA approves it." style={{ padding: '0.12rem 0.35rem', borderRadius: 999, border: `1px solid ${theme.yellow}55`, color: theme.yellow }}>Drug after the trial</span>}
                            {s.designations?.hasPayToAccess && <span title="You may have to pay to get the drug." style={{ padding: '0.12rem 0.35rem', borderRadius: 999, border: `1px solid ${theme.red}55`, color: theme.red }}>You may have to pay</span>}
                            {!s.designations?.hasOpenLabelExtension && !s.designations?.hasExpandedAccess && !s.designations?.hasPostTrialAccess && !s.designations?.hasPayToAccess && <span>—</span>}
                          </div>
                        </td>
                        <td style={{ padding: '0.6rem', fontSize: '0.75rem' }}>{(s.countries || []).join(', ') || '—'}</td>
                        <td style={{ padding: '0.6rem', fontSize: '0.75rem' }}>
                          {s.oversight?.oversightHasDMC ? <span title="An independent safety team watches the study and can stop it early if something looks unsafe.">Safety team ✓ </span> : ''}{s.oversight?.fdaRegulatedDrug ? <span title="The drug is made under FDA rules.">FDA-checked drug ✓</span> : ''}
                        </td>
                        <td style={{ padding: '0.6rem', fontWeight: 700 }}>
                          <div>{s.promiseScore}</div>
                          <button
                            type="button"
                            onClick={() => {
                              setWhyTrial(isSelected ? null : s);
                              if (!isSelected) {
                                setTimeout(() => {
                                  document.getElementById('mrt-trial-why-panel')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                                }, 50);
                              }
                            }}
                            style={{
                              marginTop: 4,
                              background: isSelected ? `${theme.accent}22` : 'transparent',
                              border: `1px solid ${isSelected ? theme.accent : theme.border}`,
                              color: isSelected ? theme.accent : theme.textDim,
                              borderRadius: 6, padding: '0.15rem 0.45rem',
                              fontSize: '0.72rem', cursor: 'pointer', fontWeight: 600
                            }}
                          >
                            {isSelected ? 'Hide score' : 'Why this score?'}
                          </button>
                        </td>
                        <td style={{ padding: '0.6rem' }}>
                          <a href={s.url} target="_blank" rel="noopener" style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontSize: '0.8rem' }}>
                            Open <ExternalLink size={12} />
                          </a>
                        </td>
                      </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
      };

      const RankedTrialsForPatient = ({ blocks }) => (
        <div style={panelStyle}>
          <h3 style={{ marginTop: 0, color: theme.accent, fontSize: '1rem' }}>
            Top trials matched to this patient
          </h3>
          <div style={{ display: 'grid', gap: '0.75rem' }}>
            {blocks.map((b, i) => (
              <div key={i} style={{
                padding: '0.9rem', background: theme.panel,
                borderRadius: 8, border: `1px solid ${theme.border}`
              }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: '0.5rem' }}>
                  <div style={{ fontWeight: 600, color: theme.accent }}>{b.trial}</div>
                  <div style={{ fontSize: '0.8rem' }}>
                    <span style={{ color: ratingColor(b.fit_for_patient_pct) }}>Fit: {b.fit_for_patient_pct ?? '?'}%</span>
                    {' · '}
                    <span style={{ color: ratingColor(b.harm_risk_pct) }}>Safety: {b.harm_risk_pct ?? '?'}%</span>
                  </div>
                </div>
                <div style={{ fontSize: '0.8rem', color: theme.textDim, marginTop: 4 }}>
                  {b.nct} · {b.phase} · {b.status} · {b.country}
                </div>
                <div style={{ fontSize: '0.85rem', marginTop: '0.5rem' }}>{b.summary}</div>
                {b.interactions && (
                  <div style={{ fontSize: '0.8rem', marginTop: '0.4rem', color: theme.yellow }}>
                    ⚠ Interactions: {b.interactions}
                  </div>
                )}
                {b.url && (
                  <div style={{ marginTop: '0.5rem' }}>
                    <a href={b.url.trim()} target="_blank" rel="noopener" style={{ fontSize: '0.85rem' }}>
                      Open on ClinicalTrials.gov ↗
                    </a>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );

      /* ==================== Drug Repurposing Tab (EveryCure-style) ==================== */
      // Expandable disclosure for a titled section on the candidate card.
      const Disclosure = ({ title, icon, color, children, defaultOpen = false }) => {
        const [open, setOpen] = useState(defaultOpen);
        const accent = color || theme.accent;
        return (
          <div style={{
            marginTop: '0.5rem',
            borderRadius: 8,
            border: `1px solid ${accent}33`,
            background: `${accent}08`,
            overflow: 'hidden'
          }}>
            <button onClick={() => setOpen(v => !v)} style={{
              width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              background: 'transparent', border: 'none', cursor: 'pointer',
              padding: '0.55rem 0.8rem',
              color: accent, fontSize: '0.82rem', fontWeight: 700, letterSpacing: 0.3
            }}>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: '0.4rem' }}>
                {icon}{title}
              </span>
              {open ? <ChevronUp size={14} /> : <ChevronDown size={14} />}
            </button>
            {open && (
              <div style={{
                padding: '0 0.8rem 0.8rem',
                fontSize: '0.88rem', lineHeight: 1.6, color: theme.text,
                whiteSpace: 'pre-wrap'
              }}>
                {children}
              </div>
            )}
          </div>
        );
      };

      const RankBadge = ({ rank }) => (
        <div style={{
          width: 40, height: 40, borderRadius: 10,
          background: `linear-gradient(135deg, ${theme.accent}aa, ${theme.accent}55)`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontWeight: 800, fontSize: '1.1rem', color: '#ffffff',
          boxShadow: `0 2px 10px ${theme.accent}33`,
          fontVariantNumeric: 'tabular-nums'
        }}>
          #{rank}
        </div>
      );

      // Individual repurposing-candidate card. One per drug/supplement.
      const CandidateCard = ({ c, rank, highlightMechanistic, audience = 'layperson' }) => {
        const mechanistic = highlightMechanistic || isMechanisticEvidence(c.evidence_strength);
        const lay = audience !== 'medical';
        const allLinkText = [c.references, c.supporting_evidence, c.repurpose_rationale].filter(Boolean).join('\n');
        const cardLinks = useMemo(() => extractLinksFromText(allLinkText), [allLinkText]);
        const whyPlain = c.why_for_this_condition || c.repurpose_rationale;

            <div style={{ display: 'flex', alignItems: 'flex-start', gap: '0.9rem' }}>

                    {c.candidate || '(unnamed candidate)'}

                    <div style={{ fontSize: '0.78rem', color: theme.textDim, fontStyle: 'italic' }}>

                {c.what_it_does && lay && (
                  <div style={{
                    marginTop: '0.55rem', padding: '0.65rem 0.75rem', borderRadius: 8,

                    <strong style={{ color: theme.green, fontSize: '0.72rem', letterSpacing: 0.4, textTransform: 'uppercase', display: 'flex', alignItems: 'center', gap: 4 }}>

                    <div style={{ marginTop: 4 }}>
                      {c.why_for_this_condition

                  <div style={{
                    marginTop: '0.55rem', padding: '0.5rem 0.65rem', borderRadius: 8,
                    border: `1px dashed ${theme.yellow}66`, background: `${theme.yellow}10`,
                    fontSize: '0.78rem', color: theme.yellow, lineHeight: 1.45
                  }}>
                    No source links on this card — re-run the analysis or verify claims with your doctor.
                  </div>
                )}
                {c.approved_for && (
                  <div style={{ fontSize: '0.78rem', color: theme.textDim, marginTop: 2 }}>
                    {lay ? 'Usually used for: ' : 'Currently approved for: '}

                  </div>
                )}
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem', marginTop: '0.55rem' }}>
                  {c.evidence_strength && <EvidenceStrengthBadge value={c.evidence_strength} />}
                  {c.mechanism_target && (
                    <span title={lay ? 'Plain-language idea of how it might work' : 'Molecular target / pathway'} style={{
                      display: 'inline-flex', alignItems: 'center', gap: '0.3rem',
                      padding: '0.25rem 0.65rem', borderRadius: 999, fontSize: '0.72rem',
                      border: `1px solid ${theme.accent}55`, background: `${theme.accent}12`,
                      color: theme.accent, fontWeight: 600
                    }}>
                      <Flask size={11} /> {lay ? 'Might work by: ' : ''}
                      {String(c.mechanism_target).length > (lay ? 100 : 80)

                        : c.mechanism_target}
                    </span>
                  )}
                </div>
              </div>
            </div>

            <div style={{ marginTop: '0.9rem', display: 'grid', gap: '0.75rem' }}>
              <MeterBar
                label="How well it works"
                value={c.efficacy_hypothesis_pct}
                icon={<TrendingUp size={11} />}
                note={c.efficacy_hypothesis_note}
              />
              <MeterBar
                label="Safety"
                value={c.safety_pct}
                icon={<Shield size={11} />}
                note={c.safety_note}
              />
              <MeterBar
                label="Confidence"
                value={c.confidence_pct}
                icon={<Award size={11} />}
                note={c.confidence_note}
              />
            </div>

            {c.repurpose_rationale && c.why_for_this_condition && (
              <Disclosure
                title={lay ? 'Full reasoning' : 'Detailed rationale'}
                icon={<Lightbulb size={13} />}
                color={theme.accent}
              >
                <Markdown text={c.repurpose_rationale} />
              </Disclosure>
            )}
            {c.supporting_evidence && (
              <Disclosure
                title="What the research says"
                icon={<Database size={13} />}
                color={theme.green}
                defaultOpen={!mechanistic}
              >
                <Markdown text={c.supporting_evidence} />

              </Disclosure>
            )}
            {c.patient_specific_risks && (
              <Disclosure
                title="Risks for this patient specifically"
                icon={<AlertTriangle size={13} />}
                color={theme.yellow}
                defaultOpen={true}

                {c.patient_specific_risks}
              </Disclosure>

            {c.how_to_discuss_with_doctor && (
              <Disclosure
                title="Questions to ask your doctor"
                icon={<MessageCircle size={13} />}
                color={theme.green}
              >
                {c.how_to_discuss_with_doctor}
              </Disclosure>
            )}
          </div>
        );
      };

      // EveryCure-style hero for the Repurposing tab. Big CTA, feature tiles,
      // honest disclaimer, no clinical claim — this is hypothesis generation.
      const RepurposeHero = ({ patient, busy, runResearch }) => {
        const cond = patient?.condition?.trim() || 'this condition';
        return (
          <div style={{
            ...panelStyle,
            padding: '1.5rem',
            background: `linear-gradient(135deg, ${theme.accentSoft} 0%, ${theme.panel} 60%)`,

              <Sparkles size={18} color={theme.accent} />
