                      {stubTreatments.map((t, i) => (
                        <div key={`stub-${i}`} style={{ padding: '0.5rem 0.7rem', borderRadius: 8, border: `1px solid ${theme.border}`, background: theme.panel }}>
                          <span style={{ fontWeight: 700, color: theme.text }}><InlineTitle text={t.treatment} /></span>
                          {t.provider && (
                            <span style={{ color: theme.textDim, fontSize: '0.82rem' }}> — <InlineMD text={String(t.provider).replace(/^Mechanism:\s*/i, '')} /></span>
                          )}
                        </div>
                      ))}
                    </div>
                    <div style={{ fontSize: '0.75rem', color: theme.textDim, marginTop: 6, lineHeight: 1.5 }}>
                      These are established FDA-approved options without per-drug efficacy/safety scores in this report — ask your doctor or see condition treatment guidelines for details.
                    </div>
                  </div>
                )}
              </div>
            )}

            {researchText && (
              <div id="mrt-research-export-target" style={{ ...panelStyle, borderColor: `${theme.accent}55` }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.9rem', gap: '0.6rem', flexWrap: 'wrap' }}>
                  <h3 style={{ margin: 0, color: theme.accent, fontSize: '1.1rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                    <Brain size={18} /> Report for {patient.condition || 'this condition'}
                  </h3>
                  <AnalysisExportBar
                    getElement={() => document.getElementById('mrt-research-export-target')}
                    exportBaseFilename={`research-${(patient.condition || 'analysis').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}`}
                    disabled={!renderedResearchText}
                    text={renderedResearchText}
                  />
                </div>
                <div style={{ display: 'flex', gap: '0.4rem', flexWrap: 'wrap', marginBottom: '0.75rem' }}>
                    <button
                      onClick={() => {
                        // Dorothy: "do we have the ability to ask it why
                        // it missed something or got something wrong?"
                        // This primes the follow-up chat with that exact
                        // question pattern and scrolls to the chat box.
                        const c = patient.condition || 'this condition';
                        setUserQuery(`The report above doesn't mention <PASTE TREATMENT NAME, e.g. CAR-T therapy>. Why was it left out for ${c}? Tell me whether (a) you looked at it but decided against it, (b) the research we found didn't include it, or (c) it's just not a good fit for this patient. If you DID miss it, give me the same treatment card for it now.`);
                        setTimeout(() => {
                          const el = document.querySelector('input[placeholder^="Ask about"], input[placeholder^="Type a disease"]');
                          if (el) {
                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            el.focus();
                          }
                        }, 50);
                      }}
                      style={{ background: theme.accentSoft, border: `1px solid ${theme.accentEdge}`, color: theme.accent, padding: '0.3rem 0.7rem', borderRadius: 6, fontSize: '0.75rem', cursor: 'pointer', fontWeight: 600 }}
                      title="Ask the AI why a specific treatment was missing or got something wrong"
                      data-pdf-exclude="1"
                    >
                      Ask AI why it missed X
                    </button>
                    <button
                      onClick={() => {
                        try {
                          navigator.clipboard.writeText(`${MEDICAL_DISCLAIMER}\n\n${renderedResearchText}`);
                        } catch (e) {}
                      }}
                      style={{ background: 'transparent', border: `1px solid ${theme.border}`, color: theme.textDim, padding: '0.3rem 0.7rem', borderRadius: 6, fontSize: '0.75rem', cursor: 'pointer' }}
                      title="Copy markdown to clipboard (includes disclaimer)"
                      data-pdf-exclude="1"
                    >
                      Copy
                    </button>
                    <AnalysisLanguageToolbar
                      sourceText={researchText}
                      translatedText={translatedText}
                      setTranslatedText={setTranslatedText}
                      exportElementId="mrt-research-export-target"
                      exportBaseFilename={`research-${(patient.condition || 'analysis').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}`}
                    />
                </div>
                {translatedText && (
                  <div data-pdf-exclude="1" style={{ marginBottom: '0.6rem', fontSize: '0.78rem', color: theme.textDim }}>
                    You're seeing the translated version. The original English does not change.
                  </div>
                )}
                <Markdown text={renderedResearchText} allowedUrls={reportAllowedUrls} />
              </div>
            )}

            {trialsData?.studies?.length > 0 && (
              <div id="live-clinical-trials" style={panelStyle}>
                <h3 style={{ margin: '0 0 0.35rem', color: theme.accent, fontSize: '1.05rem' }}>
                  Live clinical trials ({trialsData.returned || trialsData.studies.length})
                </h3>
                <p style={{ margin: '0 0 0.75rem', color: theme.textDim, fontSize: '0.86rem', lineHeight: 1.55 }}>
                  Studies with open enrollment from ClinicalTrials.gov (searches all years, not just 2025).
                  <strong style={{ color: theme.text }}> Open-Label Extension (OLE)</strong> lets trial participants keep the study drug after the main trial ends.
                  <strong style={{ color: theme.text }}> Expanded Access</strong> is compassionate use outside a trial when you do not qualify.
                </p>
                <TrialsTable data={trialsData} />
              </div>
            )}

            {candidates.length > 0 && (
              <div style={panelStyle}>
                <h3 style={{ margin: 0, color: theme.accent, fontSize: '1.05rem' }}>
                  {candidates.length} drug &amp; supplement idea{candidates.length === 1 ? '' : 's'}
                  <span style={{ color: theme.textDim, fontWeight: 500, fontSize: '0.85rem', marginLeft: '0.5rem' }}>
                    · {neverResearched.length} never researched for {cond} · {researchedNotApproved.length} researched, not FDA-approved
                  </span>
                </h3>
                <p style={{ margin: '0.35rem 0 0', color: theme.textDim, fontSize: '0.86rem', lineHeight: 1.55 }}>
                  Conversation starters with your doctor, not prescriptions — split into Dorothy&rsquo;s two lists below.
                </p>
              </div>
            )}

            {/* SECTION 1 — never researched for this condition (Research tab mirror of RepurposeTab) */}
            {neverResearched.length > 0 && (
              <div style={{
                ...panelStyle,
                borderLeft: `4px solid ${theme.accent}`,
                background: `linear-gradient(90deg, ${theme.accent}12 0%, ${theme.panel} 55%)`
              }}>
                <h3 style={{ margin: '0 0 0.35rem', color: theme.accent, fontSize: '1.05rem', display: 'flex', alignItems: 'center', gap: '0.45rem' }}>
                  <Brain size={18} />
                  Drug &amp; Supplement Repurposing Ideas
                  <span style={{ color: theme.textDim, fontWeight: 500, fontSize: '0.85rem' }}>({neverResearched.length})</span>
                </h3>
                <p style={{ margin: '0 0 0.85rem', color: theme.textDim, fontSize: '0.86rem', lineHeight: 1.55 }}>
                  These have <strong style={{ color: theme.text }}>never been researched for {cond}</strong>.
                  The idea comes from how the drug or supplement works in <em>other</em> conditions.
                  Each card says there is no research for {cond}, explains why it might still help, and asks you to discuss it with your doctor.
                  Source links are about the drug in that other context — not studies of {cond}.
                </p>
                <div style={{ display: 'grid', gap: '0.85rem' }}>
                  {neverResearched.map((c, i) => (
                    <CandidateCard
                      key={`rd-nr-${i}`}
                      c={c}
                      rank={i + 1}
                      highlightMechanistic={true}
                      audience={audience}
                      conditionLabel={cond}
                    />
                  ))}
                </div>
              </div>
            )}

            {/* SECTION 2 — researched for condition, not FDA-approved */}
            {researchedNotApproved.length > 0 && (
              <div style={panelStyle}>
                <h3 style={{ margin: '0 0 0.35rem', color: theme.accent, fontSize: '1.05rem', display: 'flex', alignItems: 'center', gap: '0.45rem' }}>
                  <Flask size={18} />
                  Researched, Not Yet FDA-Approved for {cond}
                  <span style={{ color: theme.textDim, fontWeight: 500, fontSize: '0.85rem' }}>({researchedNotApproved.length})</span>
                </h3>
                <p style={{ margin: '0 0 0.85rem', color: theme.textDim, fontSize: '0.86rem', lineHeight: 1.55 }}>
                  These drugs and supplements <strong style={{ color: theme.text }}>have been researched for {cond}</strong>
                  {' '}(lab, animal, or early human studies) but are <strong style={{ color: theme.text }}>not FDA-approved</strong> for it.
                  Each card links to that research. Already-approved treatments appear only under Approved Treatments — not here.
                </p>
                <div style={{ display: 'grid', gap: '0.85rem' }}>
                  {researchedNotApproved.map((c, i) => (
                    <CandidateCard
                      key={`rd-rna-${i}`}
                      c={c}
                      rank={i + 1}
                      audience={audience}
                      conditionLabel={cond}
                    />
                  ))}
                </div>
              </div>
            )}

            {combos.length > 0 && (
              <div style={panelStyle}>
                <h3 style={{ margin: '0 0 0.35rem', color: theme.accent, fontSize: '1.05rem' }}>
                  Combination ideas ({combos.length})
                </h3>
                <p style={{ margin: '0 0 0.75rem', color: theme.textDim, fontSize: '0.86rem', lineHeight: 1.55 }}>
                  Drugs that might work better together than alone — including OTC + prescription pairs when the literature supports it. Hypothesis only; discuss with your doctor.
                </p>
                <div style={{ display: 'grid', gap: '0.85rem' }}>
                  {combos.map((c, i) => (
                    <ComboCard key={`combo-${i}`} c={c} rank={i + 1} />
                  ))}
                </div>
              </div>
            )}

            <div style={panelStyle}>
              <h3 style={{ marginTop: 0, color: theme.accent, fontSize: '1rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <Database size={18} /> Ask a follow-up question (uses your profile and reading level)
              </h3>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem', marginBottom: '0.75rem' }}>
                {quickPrompts.map((p, i) => (
                  <button key={i} style={btn('ghost')} onClick={() => setUserQuery(p)}>
                    {p.length > 70 ? p.slice(0, 67) + '…' : p}
                  </button>
                ))}
              </div>
              <div style={{ maxHeight: 360, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '0.5rem', marginBottom: '0.75rem' }}>
                {chatHistory.map((m, i) => (
                  <div key={i} style={{
                    padding: '0.75rem', borderRadius: 8, maxWidth: '85%',
                    alignSelf: m.role === 'user' ? 'flex-end' : 'flex-start',
                    background: m.role === 'user' ? theme.accentSoft : theme.panel,
                    border: `1px solid ${m.role === 'user' ? theme.accentEdge : theme.border}`
                  }}>
                    <div style={{ fontSize: '0.75rem', color: theme.accent, fontWeight: 600, marginBottom: 4 }}>
                      {m.role === 'user' ? 'You' : 'Assistant'}
                    </div>
                    {m.role === 'user'
                      ? <div style={{ whiteSpace: 'pre-wrap', fontSize: '0.9rem', lineHeight: 1.55 }}>{m.content}</div>
                      : <Markdown text={m.content} />}
                  </div>
                ))}
                {busy === 'chat' && (
                  <div style={{
                    padding: '0.75rem', borderRadius: 8, maxWidth: '85%', alignSelf: 'flex-start',
                    background: theme.panel, border: `1px solid ${theme.border}`,
                    display: 'flex', alignItems: 'center', gap: '0.5rem', color: theme.textDim, fontSize: '0.85rem'
                  }}>
                    <Loader size={14} className="spin" />
                    <span>Working… finding trials and research, and putting together a summary…</span>
                  </div>
                )}
              </div>
              <div style={{ display: 'flex', gap: '0.5rem' }}>
                <input value={userQuery} onChange={e => setUserQuery(e.target.value)}
                  placeholder={patient.condition ? `Ask about ${patient.condition}… or type a new disease to switch.` : "Type a disease to research (e.g. 'RP', 'LADA', 'Retinitis Pigmentosa') or ask a question."}
                  onKeyDown={e => { if (e.key === 'Enter' && !busy && userQuery.trim()) { e.preventDefault(); sendChat(); } }}
                  style={{ ...inputStyle, flex: 1 }} />
                <button style={btn('primary', !!busy || !userQuery.trim())}
                  disabled={!!busy || !userQuery.trim()} onClick={sendChat}>
                  {busy === 'chat' ? <Loader size={16} className="spin" /> : <Search size={16} />} Send
                </button>
              </div>
              <p style={{ margin: '0.65rem 0 0', fontSize: '0.72rem', color: theme.textDim, lineHeight: 1.45 }}>
                {CHAT_SESSION_FOOTNOTE}
              </p>
            </div>
          </div>
        );
      };

      /* ==================== Clinical Trials Tab ==================== */
      const TrialsTab = ({ patient, busy, trialsData, trialBlocks, trialsText, validation,
                           runTrialsFetch, runTrialsAnalysis, onAudit, runtimeConfig, runMeta, evidencePack }) => {
        const [filters, setFilters] = useState({ recruitingOnly: true, treatmentOnly: true, excludePlacebo: false });
        const [translatedText, setTranslatedText] = useState('');
        const renderedTrialsText = translatedText || trialsText;
        const trialAllowedUrls = useMemo(
          () => buildAllowedUrlSet(trialsData, evidencePack),
          [trialsData, evidencePack]
        );
        const eaPrograms = useMemo(
          () => (trialsData?.studies || []).filter((s) => s.isExpandedAccessStudy === true),
          [trialsData]
        );
        return (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
            <AdSlot runtimeConfig={runtimeConfig} slotKey="trialsTop" />
            <div style={panelStyle}>
              <h2 style={{ margin: 0, color: theme.accent, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <Beaker size={22} /> Clinical trials for {patient.condition || 'your condition'}
              </h2>
              <p style={{ color: theme.textDim, fontSize: '0.9rem', marginTop: '0.5rem', lineHeight: 1.55 }}>
                We pull live studies from ClinicalTrials.gov, then hide studies that are clearly for a <strong>different condition</strong>,
                then rank the rest by phase, whether they are still enrolling, placebo use, safety oversight,
                and whether you can keep the drug after the study ends.
              </p>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '1rem', alignItems: 'center', marginTop: '0.75rem' }}>
                <label style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', fontSize: '0.85rem' }}>
                  <input type="checkbox" checked={filters.recruitingOnly}
                    onChange={e => setFilters(f => ({ ...f, recruitingOnly: e.target.checked }))} />
                  Recruiting / enrolling only
                </label>
                <label style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', fontSize: '0.85rem' }}>
                  <input type="checkbox" checked={filters.treatmentOnly}
                    onChange={e => setFilters(f => ({ ...f, treatmentOnly: e.target.checked }))} />
                  Treatment studies only (skip observation-only studies)
                </label>
                <label style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', fontSize: '0.85rem' }}>
                  <input type="checkbox" checked={filters.excludePlacebo}
                    onChange={e => setFilters(f => ({ ...f, excludePlacebo: e.target.checked }))} />
                  Hide studies that use a placebo (a dummy treatment)
                </label>
                <button style={btn('primary', !!busy)} disabled={!!busy}
                  onClick={() => runTrialsFetch(filters)}>
                  {busy === 'trials-fetch' ? <><Loader size={16} className="spin" /> Fetching…</>
                    : <><Database size={16} /> Fetch Live Trials</>}
                </button>
                <button style={btn('ghost', !!busy || !trialsData)} disabled={!!busy || !trialsData}
                  onClick={runTrialsAnalysis}>
                  {busy === 'trials' ? <><Loader size={16} className="spin" /> Analyzing…</>
                    : <><Brain size={16} /> Analyze for This Patient</>}
                </button>
              </div>
            </div>

            {(busy === 'trials-fetch' || busy === 'trials') && (
              <div style={{ ...panelStyle, padding: '0.75rem 0.9rem' }}>
                <div style={{ fontSize: '0.82rem', color: theme.textDim, marginBottom: 6 }}>
                  {busy === 'trials-fetch' ? 'Scanning ClinicalTrials.gov…' : 'Analyzing top trials for this patient…'}
                </div>
                <div style={{ width: '100%', height: 8, borderRadius: 999, background: theme.accentSoft, overflow: 'hidden' }}>
                  <div style={{
                    width: '42%', height: '100%',
                    background: `linear-gradient(90deg, ${theme.accent}, ${theme.secondary})`,
                    borderRadius: 999, animation: 'mrtLoadPulse 1.25s ease-in-out infinite'
                  }} />
                </div>
              </div>
            )}

            <Glossary />

            {trialsData && (
              <div style={{
                ...panelStyle,
                borderLeft: `4px solid ${eaPrograms.length ? theme.green : theme.yellow}`
              }}>
                <h3 style={{ margin: '0 0 0.35rem', color: theme.accent, fontSize: '1rem' }}>
                  Expanded Access / Compassionate Use
                </h3>
                <p style={{ margin: '0 0 0.65rem', fontSize: '0.84rem', color: theme.textDim, lineHeight: 1.55 }}>
                  These are <strong style={{ color: theme.text }}>special CT.gov programs</strong> to get a not-yet-approved drug
                  <em> outside</em> a normal trial. They are <strong>not</strong> the same as investigational drugs in phase 2/3 trials
                  or FDA-approved treatments listed below for context.
                </p>
                {eaPrograms.length > 0 ? (
                  <ul style={{ margin: 0, paddingLeft: '1.1rem', fontSize: '0.86rem', lineHeight: 1.55 }}>
                    {eaPrograms.map((s) => (
                      <li key={s.nctId} style={{ marginBottom: '0.45rem' }}>
                        <a href={s.url} target="_blank" rel="noopener noreferrer" style={{ color: theme.accent, fontWeight: 600 }}>
                          {s.nctId} ↗
                        </a>
                        {' — '}{s.briefTitle}
                        {s.sponsor ? <span style={{ color: theme.textDim }}> ({s.sponsor})</span> : null}
                      </li>
                    ))}
                  </ul>
                ) : (
                  <p style={{
                    margin: 0, padding: '0.65rem 0.75rem', borderRadius: 8,
                    background: `${theme.yellow}12`, border: `1px solid ${theme.yellow}44`,
                    fontSize: '0.86rem', color: theme.text, lineHeight: 1.5
                  }}>
                    <strong>No Expanded Access programs</strong> were found on ClinicalTrials.gov for this search.
                    Drugs shown elsewhere on this page (approved treatments or trials in development) are <em>not</em> expanded access.
                  </p>
                )}
              </div>
            )}

            {trialsData && <ClinicalTrialsSnapshot patient={patient} data={trialsData} />}

            {trialsData && <TrialsTable data={trialsData} />}

            {trialBlocks.length > 0 && <RankedTrialsForPatient blocks={trialBlocks} />}

            <ValidatorPanel validation={validation} onAudit={onAudit} canAudit={!!trialsText} condition={patient.condition} />

            {trialsText && (
              <div id="mrt-trials-export-target" style={{ ...panelStyle, borderColor: `${theme.accent}55` }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '0.5rem', flexWrap: 'wrap', marginBottom: '0.6rem' }}>
                  <h3 style={{ margin: 0, color: theme.accent, fontSize: '1.05rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                    <Brain size={18} /> Full report made for you
                  </h3>
                  <AnalysisExportBar
                    getElement={() => document.getElementById('mrt-trials-export-target')}
                    exportBaseFilename={`trials-${(patient.condition || 'analysis').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}`}
                    disabled={!renderedTrialsText}
                    text={renderedTrialsText}
                  />
                </div>
                <div style={{ marginBottom: '0.5rem' }}>
                  <AnalysisLanguageToolbar
                    sourceText={trialsText}
                    translatedText={translatedText}
                    setTranslatedText={setTranslatedText}
                    exportElementId="mrt-trials-export-target"
                    exportBaseFilename={`trials-${(patient.condition || 'analysis').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}`}
                  />
                </div>
                {translatedText && (
                  <div data-pdf-exclude="1" style={{ marginBottom: '0.6rem', fontSize: '0.78rem', color: theme.textDim }}>
                    You're seeing the translated version. The original English does not change.
                  </div>
                )}
                <Markdown text={renderedTrialsText} allowedUrls={trialAllowedUrls} />
              </div>
            )}
          </div>
        );
      };

      const Glossary = () => (
        <details style={{ ...panelStyle, cursor: 'pointer' }}>
          <summary style={{ color: theme.accent, fontWeight: 700, fontSize: '0.95rem', listStyle: 'none' }}>
            Trial words explained (OLE, Expanded Access, PTA) ▾
          </summary>
          <div style={{ marginTop: '0.75rem' }}>
            <table style={{ width: '100%', fontSize: '0.88rem' }}>
              <tbody>
                {[
                  ['Open-Label Extension (OLE)', 'If the trial drug seems to work, people in the study can keep taking it after it ends — everyone gets the real drug, not a placebo.'],
                  ['Expanded Access / Compassionate Use', 'A way to get a drug that is not yet FDA-approved, outside of a normal study — usually for a serious illness.'],
                  ['Post-Trial Access (PTA)', 'After the study ends, you can keep getting the drug for free.']
                ].map(([k,v]) => (
                  <tr key={k} style={{ borderTop: `1px solid ${theme.border}` }}>
                    <td style={{ padding: '0.5rem 0.75rem', fontWeight: 600, color: theme.text, width: 240, verticalAlign: 'top' }}>{k}</td>
                    <td style={{ padding: '0.5rem 0.75rem', color: theme.textDim, lineHeight: 1.5 }}>{v}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </details>
      );

      const ClinicalTrialsSnapshot = ({ patient, data }) => {
        if (!data?.studies?.length) return null;
        const studies = data.studies || [];
        const kb = data.kbContext;
        const dropped = data.breakdown?.droppedWrongCondition || 0;

        const byPhaseLate = studies
          .filter((s) => (s.relevanceScore || 0) >= 15)
          .filter((s) => (s.phases || []).join(',').includes('PHASE3') || (s.phases || []).join(',').includes('PHASE2'))
          .slice(0, 8);

        const interventionText = (s) => {
          const iv = (s.interventions || []).map((i) => i.name).filter(Boolean).slice(0, 2).join(' + ');
          return iv || s.briefTitle || '';
        };

        return (
          <div style={panelStyle}>
            <h3 style={{ marginTop: 0, color: theme.accent, fontSize: '1rem' }}>
              Snapshot · {data.total} trials ranked for {patient?.condition || 'this condition'}
            </h3>
            {dropped > 0 && (
              <p style={{ margin: '0 0 0.75rem', fontSize: '0.82rem', color: theme.textDim, lineHeight: 1.45 }}>
                {dropped} other stud{dropped === 1 ? 'y was' : 'ies were'} found on ClinicalTrials.gov for a different condition and hidden from this list.
              </p>
            )}
            <div style={{ display: 'grid', gap: '0.85rem' }}>
              {kb?.approvedDrugs?.length > 0 && (
                <div>
                  <div style={{ fontSize: '0.82rem', fontWeight: 700, color: theme.text }}>
                    FDA-approved treatments (reference library — not trials, not expanded access)
                  </div>
                  <ul style={{ margin: '0.35rem 0 0', paddingLeft: '1rem', color: theme.textDim, fontSize: '0.82rem', lineHeight: 1.55 }}>
                    {kb.approvedDrugs.map((d, i) => (
                      <li key={i}><strong style={{ color: theme.text }}>{d.name}</strong>{d.status ? ` — ${d.status}` : ''}</li>
                    ))}
                  </ul>
                </div>
              )}
              {kb?.pipelineHighlights?.length > 0 && (
                <div>
                  <div style={{ fontSize: '0.82rem', fontWeight: 700, color: theme.text }}>
                    Drugs in development (reference library — look for these in the trial table, not under Expanded Access)
                  </div>
                  <ul style={{ margin: '0.35rem 0 0', paddingLeft: '1rem', color: theme.textDim, fontSize: '0.82rem', lineHeight: 1.55 }}>
                    {kb.pipelineHighlights.map((d, i) => (
                      <li key={i}><strong style={{ color: theme.text }}>{d.name}</strong>{d.status ? ` — ${d.status}` : ''}</li>
                    ))}
                  </ul>
                </div>
              )}
              {kb?.keyFacts?.length > 0 && (
                <div>
                  <div style={{ fontSize: '0.82rem', fontWeight: 700, color: theme.text }}>Key facts from research</div>
                  <ul style={{ margin: '0.35rem 0 0', paddingLeft: '1rem', color: theme.textDim, fontSize: '0.82rem', lineHeight: 1.55 }}>
                    {kb.keyFacts.map((f, i) => <li key={i}>{typeof f === 'string' ? f : f}</li>)}
                  </ul>
                </div>
              )}
              {!kb && data.dossier?.canonical && (
                <p style={{ margin: 0, fontSize: '0.82rem', color: theme.textDim, lineHeight: 1.5 }}>
                  Searching as <strong style={{ color: theme.text }}>{data.dossier.canonical}</strong>
                  {data.dossier.subspecialty ? ` (${data.dossier.subspecialty})` : ''}.
                  {runtimeConfig?.dynamicKb?.enabled
                    ? ' No saved references for this condition yet — a full run will look up journals and trials.'
                    : ' Saved references for this condition are included on every run.'}
                </p>
              )}
              {!kb && !data.dossier?.canonical && (
                <p style={{ margin: 0, fontSize: '0.82rem', color: theme.textDim, lineHeight: 1.5 }}>
                  Confirm approved baseline options with your specialist — this list is trial-focused.
                </p>
              )}

              <div>
                <div style={{ fontSize: '0.82rem', fontWeight: 700, color: theme.text }}>Top late-stage trials (phase 2/3) in this list</div>
                <ul style={{ margin: '0.35rem 0 0', paddingLeft: '1rem', color: theme.textDim, fontSize: '0.82rem', lineHeight: 1.55 }}>
                  {byPhaseLate.map((s) => (
                    <li key={s.nctId || s.briefTitle}>
                      <strong style={{ color: theme.text }}>{(s.phases || []).join(', ') || 'N/A'}</strong> — {interventionText(s)}
                      {s.relevanceLabel === 'unlikely match' && (
                        <span style={{ color: theme.yellow }}> · verify this applies to you</span>
                      )}
                    </li>
                  ))}
                  {byPhaseLate.length === 0 && <li>No strong phase 2/3 matches in the current filtered set.</li>}
                </ul>
              </div>
            </div>
          </div>
        );
      };

      // Shared score breakdown for the trials table + explainer panel.
      const trialPromiseBreakdown = (s) => {
        const WESTERN = new Set([
          'United States', 'Canada', 'United Kingdom', 'Germany', 'France', 'Italy',
          'Spain', 'Netherlands', 'Sweden', 'Denmark', 'Norway', 'Finland', 'Belgium',
          'Switzerland', 'Ireland', 'Austria', 'Australia', 'New Zealand', 'Japan'
        ]);
        const CHINA_LIKE = new Set(['China', 'Vietnam', 'Mexico', 'India']);
        const phase = (s.phases || []).join(',');
        const chunks = [];
        if (s.relevanceReason) {
          chunks.push({
            label: s.relevanceLabel || 'Condition match',
            value: s.relevanceScore >= 45 ? '+12' : s.relevanceScore >= 15 ? '+4' : s.relevanceScore < 0 ? '-50' : '0',
            color: s.relevanceScore >= 15 ? theme.green : s.relevanceScore < 0 ? theme.red : theme.yellow,
            why: s.relevanceReason
          });
        }
        if (phase.includes('PHASE3')) chunks.push({ label: 'Phase 3', value: '+40', color: theme.green,
          why: 'Largest stage before FDA approval — strongest evidence that the drug works.' });
        else if (phase.includes('PHASE2')) chunks.push({ label: 'Phase 2', value: '+25', color: theme.green,
          why: 'Tests whether the drug works in people — earlier than phase 3 but real human data.' });
        else if (phase.includes('PHASE1')) chunks.push({ label: 'Phase 1', value: '+10', color: theme.yellow,
          why: 'Mostly checks safety and dose — we do not yet know if it helps your condition.' });
        if (s.acceptingNewPatients) chunks.push({ label: 'Still enrolling', value: '+15', color: theme.green,
          why: 'You can contact a study site today to see if you qualify.' });
        if (!s.hasPlacebo) chunks.push({ label: 'No placebo', value: '+10', color: theme.green,
          why: 'Everyone gets the real drug — not a dummy pill.' });
        if (s.designations?.hasOpenLabelExtension) chunks.push({ label: 'Can keep drug after', value: '+15', color: theme.green,
          why: 'Open-Label Extension: you may keep the drug after the main study ends.' });
        if (s.isExpandedAccessStudy) chunks.push({ label: 'Expanded Access program', value: '+20', color: theme.green,
          why: 'This is a CT.gov Expanded Access / compassionate-use program — you may get the drug outside a normal trial.' });
        if ((s.topCenterScore || 0) > 0) chunks.push({ label: 'Top hospital site', value: `+${s.topCenterScore}`, color: theme.accent,
          why: 'At least one site is a leading center for this disease.' });
        const westernHit = (s.countries || []).some(c => WESTERN.has(c));
        const chinaHit = (s.countries || []).some(c => CHINA_LIKE.has(c));
        if (westernHit) chunks.push({ label: 'US/Western site', value: '+10', color: theme.accent,
          why: 'Has a site in the US, Canada, or Western Europe — easier to verify and travel to.' });
        if (chinaHit) chunks.push({ label: 'Hard-to-check site', value: '-15', color: theme.red,
          why: 'Runs in a region where safety data is harder to verify from the US.' });
        if (s.oversight?.oversightHasDMC) chunks.push({ label: 'Safety watchdog', value: '+4', color: theme.green,
          why: 'An independent team monitors safety and can stop the study early if needed.' });
        const STATUS = String(s.status || '').toUpperCase();
        if (['COMPLETED'].includes(STATUS)) chunks.push({ label: 'Already finished', value: '-55', color: theme.red,
          why: 'This study has finished — you cannot join it. Ranked below trials still taking patients.' });
        else if (['TERMINATED', 'WITHDRAWN', 'SUSPENDED'].includes(STATUS)) chunks.push({ label: 'Stopped / closed', value: '-60', color: theme.red,
          why: 'This study was stopped or withdrawn — you cannot join it. Ranked below trials still taking patients.' });
        else if (STATUS === 'ACTIVE_NOT_RECRUITING') chunks.push({ label: 'Closed to new patients', value: '-25', color: theme.yellow,
          why: 'The study is ongoing but no longer signing up new participants.' });
        if (s.caution) chunks.push({ label: 'Safety caution', value: '-30', color: theme.red, why: s.caution });
        return chunks;
      };

      const TrialScoreExplainer = ({ trial, onClose }) => {
        if (!trial) return null;
        const chunks = trialPromiseBreakdown(trial);
        return (
          <div id="mrt-trial-why-panel" style={{
            ...panelStyle,
            borderLeft: `4px solid ${theme.accent}`,
            marginBottom: '0.75rem'
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '0.75rem', flexWrap: 'wrap' }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: '0.72rem', fontWeight: 700, color: theme.accent, textTransform: 'uppercase', letterSpacing: 0.4 }}>
                  Why this score?
                </div>
                <div style={{ fontWeight: 700, color: theme.text, marginTop: 4, lineHeight: 1.35 }}>
                  {trial.briefTitle}
                </div>
                <div style={{ fontSize: '0.78rem', color: theme.textDim, marginTop: 2 }}>
                  {trial.nctId} · Promise score <strong style={{ color: theme.text }}>{trial.promiseScore}/100</strong>
                  {trial.relevanceLabel && <> · Match: <strong style={{ color: theme.text }}>{trial.relevanceLabel}</strong></>}
                </div>
              </div>
              <button type="button" onClick={onClose} style={{ ...btn('ghost', false), padding: '0.35rem 0.65rem', fontSize: '0.78rem' }}>Close</button>
            </div>
            <div style={{ marginTop: '0.85rem', display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
              {chunks.map((c, i) => (
                <div key={i} style={{
                  display: 'flex', alignItems: 'flex-start', gap: '0.6rem',
                  padding: '0.5rem 0.65rem', borderRadius: 8,
                  border: `1px solid ${c.color}44`, background: `${c.color}10`
                }}>
                  <span style={{
                    flex: '0 0 auto', minWidth: 110, textAlign: 'center',
                    padding: '0.18rem 0.5rem', borderRadius: 999,
                    border: `1px solid ${c.color}77`, color: c.color, background: `${c.color}20`,
                    fontSize: '0.74rem', fontWeight: 700
                  }}>
                    {c.label} {c.value}
                  </span>
                  <span style={{ fontSize: '0.84rem', color: theme.text, lineHeight: 1.5 }}>{c.why}</span>
                </div>
              ))}
            </div>
            <p style={{ marginTop: '0.75rem', marginBottom: 0, fontSize: '0.76rem', color: theme.textDim, lineHeight: 1.45 }}>
              These factors are combined and scaled to a <strong>0–100</strong> promise score — higher means more promising for a patient who wants to act now.
            </p>
            <div style={{ marginTop: '0.6rem' }}>
              <a href={trial.url} target="_blank" rel="noopener noreferrer" style={{ color: theme.accent, fontWeight: 600, fontSize: '0.85rem' }}>
                Open on ClinicalTrials.gov ↗
              </a>
            </div>
          </div>
        );
      };

      const TrialsTable = ({ data }) => {
        const [sortMode, setSortMode] = useState('promise');
        const [whyTrial, setWhyTrial] = useState(null);
        const phaseRank = (s) => {
          const p = (s.phases || []).join(',');
          if (p.includes('PHASE3')) return 4;
          if (p.includes('PHASE2')) return 3;
          if (p.includes('PHASE1')) return 2;
          return 1;
        };
        const efficacyProxyScore = (s) => {
          let n = 0;
          n += phaseRank(s) * 30;
          if (!s.hasPlacebo) n += 15;
          if (s.acceptingNewPatients) n += 10;
          if (s.oversight?.oversightHasDMC) n += 6;
          return n;
        };
        const rows = [...(data.studies || [])].sort((a, b) => {
          if (sortMode === 'efficacy') return efficacyProxyScore(b) - efficacyProxyScore(a);
          if (sortMode === 'access') {
            const aScore = (a.isExpandedAccessStudy ? 3 : 0) + (a.designations?.hasOpenLabelExtension ? 2 : 0) + (a.designations?.hasPostTrialAccess ? 1 : 0) + (a.acceptingNewPatients ? 2 : 0);
            const bScore = (b.isExpandedAccessStudy ? 3 : 0) + (b.designations?.hasOpenLabelExtension ? 2 : 0) + (b.designations?.hasPostTrialAccess ? 1 : 0) + (b.acceptingNewPatients ? 2 : 0);
            return bScore - aScore;
          }
          return (b.promiseScore || 0) - (a.promiseScore || 0);
        });
        const matchColor = (label) => {
          if (label === 'strong match') return theme.green;
          if (label === 'likely match') return theme.accent;
          if (label === 'weak match' || label === 'unlikely match') return theme.yellow;
          if (label === 'wrong disease') return theme.red;
          return theme.textDim;
        };
        return (
        <div style={panelStyle}>
          <TrialScoreExplainer trial={whyTrial} onClose={() => setWhyTrial(null)} />
            <h3 style={{ marginTop: 0, color: theme.accent, fontSize: '1rem', display: 'flex', alignItems: 'center', gap: '0.45rem', flexWrap: 'wrap' }}>
            Top {Math.min(25, rows.length)} trials · {data.total} matched your search
          </h3>
          {(data.breakdown?.droppedWrongCondition || 0) > 0 && (
            <p style={{ margin: '0 0 0.65rem', fontSize: '0.82rem', color: theme.textDim, lineHeight: 1.45 }}>
              We also found {data.breakdown.droppedWrongCondition} other studies on ClinicalTrials.gov that were
              for a <strong>different condition</strong> (for example, a drug-name search that pulled in unrelated diseases).
              Those are hidden so this list stays focused on {data.query?.condition || 'your search'}.
            </p>
          )}
          <p style={{ margin: '0 0 0.65rem', fontSize: '0.82rem', color: theme.textDim, lineHeight: 1.45 }}>
            Tap <strong>Why this score?</strong> on any row to see exactly how the number was built.
          </p>
          <div style={{ marginBottom: '0.65rem', display: 'flex', alignItems: 'center', gap: '0.5rem', flexWrap: 'wrap' }}>
            <span style={{ fontSize: '0.78rem', color: theme.textDim }}>Sort by:</span>
            <select
              value={sortMode}
              onChange={(e) => setSortMode(e.target.value)}
              style={{ ...inputStyle, width: 'auto', padding: '0.3rem 0.5rem', fontSize: '0.78rem' }}
              title="Choose ranking emphasis"
            >
              <option value="promise">Overall promise (balanced)</option>
              <option value="efficacy">How likely it is to work</option>
              <option value="access">Easiest to get the drug</option>
            </select>
          </div>
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '0.82rem' }}>
              <thead>
                <tr style={{ background: theme.accentSoft, borderBottom: `2px solid ${theme.accent}` }}>
                  {['Title / NCT','Phase','Status','Accepting','Placebo','Special status','Countries','Safety checks','Score /100',''].map(h => (
                    <th key={h} style={{ padding: '0.6rem', textAlign: 'left', color: theme.accent, fontWeight: 700 }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.slice(0, 25).map((s, idx) => {
                  const rowKey = s.nctId || `${s.briefTitle || 'trial'}-${idx}`;
                  const isSelected = whyTrial?.nctId === s.nctId;
                  return (
                      <tr key={rowKey} style={{
                        borderBottom: `1px solid ${theme.border}`,
                        verticalAlign: 'top',
                        background: isSelected ? `${theme.accent}12` : 'transparent'
                      }}>
                        <td style={{ padding: '0.6rem', maxWidth: 360 }}>
                          <div style={{ color: theme.accent, fontWeight: 600 }}>{s.briefTitle}</div>
                          <div style={{ color: theme.textDim, fontSize: '0.75rem' }}>{s.nctId} · {s.sponsor || ''}</div>
                          {s.relevanceLabel && (
                            <span style={{
                              display: 'inline-block', marginTop: 4, fontSize: '0.68rem', fontWeight: 700,
                              padding: '0.12rem 0.4rem', borderRadius: 999,
                              color: matchColor(s.relevanceLabel),
                              border: `1px solid ${matchColor(s.relevanceLabel)}55`,
                              background: `${matchColor(s.relevanceLabel)}12`
                            }}>
                              {s.relevanceLabel}
                            </span>
                          )}
                          {s.caution && (
                            <div title={s.caution} style={{
                              marginTop: 4, fontSize: '0.68rem', fontWeight: 700,
                              padding: '0.12rem 0.4rem', borderRadius: 6,
                              color: theme.red, border: `1px solid ${theme.red}55`, background: `${theme.red}12`,
                              display: 'inline-block', cursor: 'help'
                            }}>
                              ⚠ Stopped / negative
                            </div>
                          )}
                        </td>
                        <td style={{ padding: '0.6rem' }}>{(s.phases || []).join(', ') || '—'}</td>
                        <td style={{ padding: '0.6rem' }}>{s.status}</td>
                        <td style={{ padding: '0.6rem', color: s.acceptingNewPatients ? theme.green : theme.textDim }}>
                          {s.acceptingNewPatients ? 'Yes' : 'No'}
                        </td>
                        <td style={{ padding: '0.6rem', color: s.hasPlacebo ? theme.yellow : theme.green }}>
                          {s.hasPlacebo ? 'Yes' : 'No'}
                        </td>
                        <td style={{ padding: '0.6rem', fontSize: '0.75rem' }}>
                          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.25rem' }}>
                            {s.designations?.hasOpenLabelExtension && <span title="Open-Label Extension: if the drug works, you can keep taking it after the study ends." style={{ padding: '0.12rem 0.35rem', borderRadius: 999, border: `1px solid ${theme.accent}55`, color: theme.accent }}>Can keep drug after</span>}
                            {s.isExpandedAccessStudy && <span title="CT.gov Expanded Access program — get the drug outside a normal trial." style={{ padding: '0.12rem 0.35rem', borderRadius: 999, border: `1px solid ${theme.green}55`, color: theme.green }}>Expanded Access</span>}
                            {s.designations?.hasPostTrialAccess && <span title="The company keeps giving you the drug after the study ends, even before the FDA approves it." style={{ padding: '0.12rem 0.35rem', borderRadius: 999, border: `1px solid ${theme.yellow}55`, color: theme.yellow }}>Drug after the trial</span>}
                            {s.designations?.hasPayToAccess && <span title="You may have to pay to get the drug." style={{ padding: '0.12rem 0.35rem', borderRadius: 999, border: `1px solid ${theme.red}55`, color: theme.red }}>You may have to pay</span>}
                            {!s.designations?.hasOpenLabelExtension && !s.isExpandedAccessStudy && !s.designations?.hasPostTrialAccess && !s.designations?.hasPayToAccess && <span>—</span>}
                          </div>
                        </td>
                        <td style={{ padding: '0.6rem', fontSize: '0.75rem' }}>{(s.countries || []).join(', ') || '—'}</td>
                        <td style={{ padding: '0.6rem', fontSize: '0.75rem' }}>
                          {s.oversight?.oversightHasDMC ? <span title="An independent safety team watches the study and can stop it early if something looks unsafe.">Safety team ✓ </span> : ''}{s.oversight?.fdaRegulatedDrug ? <span title="The drug is made under FDA rules.">FDA-checked drug ✓</span> : ''}
                        </td>
                        <td style={{ padding: '0.6rem', fontWeight: 700 }}>
                          <div>{s.promiseScore}<span style={{ fontWeight: 400, fontSize: '0.72rem', color: theme.textDim }}>/100</span></div>
                          <button
                            type="button"
                            onClick={() => {
                              setWhyTrial(isSelected ? null : s);
                              if (!isSelected) {
                                setTimeout(() => {
                                  document.getElementById('mrt-trial-why-panel')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                                }, 50);
                              }
                            }}
                            style={{
                              marginTop: 4,
                              background: isSelected ? `${theme.accent}22` : 'transparent',
                              border: `1px solid ${isSelected ? theme.accent : theme.border}`,
                              color: isSelected ? theme.accent : theme.textDim,
                              borderRadius: 6, padding: '0.15rem 0.45rem',
                              fontSize: '0.72rem', cursor: 'pointer', fontWeight: 600
                            }}
                          >
                            {isSelected ? 'Hide score' : 'Why this score?'}
                          </button>
                        </td>
                        <td style={{ padding: '0.6rem' }}>
                          <a href={s.url} target="_blank" rel="noopener" style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontSize: '0.8rem' }}>
                            Open <ExternalLink size={12} />
                          </a>
                        </td>
                      </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
      };

      const RankedTrialsForPatient = ({ blocks }) => (
        <div style={panelStyle}>
          <h3 style={{ marginTop: 0, color: theme.accent, fontSize: '1rem' }}>
            Top trials matched to this patient
          </h3>
          <div style={{ display: 'grid', gap: '0.75rem' }}>
            {blocks.map((b, i) => (
              <div key={i} style={{
                padding: '0.9rem', background: theme.panel,
                borderRadius: 8, border: `1px solid ${theme.border}`
              }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: '0.5rem' }}>
                  <div style={{ fontWeight: 600, color: theme.accent }}>{b.trial}</div>
                  <div style={{ fontSize: '0.8rem' }}>
                    <span style={{ color: ratingColor(b.fit_for_patient_pct) }}>Fit: {b.fit_for_patient_pct ?? '?'}%</span>
                    {' · '}
                    <span style={{ color: ratingColor(b.harm_risk_pct) }}>Safety: {b.harm_risk_pct ?? '?'}%</span>
                  </div>
                </div>
                <div style={{ fontSize: '0.8rem', color: theme.textDim, marginTop: 4 }}>
                  {b.nct} · {b.phase} · {b.status} · {b.country}
                </div>
                <div style={{ fontSize: '0.85rem', marginTop: '0.5rem' }}>{b.summary}</div>
                {b.interactions && (
                  <div style={{ fontSize: '0.8rem', marginTop: '0.4rem', color: theme.yellow }}>
                    ⚠ Interactions: {b.interactions}
                  </div>
                )}
                {b.url && (
                  <div style={{ marginTop: '0.5rem' }}>
                    <a href={b.url.trim()} target="_blank" rel="noopener" style={{ fontSize: '0.85rem' }}>
                      Open on ClinicalTrials.gov ↗
                    </a>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );

      /* ==================== Drug Repurposing Tab (EveryCure-style) ==================== */
      // Expandable disclosure for a titled section on the candidate card.
      const Disclosure = ({ title, icon, color, children, defaultOpen = false }) => {
        const [open, setOpen] = useState(defaultOpen);
        const accent = color || theme.accent;
        return (
          <div style={{
            marginTop: '0.5rem',
            borderRadius: 8,
            border: `1px solid ${accent}33`,
            background: `${accent}08`,
            overflow: 'hidden'
          }}>
            <button onClick={() => setOpen(v => !v)} style={{
              width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              background: 'transparent', border: 'none', cursor: 'pointer',
              padding: '0.55rem 0.8rem',
              color: accent, fontSize: '0.82rem', fontWeight: 700, letterSpacing: 0.3
            }}>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: '0.4rem' }}>
                {icon}{title}
              </span>
              {open ? <ChevronUp size={14} /> : <ChevronDown size={14} />}
            </button>
            {open && (
              <div style={{
                padding: '0 0.8rem 0.8rem',
                fontSize: '0.88rem', lineHeight: 1.6, color: theme.text,
                whiteSpace: 'pre-wrap'
              }}>
                {children}
              </div>
            )}
          </div>
        );
      };

      const RankBadge = ({ rank }) => (
        <div style={{
          width: 40, height: 40, borderRadius: 10,
          background: `linear-gradient(135deg, ${theme.accent}aa, ${theme.accent}55)`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontWeight: 800, fontSize: '1.1rem', color: '#ffffff',
          boxShadow: `0 2px 10px ${theme.accent}33`,
          fontVariantNumeric: 'tabular-nums'
        }}>
          #{rank}
        </div>
      );

      // Individual repurposing-candidate card. One per drug/supplement.
      const TREATMENT_LEAK_FIELDS = ['treatment', 'fda_status', 'provider', 'references', 'risks', 'efficacy', 'safety_note'];
      const TreatmentCard = ({ t: rawT, rank }) => {
        const { card: t, leaks } = useMemo(
          () => auditAndScrubCard(rawT, TREATMENT_LEAK_FIELDS, { kind: 'approved-treatment', label: rawT?.treatment }),
          [rawT]
        );
        const refText = linkifyMedicalIds(t.references || '');
        const cardLinks = useMemo(() => extractLinksFromText(refText), [refText]);
        const fda = String(t.fda_status || '').toLowerCase();
        const notApproved = fda && !fda.startsWith('approved');
        return (
          <div style={{
            padding: '1rem 1.1rem', background: theme.panel, borderRadius: 12,
            border: `1px solid ${notApproved ? theme.yellow + '88' : theme.border}`,
            position: 'relative', overflow: 'hidden'
          }}>
            <div style={{
              position: 'absolute', top: 0, left: 0, right: 0, height: 3,
              background: `linear-gradient(90deg, ${theme.green}, ${theme.accent})`
            }} />
            <div style={{ display: 'flex', alignItems: 'flex-start', gap: '0.9rem' }}>
              <RankBadge rank={rank} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 800, fontSize: '1.15rem', color: theme.text }}>
                  <InlineTitle text={t.treatment || '(unnamed treatment)'} />
                </div>
                <FormatWarning leaks={leaks} />
                {t.fda_status && (
                  <div style={{ fontSize: '0.78rem', color: notApproved ? theme.yellow : theme.green, marginTop: 4, fontWeight: 600 }}>
                    <InlineMD text={t.fda_status} />
                  </div>
                )}
                {t.provider && (
                  <div style={{ fontSize: '0.82rem', color: theme.textDim, marginTop: 4 }}><InlineMD text={t.provider} /></div>
                )}
                {cardLinks.length > 0 ? (
                  <div style={{ marginTop: '0.55rem' }}>
                    <div style={{ fontSize: '0.72rem', fontWeight: 700, color: theme.accent, textTransform: 'uppercase', marginBottom: 4 }}>
                      Sources ↗
                    </div>
                    {cardLinks.slice(0, 4).map((l, i) => (
                      <a key={i} href={l.url} target="_blank" rel="noopener noreferrer"
                        style={{ display: 'block', fontSize: '0.84rem', color: theme.accent, marginBottom: 4 }}>
                        {l.label} ↗
                      </a>
                    ))}
                  </div>
                ) : refText ? (
                  <div style={{ marginTop: '0.5rem', fontSize: '0.84rem' }}><Markdown text={refText} /></div>
                ) : null}
              </div>
            </div>
            {t.risks && (
              <div style={{ marginTop: '0.6rem', fontSize: '0.82rem', color: theme.textDim, lineHeight: 1.5 }}>
                <strong style={{ color: theme.text }}>Risks: </strong><InlineMD text={t.risks} />
              </div>
            )}
          </div>
        );
      };

      const COMBO_LEAK_FIELDS = ['combo', 'rationale', 'evidence_tier', 'supporting_evidence', 'interaction_risk', 'patient_specific_risks', 'confidence', 'how_to_discuss_with_doctor', 'references'];
      const ComboCard = ({ c: rawC, rank }) => {
        const { card: c, leaks } = useMemo(
          () => auditAndScrubCard(rawC, COMBO_LEAK_FIELDS, { kind: 'combination', label: rawC?.combo }),
          [rawC]
        );
        const linkText = linkifyMedicalIds([c.references, c.supporting_evidence].filter(Boolean).join('\n'));
        const cardLinks = useMemo(() => extractLinksFromText(linkText), [linkText]);
        return (
          <div style={{
            padding: '1rem', background: theme.panel, borderRadius: 12,
            border: `1px dashed ${theme.accent}66`
          }}>
            <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'flex-start' }}>
              <RankBadge rank={rank} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 800, fontSize: '1.05rem', color: theme.text }}><InlineTitle text={c.combo || 'Combination'} /></div>
                <FormatWarning leaks={leaks} />
                {c.evidence_tier && (
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem', marginTop: 6 }}>
                    <EvidenceStrengthBadge value={c.evidence_tier} />
                  </div>
                )}
                {c.rationale && <div style={{ marginTop: 8, fontSize: '0.88rem', lineHeight: 1.55 }}><InlineMD text={c.rationale} /></div>}
                {c.interaction_risk && (
                  <div style={{ marginTop: 8, fontSize: '0.82rem', color: theme.yellow }}>
                    <strong>Interaction risk: </strong><InlineMD text={c.interaction_risk} />
                  </div>
                )}
                {c.supporting_evidence && (
                  <Disclosure title="What the research says" icon={<Database size={13} />} color={theme.green}>
                    <Markdown text={c.supporting_evidence} />
                    <SourceLinks text={c.supporting_evidence} label="Links from evidence" />
                  </Disclosure>
                )}
                {c.patient_specific_risks && (
                  <Disclosure
                    title="Risks for this patient specifically"
                    icon={<AlertTriangle size={13} />}
                    color={theme.yellow}
                    defaultOpen={/high|moderate|interaction/i.test(String(c.interaction_risk))}
                  >
                    <InlineMD text={c.patient_specific_risks} />
                  </Disclosure>
                )}
                {c.how_to_discuss_with_doctor && (
                  <Disclosure title="Questions to ask your doctor" icon={<MessageCircle size={13} />} color={theme.green}>
                    <InlineMD text={c.how_to_discuss_with_doctor} />
                  </Disclosure>
                )}
                {cardLinks.length > 0 && (
                  <div style={{ marginTop: 8, display: 'flex', flexDirection: 'column', gap: 4 }}>
                    {cardLinks.slice(0, 3).map((l, i) => (
                      <a key={i} href={l.url} target="_blank" rel="noopener noreferrer"
                        style={{ fontSize: '0.82rem', color: theme.accent }}>{l.label} ↗</a>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      const CANDIDATE_LEAK_FIELDS = ['candidate', 'item_kind', 'class', 'approved_for', 'what_it_does', 'why_for_this_condition', 'mechanism_target', 'repurpose_rationale', 'repurpose_section', 'evidence_strength', 'supporting_evidence', 'references', 'efficacy_hypothesis', 'safety', 'confidence', 'patient_specific_risks', 'how_to_discuss_with_doctor'];
      const ItemKindBadge = ({ kind }) => {
        const isSupp = String(kind || '').toUpperCase() === 'SUPPLEMENT';
        return (
          <span style={{
            display: 'inline-flex', alignItems: 'center',
            padding: '0.2rem 0.55rem', borderRadius: 999, fontSize: '0.68rem',
            fontWeight: 800, letterSpacing: 0.4, textTransform: 'uppercase',
            border: `1px solid ${isSupp ? theme.green + '88' : theme.accent + '88'}`,
            background: isSupp ? `${theme.green}18` : `${theme.accent}18`,
            color: isSupp ? theme.green : theme.accent
          }}>
            {isSupp ? 'Supplement' : 'Medication'}
          </span>
        );
      };
      const CandidateCard = ({ c: rawC, rank, highlightMechanistic, audience = 'layperson', conditionLabel = '' }) => {
        const { card: c, leaks } = useMemo(
          () => auditAndScrubCard(rawC, CANDIDATE_LEAK_FIELDS, { kind: 'repurposing-candidate', label: rawC?.candidate }),
          [rawC]
        );
        const section = resolveRepurposeSection(c);
        const itemKind = resolveItemKind(c);
        const mechanistic = highlightMechanistic || section === 'never-researched' || isMechanisticEvidence(c.evidence_strength);
        const lay = audience !== 'medical';
        const cond = conditionLabel || 'this condition';
        const allLinkText = linkifyMedicalIds(
          [c.references, c.supporting_evidence, c.repurpose_rationale].filter(Boolean).join('\n')
        );
        const cardLinks = useMemo(() => extractLinksFromText(allLinkText), [allLinkText]);
        const whyPlain = c.why_for_this_condition || c.repurpose_rationale;
        return (
          <div style={{
            padding: '1rem 1.1rem',
            background: theme.panel,
            borderRadius: 12,
            border: mechanistic ? `2px dashed ${theme.accent}88` : `1px solid ${theme.border}`,
            position: 'relative',
            overflow: 'hidden'
          }}>
            <div style={{
              position: 'absolute', top: 0, left: 0, right: 0, height: 3,
              background: `linear-gradient(90deg, ${theme.accent}, ${c.confidence_band ? bandColor(c.confidence_band) : ratingColor(c.confidence_pct)})`
            }} />
            <div style={{ display: 'flex', alignItems: 'flex-start', gap: '0.9rem' }}>
              <RankBadge rank={rank} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'baseline', gap: '0.6rem' }}>
                  <div style={{ fontWeight: 800, fontSize: '1.15rem', color: theme.text }}>
                    <InlineTitle text={c.candidate || '(unnamed candidate)'} />
                  </div>
                  <ItemKindBadge kind={itemKind} />
                  {c.class && (
                    <div style={{ fontSize: '0.78rem', color: theme.textDim, fontStyle: 'italic' }}>
                      <InlineMD text={c.class} />
                    </div>
                  )}
                </div>
                <FormatWarning leaks={leaks} />
                {section === 'never-researched' && (
                  <div style={{
                    marginTop: '0.55rem', padding: '0.55rem 0.65rem', borderRadius: 8,
                    border: `1px dashed ${theme.accent}66`, background: `${theme.accent}10`,
                    fontSize: '0.84rem', color: theme.text, lineHeight: 1.5
                  }}>
                    There is no research on this specific {itemKind === 'SUPPLEMENT' ? 'supplement' : 'drug'} for <strong>{cond}</strong>.
                    However, our research suggests it may help, and here is why. Discuss this with your doctor.
                  </div>
                )}
                {section === 'researched-not-approved' && (
                  <div style={{
                    marginTop: '0.55rem', padding: '0.55rem 0.65rem', borderRadius: 8,
                    border: `1px solid ${theme.green}55`, background: `${theme.green}10`,
                    fontSize: '0.84rem', color: theme.text, lineHeight: 1.5
                  }}>
                    This is not FDA-approved for <strong>{cond}</strong>, but research on {cond} shows promise — see the sources on this card. Discuss this with your doctor.
                  </div>
                )}
                {c.what_it_does && lay && (
                  <div style={{
                    marginTop: '0.55rem', padding: '0.65rem 0.75rem', borderRadius: 8,
                    background: `${theme.accent}10`, border: `1px solid ${theme.accent}33`,
                    fontSize: '0.92rem', lineHeight: 1.5, color: theme.text
                  }}>
                    <strong style={{ color: theme.accent, fontSize: '0.72rem', letterSpacing: 0.4, textTransform: 'uppercase' }}>
                      What it is
                    </strong>
                    <div style={{ marginTop: 4 }}><InlineMD text={c.what_it_does} /></div>
                  </div>
                )}
                {whyPlain && (
                  <div style={{
                    marginTop: '0.55rem', padding: '0.65rem 0.75rem', borderRadius: 8,

                    <div style={{ marginTop: 4 }}>
                      {c.why_for_this_condition

                {cardLinks.length > 0 ? (
                  <div style={{
                    marginTop: '0.55rem', padding: '0.55rem 0.65rem', borderRadius: 8,
                    border: `1px solid ${theme.accent}44`, background: `${theme.accent}08`
                  }}>
                    <div style={{ fontSize: '0.72rem', fontWeight: 700, color: theme.accent, textTransform: 'uppercase', letterSpacing: 0.4, marginBottom: 6 }}>
                      {section === 'never-researched'
                        ? 'Source from another condition / how it works ↗'

                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.35rem' }}>
                      {cardLinks.slice(0, 4).map((l, i) => (
