<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="cache-control" content="no-cache">
    <title>researchingmycondition.com</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Markdown renderer: the AI responses use markdown syntax (**bold**,
         tables, headings, links). Without a parser, the raw asterisks and
         pipe characters leak into the UI. marked is tiny (~40KB), fast,
         and has safe-by-default HTML escaping for our trusted-AI-output
         use case. -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <!-- PDF export uses the browser's native print engine ("Save as PDF"),
         not a rasteriser. That keeps every citation link clickable and the
         text selectable/searchable in the exported PDF — the explicit
         requirement from the client. No extra PDF library needed. -->
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      /* --------------------------------------------------------------
         THEME TOKENS.
         Everything that lives in CSS (and isn't driven by inline style
         props from React) is parameterised here. Inline JS styles pick
         up the matching values from the module-level `theme` object.
         The default is DARK; [data-theme="light"] on <body> flips the
         whole stylesheet to the LIGHT palette.

         Identity notes (why we don't look like ChatGPT or IBM Watson):
         - Accent is a cyan-400 in dark mode / cyan-700 in light — it
           reads as "instrument" or "evidence-grade", not ChatGPT-green
           and not generic IBM-blue.
         - Secondary is amber (dark) / burnt-orange (light) — a clinical-
           caution counterpoint that makes the app feel like a medical
           tool, not a chat product.
         - Light mode uses a cool near-white base with ultra-subtle cyan
           wash (NEJM-web vibe), not pure-white ChatGPT sterility.
      -------------------------------------------------------------- */
      :root, body:not([data-theme="light"]) {
        --mrt-bg-body:       radial-gradient(ellipse at top, #0d2030 0%, #061018 55%, #030910 100%);
        --mrt-text:          #eef5fa;
        --mrt-text-dim:      #b8cdd9;
        --mrt-text-bright:   #f5fafd;
        --mrt-accent:        #22d3ee;
        --mrt-accent-soft:   rgba(34, 211, 238, 0.14);
        --mrt-accent-edge:   rgba(34, 211, 238, 0.35);
        --mrt-accent-glow:   rgba(34, 211, 238, 0.22);
        --mrt-secondary:     #f59e0b;
        --mrt-border:        rgba(125, 211, 252, 0.22);
        --mrt-panel-solid:   rgba(16, 38, 56, 0.92);
        --mrt-panel-wash:    rgba(34, 211, 238, 0.045);
        --mrt-row-stripe:    rgba(15, 32, 39, 0.4);
        --mrt-code-bg:       rgba(34, 211, 238, 0.12);
        --mrt-code-text:     #d7ecff;
        --mrt-link:          #67e8f9;
        --mrt-link-hover:    #a5f3fc;
        --mrt-input-bg:      rgba(15, 32, 39, 0.5);
        --mrt-scrollbar-track: rgba(15, 32, 39, 0.5);
        --mrt-placeholder:   rgba(160, 196, 217, 0.5);
        --mrt-md-h-color:    #a5f3fc;
        --mrt-md-h-border:   rgba(34, 211, 238, 0.2);
        --mrt-md-h2-border:  rgba(34, 211, 238, 0.12);
        --mrt-md-body:       #e4edff;
        --mrt-md-strong:     #f2f8ff;
        --mrt-md-em:         #cde2ff;
        --mrt-md-pre-bg:     rgba(9, 20, 30, 0.6);
        --mrt-md-pre-border: rgba(34, 211, 238, 0.15);
        --mrt-md-quote-text: #bcd6f5;
        --mrt-md-quote-bg:   rgba(34, 211, 238, 0.05);
      }
      body[data-theme="light"] {
        --mrt-bg-body:       radial-gradient(ellipse at top, #ffffff 0%, #eaf1f6 100%);
        --mrt-text:          #0f172a;
        --mrt-text-dim:      #475569;
        --mrt-text-bright:   #020617;
        --mrt-accent:        #0e7490;
        --mrt-accent-soft:   rgba(14, 116, 144, 0.09);
        --mrt-accent-edge:   rgba(14, 116, 144, 0.32);
        --mrt-accent-glow:   rgba(14, 116, 144, 0.2);
        --mrt-secondary:     #c2410c;
        --mrt-border:        rgba(15, 23, 42, 0.14);
        --mrt-panel-solid:   #ffffff;
        --mrt-panel-wash:    rgba(14, 116, 144, 0.03);
        --mrt-row-stripe:    rgba(241, 245, 249, 0.8);
        --mrt-code-bg:       rgba(14, 116, 144, 0.08);
        --mrt-code-text:     #0e3a45;
        --mrt-link:          #0e7490;
        --mrt-link-hover:    #155e75;
        --mrt-input-bg:      #ffffff;
        --mrt-scrollbar-track: rgba(15, 23, 42, 0.05);
        --mrt-placeholder:   rgba(15, 23, 42, 0.4);
        --mrt-md-h-color:    #0e3a45;
        --mrt-md-h-border:   rgba(14, 116, 144, 0.25);
        --mrt-md-h2-border:  rgba(14, 116, 144, 0.14);
        --mrt-md-body:       #1e293b;
        --mrt-md-strong:     #020617;
        --mrt-md-em:         #334155;
        --mrt-md-pre-bg:     #f8fafc;
        --mrt-md-pre-border: rgba(14, 116, 144, 0.18);
        --mrt-md-quote-text: #334155;
        --mrt-md-quote-bg:   rgba(14, 116, 144, 0.04);
      }

      /* Base font size bumped from the browser default 16px to 17.5px
         because the primary user is 80+ with glasses and IPF. This
         scales everything rem-based in the app (panel text, buttons,
         labels) up ~10% uniformly, and individual rules below further
         bump the rendered-markdown analysis since that's the main read. */
      html { font-size: 17.5px; }
      body {
        margin: 0;
        color: var(--mrt-text);
        transition: color 0.2s ease;
        /* Leave space at the bottom for the fixed-position sticky
           "NOT MEDICAL ADVICE" disclaimer banner so no content is
           hidden underneath it. The banner is ~78px tall on desktop
           and ~110px on narrow mobile (wraps to 2-3 lines). */
        padding-bottom: 130px;
      }
      @media (min-width: 720px) {
        body { padding-bottom: 88px; }
      }
      * { box-sizing: border-box; }
      input::placeholder, textarea::placeholder { color: var(--mrt-placeholder); }
      input:focus, textarea:focus, select:focus {
        outline: none; border-color: var(--mrt-accent);
        box-shadow: 0 0 0 3px var(--mrt-accent-glow);
      }
      button:not(:disabled):hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px var(--mrt-accent-glow);
      }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .spin { animation: spin 1s linear infinite; }
      @keyframes mrt-shimmer {
        0%   { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      .mrt-shimmer-bar {
        background-size: 200% 100%;
        animation: mrt-shimmer 2.2s linear infinite;
      }
      @keyframes mrt-pulse-dot {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50%      { opacity: 1;    transform: scale(1); }
      }
      .mrt-pulse-dot { animation: mrt-pulse-dot 1.2s ease-in-out infinite; }
      @keyframes mrtLoadPulse {
        0%   { transform: translateX(-35%); opacity: 0.8; }
        50%  { transform: translateX(60%);  opacity: 1; }
        100% { transform: translateX(180%); opacity: 0.8; }
      }
      /* Rendered-markdown container for AI analysis blocks. The AI emits
         headings (## 1. ...), tables, bullets, bold, links. Without these
         styles the browser defaults would look like raw HTML test-page —
         these rules make the output look like a real clinical report. */
      /* Analysis body text sized for a 80+ reader with glasses: ~20px
         at the base root of 17.5px. Generous line-height too, so long
         paragraphs don't crowd. */
      .mrt-markdown { line-height: 1.7; font-size: 1.15rem; color: var(--mrt-md-body); }
      .mrt-markdown h1 { font-size: 1.75rem; color: var(--mrt-md-h-color); border-bottom: 1px solid var(--mrt-md-h-border); padding-bottom: 0.35rem; margin: 1.6rem 0 0.9rem; }
      .mrt-markdown h2 { font-size: 1.45rem; color: var(--mrt-md-h-color); margin: 1.7rem 0 0.7rem; padding-top: 0.6rem; border-top: 1px solid var(--mrt-md-h2-border); }
      .mrt-markdown h2:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
      .mrt-markdown h3 { font-size: 1.2rem; color: var(--mrt-md-h-color); margin: 1.2rem 0 0.5rem; }
      .mrt-markdown h4 { font-size: 1.05rem; color: var(--mrt-md-h-color); margin: 0.9rem 0 0.4rem; text-transform: uppercase; letter-spacing: 0.04em; }
      .mrt-markdown p  { margin: 0 0 0.8rem; }
      .mrt-markdown ul, .mrt-markdown ol { margin: 0.3rem 0 1rem 1.4rem; padding: 0; }
      .mrt-markdown li { margin: 0.3rem 0; }
      .mrt-markdown strong { color: var(--mrt-md-strong); font-weight: 700; }
      .mrt-markdown em { color: var(--mrt-md-em); }
      .mrt-markdown a { color: var(--mrt-link); text-decoration: none; border-bottom: 1px dashed var(--mrt-accent-edge); }
      .mrt-markdown a:hover { color: var(--mrt-link-hover); border-bottom-color: var(--mrt-link-hover); }
      .mrt-markdown code { background: var(--mrt-code-bg); color: var(--mrt-code-text); padding: 0.08em 0.35em; border-radius: 3px; font-size: 0.88em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .mrt-markdown pre { background: var(--mrt-md-pre-bg); border: 1px solid var(--mrt-md-pre-border); padding: 0.75rem 0.9rem; border-radius: 6px; overflow-x: auto; }
      .mrt-markdown pre code { background: transparent; padding: 0; }
      .mrt-markdown blockquote { border-left: 3px solid var(--mrt-accent-edge); margin: 0.5rem 0; padding: 0.1rem 0.9rem; color: var(--mrt-md-quote-text); background: var(--mrt-md-quote-bg); }
      .mrt-markdown table { width: 100%; border-collapse: collapse; margin: 0.8rem 0 1.1rem; font-size: 1rem; }
      .mrt-markdown th, .mrt-markdown td { border: 1px solid var(--mrt-md-h2-border); padding: 0.55rem 0.75rem; text-align: left; vertical-align: top; }
      .mrt-markdown th { background: var(--mrt-accent-soft); color: var(--mrt-md-h-color); font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.03em; }
      .mrt-markdown tr:nth-child(even) td { background: var(--mrt-row-stripe); }
      .mrt-markdown hr { border: 0; border-top: 1px solid var(--mrt-md-h2-border); margin: 1.5rem 0; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: var(--mrt-scrollbar-track); }
      ::-webkit-scrollbar-thumb { background: var(--mrt-accent-edge); border-radius: 5px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--mrt-accent); }
      tbody tr:hover { background: var(--mrt-accent-soft); }
      a { color: var(--mrt-link); }
      a:hover { color: var(--mrt-link-hover); }

      /* A signature visual touch: a 2px cyan→amber gradient strip that
         lives under the header. This is the app's "pulse bar" — it's
         the clearest identity marker separating us from ChatGPT/Claude
         clone aesthetics. Shown on both themes with tuned alpha. */
      .mrt-pulse-bar {
        height: 2px;
        background: linear-gradient(90deg,
          transparent 0%,
          var(--mrt-accent) 20%,
          var(--mrt-accent) 45%,
          var(--mrt-secondary) 55%,
          var(--mrt-secondary) 80%,
          transparent 100%);
        opacity: 0.55;
      }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-presets="env,react">
      const { useState, useRef, useEffect, useMemo } = React;

      /* ==================== Access passcode gate ====================
         Dorothy explicitly required: "no one could stumble upon it and
         use it accidentally at this point." Implementation:

         1. Server side: every /api/* endpoint imports lib/access-gate.js
            and rejects with 401 + code='ACCESS_GATE_BLOCKED' unless the
            caller presents the configured passcode.
         2. Client side: this block patches window.fetch ONCE to inject
            the stored passcode as the x-access-passcode header for all
            /api/* requests, and dispatches a 'mrt:access-denied' event
            when the server rejects so the AccessGate component can
            re-show the entry screen.
         3. When the env var MRT_ACCESS_PASSCODE is unset the server is
            fail-open (so local dev + tests work). In that case the gate
            screen is skipped automatically — see probeAccessGate().
      ============================================================== */
      const MRT_PASSCODE_KEY = 'mrt_access_passcode_v1';
      const MRT_TERMS_KEY = 'mrt_terms_accepted_v1';

      /* Inline Terms of Use (mirrors docs/TERMS_OF_USE.md for the modal). */
      const TERMS_OF_USE_SECTIONS = [
        { title: 'Made to help you learn — not medical advice',
          body: 'This tool gathers facts from medical journals and lists of clinical trials (research studies that test new treatments) to help you learn about your options. It is not medical advice. It does not give you a diagnosis or tell you what to do. It does not take the place of a licensed doctor or other trained health provider.' },
        { title: 'We are not your doctor',
          body: 'Using this site does not make us your doctor or care team. It does not start any kind of health-care relationship between you and the people who run this tool.' },
        { title: 'This tool does not meet HIPAA privacy rules',
          body: 'This is an early version of the tool. It does not follow HIPAA (the U.S. law that protects your health records). Please do not type names, birth dates, medical record numbers, addresses, phone numbers, or anything that could point to a real person. The profile you fill in stays in your browser. The text you send for AI review is shared with outside services.' },
        { title: 'We cannot promise the AI is right',
          body: 'Medical research is hard to read and changes fast. AI summaries can be missing facts, out of date, or wrong. Sometimes the AI even makes up sources — links or papers that do not exist or do not back up what it says. We cannot promise the results are correct, complete, or right for you.' },
        { title: 'Please check the links and facts yourself',
          body: 'It is your job to check every source, link, trial, and fact before you trust it. Open the links (like PubMed and ClinicalTrials.gov) and talk over what you find with your care team.' },
        { title: 'Email alerts are saved on our server',
          body: 'If you sign up for weekly email updates, we save your email address and the condition you care about on our server so we can send them. Do not put names, medical record numbers, or other identifying details in your sign-up.' },
        { title: 'You must be 18 or older',
          body: 'You must be 18 years or older to use this tool. If you are younger, use it only with a parent or guardian who agrees to these terms for you.' },
        { title: 'No promises about the tool',
          body: 'This tool is provided “as is” and “as available,” with no promises of any kind, whether stated or implied. That includes no promise that it is fit to sell, fit for your purpose, or free of conflicts with the rights of others.' },
        { title: 'Limits on who is responsible',
          body: 'As much as the law allows, the people who run researchingmycondition.com and those who help build it are not responsible for any harm or loss that comes from using this tool or trusting what it shows you. This covers direct, indirect, and other kinds of damages.' }
      ];

      const INTEGRITY_FLAGGED_PUBLISHER_EXAMPLES = [
        'OMICS International',
        'Hindawi (mass-retractions 2023–2024)',
        'Scientific Research Publishing (SciRP)',
        'Bentham Open / Bentham Science',
        'MedCrave Group',
        'Scholink',
        'IISTE',
        'Juniper Publishers'
      ];

      const CHAT_SESSION_FOOTNOTE = 'Answers use this session\u2019s context. Feedback does not automatically update our knowledge base.';

      const TermsContext = React.createContext({ openTerms: () => {} });
      const getStoredPasscode = () => {
        try { return localStorage.getItem(MRT_PASSCODE_KEY) || ''; }
        catch { return ''; }
      };
      const setStoredPasscode = (v) => {
        try {
          if (v) localStorage.setItem(MRT_PASSCODE_KEY, v);
          else localStorage.removeItem(MRT_PASSCODE_KEY);
        } catch {}
      };

      const __mrtNativeFetch = window.fetch.bind(window);
      window.fetch = async (input, init = {}) => {
        const url = typeof input === 'string' ? input : (input && input.url) || '';
        const isApi = /^\/api\//.test(url) || /\/api\//.test(url);
        if (isApi) {
          const passcode = getStoredPasscode();
          if (passcode) {
            const headers = new Headers(init.headers || (typeof input !== 'string' && input.headers) || {});
            headers.set('x-access-passcode', passcode);
            init = { ...init, headers };
          }
        }
        const res = await __mrtNativeFetch(input, init);
        if (isApi && res.status === 401) {
          // Clone first so callers can still read the body.
          try {
            const clone = res.clone();
            const body = await clone.json().catch(() => null);
            if (body && body.code === 'ACCESS_GATE_BLOCKED') {
              setStoredPasscode('');
              window.dispatchEvent(new CustomEvent('mrt:access-denied'));
            }
          } catch {}
        }
        return res;
      };

      const isLocalDevHost = () => {
        try {
          return /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
        } catch { return false; }
      };
      const localApiDevHint =
        'Start the API from the project root: npm run dev (or vercel dev). Then open http://localhost:3000 — do not open index.html as a file. See README.';
      if (typeof location !== 'undefined' && location.protocol === 'file:') {
        console.warn('[MRT] Opened as file:// — /api/* will not work. ' + localApiDevHint);
      }

      // Shared non-JSON / edge-error parser for all /api/research callers.
      const parseApiJsonResponse = (res, raw, { timeoutMsg } = {}) => {
        let data;
        try { data = JSON.parse(raw); }
        catch {
          if (isLocalDevHost() && (res.status === 501 || res.status === 404)) {
            throw new Error(localApiDevHint);
          }
          if (res.status === 501) {
            throw new Error('Server unavailable — deployment may still be building. Try again in 1 minute or contact admin.');
          }
          const isTimeout = /FUNCTION_INVOCATION_TIMEOUT|An error occurred with your deployment|504|Gateway Time-out/i.test(raw);
          throw new Error(
            isTimeout
              ? (timeoutMsg || 'Server timeout. Try again in a moment.')
              : `Server returned non-JSON (HTTP ${res.status}): ${raw.slice(0, 140)}`
          );
        }
        return data;
      };

      /* ==================== Inline icon components ==================== */
      const mkIcon = (paths) => ({ size = 20, color = 'currentColor', ...rest }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
             strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...rest}>
          {paths}
        </svg>
      );
      const Activity = mkIcon(<polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />);
      const Brain = mkIcon(<>
        <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z" />
        <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z" />
      </>);
      const FileText = mkIcon(<>
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
        <line x1="16" y1="13" x2="8" y2="13" />
        <line x1="16" y1="17" x2="8" y2="17" />
      </>);
      const Search = mkIcon(<>
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.35-4.35" />
      </>);
      const TrendingUp = mkIcon(<>
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
        <polyline points="17 6 23 6 23 12" />
      </>);
      const AlertCircle = mkIcon(<>
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </>);
      const Mail = mkIcon(<>
        <rect x="2" y="4" width="20" height="16" rx="2" />
        <path d="m22 7-10 6L2 7" />
      </>);
      const Beaker = mkIcon(<>
        <path d="M4.5 3h15" />
        <path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3" />
        <path d="M6 14h12" />
      </>);
      const Sparkles = mkIcon(<>
        <path d="M12 3l1.9 4.6L18.5 9l-4.6 1.4L12 15l-1.9-4.6L5.5 9l4.6-1.4L12 3z" />
        <path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z" />
      </>);
      const ShieldCheck = mkIcon(<>
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        <path d="m9 12 2 2 4-4" />
      </>);
      const Book = mkIcon(<>
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z" />
        <path d="M4 19.5v0A2.5 2.5 0 0 0 6.5 22H20v-5" />
      </>);
      const Loader = mkIcon(<>
        <line x1="12" y1="2" x2="12" y2="6" />
        <line x1="12" y1="18" x2="12" y2="22" />
        <line x1="4.93" y1="4.93" x2="7.76" y2="7.76" />
        <line x1="16.24" y1="16.24" x2="19.07" y2="19.07" />
        <line x1="2" y1="12" x2="6" y2="12" />
        <line x1="18" y1="12" x2="22" y2="12" />
        <line x1="4.93" y1="19.07" x2="7.76" y2="16.24" />
        <line x1="16.24" y1="7.76" x2="19.07" y2="4.93" />
      </>);
      const Database = mkIcon(<>
        <ellipse cx="12" cy="5" rx="9" ry="3" />
        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
      </>);
      const Download = mkIcon(<>
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      </>);
      const Info = mkIcon(<>
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="16" x2="12" y2="12" />
        <line x1="12" y1="8" x2="12.01" y2="8" />
      </>);
      const Languages = mkIcon(<>
        <path d="M5 8h6" />
