        const ipfQuickPrompts = [
          `Pirfenidone vs nintedanib — given my patient profile, which antifibrotic has a better risk-benefit tradeoff and why?`,
          `Was prednisone + azathioprine + NAC triple therapy ever shown to help IPF? What does PANTHER-IPF say?`,
          `Is there any evidence for vitamin D, N-acetylcysteine monotherapy, or other supplements in IPF?`,
          `How aggressive should I be about treating GERD given the IPF micro-aspiration hypothesis?`,
          `When is lung transplant evaluation typically initiated? What are the absolute contraindications?`,
          `What pulmonary rehab / exercise training is evidence-based for IPF?`,
          `Are there any drug combinations being trialed on top of standard antifibrotics? What phase?`,

        return (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>

              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '1rem', flexWrap: 'wrap' }}>

                <button style={btn('primary', !!busy)} disabled={!!busy}

            </div>

            <DeepResearchProgress progress={progress} />

            {/* Methodology-transparency strip. Surfaces the two guardrails

                    query twice genuinely re-runs Claude)
                (2) the pipeline-drug coverage-audit result from the
                    curated KB, including whether Claude initially missed

              <div style={{
                ...panelStyle,
                padding: '0.75rem 0.9rem',
                display: 'flex', flexWrap: 'wrap', gap: '0.5rem', alignItems: 'center',

              }}>
                <span style={{ color: theme.textDim, fontSize: '0.72rem', fontWeight: 700, letterSpacing: '0.05em', textTransform: 'uppercase' }}>
                  Methodology
                </span>
                {dossier?.cacheDisabled && (
                  <span
                    title="The persistent dossier cache is disabled during the beta integrity phase. Every research run queries Claude fresh so we can stress-test the methodology — run the same query twice to see whether the answer is stable."

                      padding: '0.2rem 0.55rem', borderRadius: 999, fontSize: '0.72rem',
                      background: `${theme.secondary}22`,
                      color: theme.secondary, fontWeight: 600,
                      border: `1px solid ${theme.secondary}55`

                {coverageAudit && coverageAudit.pipelineDrugsAudited > 0 && (
                  <span
                    title={`Coverage audit: the curated KB lists ${coverageAudit.pipelineDrugsTotal || coverageAudit.pipelineDrugsAudited} pipeline drugs for this condition. After synthesis, the output was scanned for every listed drug name. ${coverageAudit.reprompted ? 'The first draft missed ' + (coverageAudit.initialMissed || []).join(', ') + ' — Claude was re-prompted to include them.' : 'All audited drugs were mentioned on the first pass.'}${coverageAudit.finalMissed?.length ? ' NOTE: ' + coverageAudit.finalMissed.join(', ') + ' remain missing even after the forced rewrite — likely the evidence pack did not ground them for this patient profile.' : ''}`}
                    style={{
                      padding: '0.2rem 0.55rem', borderRadius: 999, fontSize: '0.72rem',
                      background: (coverageAudit.finalMissed?.length ? `${theme.red}22` : `${theme.green}22`),
                      color: (coverageAudit.finalMissed?.length ? theme.red : theme.green),
                      fontWeight: 600,
                      border: `1px solid ${(coverageAudit.finalMissed?.length ? theme.red : theme.green)}55`,
                      cursor: 'help'
                    }}
                  >
                    coverage audit · {coverageAudit.finalMissed?.length
                      ? `${coverageAudit.finalMissed.length} still missing`
                      : (coverageAudit.reprompted ? 'PASS after re-prompt' : 'PASS')}
                    {` (${coverageAudit.pipelineDrugsAudited} audited)`}
                  </span>

                {coverageAudit?.reprompted && (
                  <span
                    title={`Claude's first draft omitted: ${(coverageAudit.initialMissed || []).join(', ')}. A forced re-prompt was fired with these names explicitly called out. This is the anti-"AI slop" safety net.`}

                      padding: '0.2rem 0.55rem', borderRadius: 999, fontSize: '0.72rem',
                      background: `${theme.accent}22`, color: theme.accent, fontWeight: 600,

            {/* The AI analysis is the primary output. Previously this

                      </div>
                      <div style={{ color: theme.text, fontSize: '0.8rem', fontWeight: 600 }}>
                        {card.label}
                      </div>
                      <div style={{ color: theme.textDim, fontSize: '0.72rem', marginTop: 2 }}>
                        {card.sub}
                      </div>
                    </div>

                </div>

                {/* Per-source breakdown — where the records actually came from. */}

                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem', marginTop: '0.75rem' }}>

                          padding: '0.2rem 0.6rem', borderRadius: 999, fontSize: '0.75rem',

                        </span>
                      ))}
                  </div>

                {evidenceSummary.promptPackBreakdown && (
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem', marginTop: '0.5rem', alignItems: 'center' }}>

                      padding: '0.2rem 0.6rem', borderRadius: 999, fontSize: '0.75rem',

                    <span style={{
                      padding: '0.2rem 0.6rem', borderRadius: 999, fontSize: '0.75rem',

                    <AccessBadge level="abstract"    n={evidenceSummary.accessBreakdown['abstract']} />

                {/* Corpus footprint — the "we search the world, not just

                    <ul style={{
                      margin: '0.5rem 0 0 0', paddingLeft: '1.2rem',
                      color: theme.text, fontSize: '0.85rem', lineHeight: 1.6
                    }}>
                      {evidenceSummary.corpusFootprint.databases.map((d, i) => (
                        <li key={i}>
                          <strong style={{ color: theme.accent }}>{d.name}</strong> — {d.journals}

                      ))}
                    </ul>
                    <p style={{ color: theme.textDim, fontSize: '0.8rem', marginTop: '0.5rem', marginBottom: 0 }}>
                      {evidenceSummary.corpusFootprint.universityFilter}
                    </p>
                  </details>
                )}

                <p style={{ color: theme.textDim, fontSize: '0.85rem', marginTop: '0.75rem', marginBottom: 0 }}>
                  Every citation is tagged <strong>[FULL-TEXT]</strong>,
                  <strong> [ABSTRACT-ONLY]</strong>, or <strong>[METADATA-ONLY]</strong> so the AI
                  cannot overreach past what it actually read. The curated knowledge base is the
                  pinned ground-truth floor; live-fetched items supplement it with the newest
                  research.
                </p>
              </div>
            )}

            <div style={panelStyle}>
              <h3 style={{ marginTop: 0, color: theme.accent, fontSize: '1rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <Database size={18} /> Follow-up chat (uses patient profile + audience)
              </h3>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem', marginBottom: '0.75rem' }}>
                {quickPrompts.map((p, i) => (
                  <button key={i} style={btn('ghost')} onClick={() => setUserQuery(p)}>
                    {p.length > 70 ? p.slice(0, 67) + '…' : p}
                  </button>
                ))}
              </div>
              <div style={{ maxHeight: 360, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '0.5rem', marginBottom: '0.75rem' }}>
                {chatHistory.map((m, i) => (
                  <div key={i} style={{
                    padding: '0.75rem', borderRadius: 8, maxWidth: '85%',
                    alignSelf: m.role === 'user' ? 'flex-end' : 'flex-start',
                    background: m.role === 'user' ? theme.accentSoft : theme.panel,
                    border: `1px solid ${m.role === 'user' ? theme.accentEdge : theme.border}`
                  }}>
                    <div style={{ fontSize: '0.75rem', color: theme.accent, fontWeight: 600, marginBottom: 4 }}>
                      {m.role === 'user' ? 'You' : 'Assistant'}
                    </div>
                    {m.role === 'user'
                      ? <div style={{ whiteSpace: 'pre-wrap', fontSize: '0.9rem', lineHeight: 1.55 }}>{m.content}</div>
                      : <Markdown text={m.content} />}

                ))}
                {busy === 'chat' && (
                  <div style={{
                    padding: '0.75rem', borderRadius: 8, maxWidth: '85%', alignSelf: 'flex-start',
                    background: theme.panel, border: `1px solid ${theme.border}`,
                    display: 'flex', alignItems: 'center', gap: '0.5rem', color: theme.textDim, fontSize: '0.85rem'
                  }}>
                    <Loader size={14} className="spin" />
                    <span>Researching… pulling trials + evidence pack + building dossier…</span>
                  </div>

              <div style={{ display: 'flex', gap: '0.5rem' }}>
                <input value={userQuery} onChange={e => setUserQuery(e.target.value)}
                  placeholder={patient.condition ? `Ask about ${patient.condition}… or type a new disease to switch.` : "Type a disease to research (e.g. 'RP', 'LADA', 'Retinitis Pigmentosa') or ask a question."}
                  onKeyDown={e => { if (e.key === 'Enter' && !busy && userQuery.trim()) { e.preventDefault(); sendChat(); } }}
                  style={{ ...inputStyle, flex: 1 }} autoFocus />
                <button style={btn('primary', !!busy || !userQuery.trim())}

                </button>
              </div>
            </div>
          </div>
        );
      };

      /* ==================== Clinical Trials Tab ==================== */
      const TrialsTab = ({ patient, busy, trialsData, trialBlocks, trialsText, validation,
                           runTrialsFetch, runTrialsAnalysis, onAudit }) => {
        const [filters, setFilters] = useState({ recruitingOnly: true, treatmentOnly: true, excludePlacebo: false });
        return (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>

                <Beaker size={22} /> Clinical Trials (live ClinicalTrials.gov)

              <p style={{ color: theme.textDim, fontSize: '0.9rem' }}>

      const RankedTrialsForPatient = ({ blocks }) => (

            {blocks.map((b, i) => (

                padding: '0.9rem', background: theme.panel,

                {b.interactions && (
                  <div style={{ fontSize: '0.8rem', marginTop: '0.4rem', color: theme.yellow }}>
                    ⚠ Interactions: {b.interactions}
                  </div>
                )}
                {b.url && (
                  <div style={{ marginTop: '0.5rem' }}>
                    <a href={b.url.trim()} target="_blank" rel="noopener" style={{ fontSize: '0.85rem' }}>
                      Open on ClinicalTrials.gov ↗
                    </a>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );

      /* ==================== Drug Repurposing Tab (EveryCure-style) ==================== */
      // Expandable disclosure for a titled section on the candidate card.
      const Disclosure = ({ title, icon, color, children, defaultOpen = false }) => {
        const [open, setOpen] = useState(defaultOpen);
        const accent = color || theme.accent;
        return (
          <div style={{
            marginTop: '0.5rem',
            borderRadius: 8,
            border: `1px solid ${accent}33`,
            background: `${accent}08`,
            overflow: 'hidden'
          }}>
            <button onClick={() => setOpen(v => !v)} style={{
              width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              background: 'transparent', border: 'none', cursor: 'pointer',
              padding: '0.55rem 0.8rem',
              color: accent, fontSize: '0.82rem', fontWeight: 700, letterSpacing: 0.3
            }}>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: '0.4rem' }}>
                {icon}{title}
              </span>
              {open ? <ChevronUp size={14} /> : <ChevronDown size={14} />}
            </button>
            {open && (
              <div style={{
                padding: '0 0.8rem 0.8rem',
                fontSize: '0.88rem', lineHeight: 1.6, color: theme.text,
                whiteSpace: 'pre-wrap'
              }}>
                {children}
              </div>
            )}
          </div>
        );
      };

      const RankBadge = ({ rank }) => (
        <div style={{
          width: 40, height: 40, borderRadius: 10,
          background: `linear-gradient(135deg, ${theme.accent}aa, ${theme.accent}55)`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontWeight: 800, fontSize: '1.1rem', color: '#ffffff',
          boxShadow: `0 2px 10px ${theme.accent}33`,
          fontVariantNumeric: 'tabular-nums'
        }}>
          #{rank}
        </div>
      );

      // Individual repurposing-candidate card. One per drug/supplement.
      const CandidateCard = ({ c, rank }) => {
        return (
          <div style={{
            padding: '1rem 1.1rem',
            background: theme.panel,
            borderRadius: 12,
            border: `1px solid ${theme.border}`,
            position: 'relative',
            overflow: 'hidden'
          }}>
            <div style={{
              position: 'absolute', top: 0, left: 0, right: 0, height: 3,
              background: `linear-gradient(90deg, ${theme.accent}, ${ratingColor(c.confidence_pct)})`
            }} />
            <div style={{ display: 'flex', alignItems: 'flex-start', gap: '0.9rem' }}>
              <RankBadge rank={rank} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'baseline', gap: '0.6rem' }}>
                  <div style={{ fontWeight: 800, fontSize: '1.15rem', color: theme.text }}>
                    {c.candidate || '(unnamed candidate)'}
                  </div>
                  {c.class && (
                    <div style={{ fontSize: '0.78rem', color: theme.textDim, fontStyle: 'italic' }}>
                      {c.class}
                    </div>
                  )}
                </div>
                {c.approved_for && (
                  <div style={{ fontSize: '0.78rem', color: theme.textDim, marginTop: 2 }}>
                    Currently approved for: <span style={{ color: theme.text }}>{c.approved_for}</span>
                  </div>
                )}
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem', marginTop: '0.55rem' }}>
                  {c.evidence_strength && <EvidenceStrengthBadge value={c.evidence_strength} />}
                  {c.mechanism_target && (
                    <span title="Molecular target / pathway" style={{
                      display: 'inline-flex', alignItems: 'center', gap: '0.3rem',
                      padding: '0.25rem 0.65rem', borderRadius: 999, fontSize: '0.72rem',
                      border: `1px solid ${theme.accent}55`, background: `${theme.accent}12`,
                      color: theme.accent, fontWeight: 600
                    }}>
                      <Flask size={11} /> {String(c.mechanism_target).length > 80
                        ? String(c.mechanism_target).slice(0, 77) + '…'
                        : c.mechanism_target}
                    </span>
                  )}
                </div>
              </div>
            </div>

            <div style={{ marginTop: '0.9rem', display: 'grid', gap: '0.5rem' }}>
              <MeterBar label="Efficacy"   value={c.efficacy_hypothesis_pct} icon={<TrendingUp size={11} />} />
              <MeterBar label="Safety"     value={c.safety_pct}              icon={<Shield size={11} />} />
              <MeterBar label="Confidence" value={c.confidence_pct}          icon={<Award size={11} />} />
            </div>

            {c.repurpose_rationale && (
              <Disclosure
                title="Why it might help"
                icon={<Lightbulb size={13} />}
                color={theme.accent}
                defaultOpen={true}
              >
                {c.repurpose_rationale}
              </Disclosure>
            )}
            {c.supporting_evidence && (
              <Disclosure
                title="Supporting evidence"
                icon={<Database size={13} />}
                color={theme.green}
              >
                {c.supporting_evidence}
              </Disclosure>
            )}
            {c.patient_specific_risks && (
              <Disclosure
                title="Risks for this patient specifically"
                icon={<AlertTriangle size={13} />}
                color={theme.yellow}
                defaultOpen={true}
              >
                {c.patient_specific_risks}
              </Disclosure>
            )}
            {c.how_to_discuss_with_doctor && (
              <Disclosure
                title="Questions to ask your doctor"
                icon={<MessageCircle size={13} />}
                color={theme.green}
              >
                {c.how_to_discuss_with_doctor}
              </Disclosure>
            )}
          </div>
        );
      };

      // EveryCure-style hero for the Repurposing tab. Big CTA, feature tiles,
      // honest disclaimer, no clinical claim — this is hypothesis generation.
      const RepurposeHero = ({ patient, busy, runResearch }) => {
        const cond = patient?.condition?.trim() || 'this condition';
        return (
          <div style={{
            ...panelStyle,
            padding: '1.5rem',
            background: `linear-gradient(135deg, ${theme.accentSoft} 0%, ${theme.panel} 60%)`,
            borderColor: theme.accentEdge
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.5rem' }}>
              <Sparkles size={18} color={theme.accent} />
              <span style={{
                fontSize: '0.72rem', fontWeight: 700, letterSpacing: 1.5,
                color: theme.accent, textTransform: 'uppercase'
              }}>
                Drug Repurposing · mechanistic-reasoning approach
              </span>
            </div>
            <h2 style={{ margin: '0 0 0.5rem', fontSize: '1.5rem', lineHeight: 1.25, color: theme.text }}>
              Existing drugs that <em style={{ color: theme.accent, fontStyle: 'normal' }}>might</em> already treat {cond}
            </h2>
            <p style={{ margin: '0 0 1rem', color: theme.textDim, fontSize: '0.92rem', lineHeight: 1.55, maxWidth: 780 }}>
              The AI reasons like a senior medical-school professor guiding students through a
              seminar: given the pathophysiology of {cond} and the known mechanisms of every
              FDA-approved drug, which ones share a molecular pathway that <em>logically</em>
              suggests they could help — even when no formal guideline endorses that use yet?
              Each candidate reports mechanism, evidence strength on a 6-step ladder
              (mechanistic hypothesis → large RCT), safety, confidence, and any interaction with
              the medications in your patient profile.
            </p>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.6rem', marginBottom: '1.1rem' }}>
              {[
                { icon: <Brain size={13} />,    label: 'First-principles mechanistic reasoning' },
                { icon: <Database size={13} />, label: 'Evidence ladder per candidate' },
                { icon: <Shield size={13} />,   label: 'Your-medications interaction check' },
                { icon: <MessageCircle size={13} />, label: 'Physician-conversation script' }
              ].map((f, i) => (
                <span key={i} style={{
                  display: 'inline-flex', alignItems: 'center', gap: '0.35rem',
                  padding: '0.3rem 0.7rem', borderRadius: 999,
                  background: theme.panel, border: `1px solid ${theme.border}`,
                  color: theme.textDim, fontSize: '0.76rem', fontWeight: 600
                }}>
                  <span style={{ color: theme.accent }}>{f.icon}</span>{f.label}
                </span>
              ))}
            </div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.75rem', alignItems: 'center' }}>
              <button style={{ ...btn('primary', !!busy), padding: '0.75rem 1.2rem', fontSize: '0.95rem' }}
                disabled={!!busy}
                onClick={() => runResearch('repurpose')}>
                {busy === 'repurpose'
                  ? <><Loader size={16} className="spin" /> Reasoning across the drug library…</>
                  : <><Sparkles size={16} /> Generate candidates for {cond}</>}
              </button>
              <span style={{ fontSize: '0.78rem', color: theme.yellow, display: 'inline-flex', alignItems: 'center', gap: '0.3rem' }}>
                <AlertTriangle size={13} /> Hypothesis generation only. Not a prescription.
              </span>
            </div>
          </div>
        );
      };

      const RepurposeTab = ({ patient, busy, runResearch, repurposeText, candidates, validation, progress, onAudit }) => {
        const [showRaw, setShowRaw] = useState(false);
        const byStrength = {
          LARGE_RCT:        candidates.filter(c => evidenceMeta(c.evidence_strength).rank === 6).length,
          SMALL_RCT:        candidates.filter(c => evidenceMeta(c.evidence_strength).rank === 5).length,
          OBSERVATIONAL:    candidates.filter(c => evidenceMeta(c.evidence_strength).rank === 4).length,
          CASE_REPORT:      candidates.filter(c => evidenceMeta(c.evidence_strength).rank === 3).length,
          PRECLINICAL:      candidates.filter(c => evidenceMeta(c.evidence_strength).rank === 2).length,
          MECHANISTIC_ONLY: candidates.filter(c => evidenceMeta(c.evidence_strength).rank === 1).length
        };
        return (
          <div id="mrt-repurpose-export-target" style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
            <RepurposeHero patient={patient} busy={busy} runResearch={runResearch} />

            <RepurposeExplainer />

            <DeepResearchProgress progress={progress} />

            <ValidatorPanel validation={validation} onAudit={onAudit} canAudit={!!repurposeText} />

            {candidates.length > 0 && (
              <>
                <div style={panelStyle}>
                  <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'baseline', gap: '0.5rem' }}>
                    <h3 style={{ margin: 0, color: theme.accent, fontSize: '1.05rem' }}>
                      {candidates.length} candidate{candidates.length === 1 ? '' : 's'}
                      <span style={{ color: theme.textDim, fontWeight: 500, fontSize: '0.85rem', marginLeft: '0.5rem' }}>
                        · ranked by overall confidence
                      </span>
                    </h3>
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem', marginTop: '0.5rem' }}>
                    {EVIDENCE_LADDER.slice().reverse().map(l => byStrength[l.key] ? (
                      <span key={l.key} title={l.label} style={{
                        padding: '0.25rem 0.6rem', borderRadius: 999, fontSize: '0.7rem',
                        border: `1px solid ${l.color}66`, background: `${l.color}18`,
                        color: l.color, fontWeight: 700
                      }}>
                        {byStrength[l.key]} × {l.label}
                      </span>
                    ) : null)}
                  </div>
                </div>

                <div style={{ display: 'grid', gap: '0.85rem' }}>
                  {candidates.map((c, i) => <CandidateCard key={i} c={c} rank={i + 1} />)}
                </div>
              </>
            )}

            {repurposeText && (
              <div style={panelStyle}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '0.5rem', flexWrap: 'wrap' }}>
                  <h3 style={{ margin: 0, color: theme.accent, fontSize: '1rem' }}>Full reasoning narrative</h3>
                  <div style={{ display: 'flex', gap: '0.4rem', flexWrap: 'wrap' }}>
                    <button onClick={() => setShowRaw(v => !v)} style={{
                      background: 'transparent', border: `1px solid ${theme.border}`,
                      color: theme.textDim, padding: '0.3rem 0.7rem', borderRadius: 6,
                      fontSize: '0.75rem', cursor: 'pointer'
                    }}>
                      {showRaw ? 'Hide' : 'Show'} raw
                    </button>
                    <PdfExportButton
                      getElement={() => document.getElementById('mrt-repurpose-export-target')}
                      filename={`repurpose-${(patient.condition || 'analysis').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}.pdf`}
                      label="Download PDF (candidates + narrative)"
                    />
                  </div>
                </div>
                {showRaw && (
                  <div style={{ marginTop: '0.6rem' }}>
                    <Markdown text={repurposeText} />
                  </div>
                )}
              </div>
            )}
          </div>
        );
      };

      /* ==================== Records Audit Tab ==================== */
      const RecordsTab = ({ patient, audience, busy, setBusy, recordsResult, setRecordsResult }) => {
        const [records, setRecords] = useState('');
        const [summary, setSummary] = useState('');

        const runAudit = async () => {
          if (!records.trim()) { alert('Paste the raw medical records first.'); return; }
          setBusy('records');
          try {
            const res = await fetch('/api/records-audit', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                records, summary, condition: patient.condition || '', audience
              })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Audit failed');
            setRecordsResult(data);
          } catch (e) {
            alert('Error: ' + e.message);
          } finally {
            setBusy(null);
          }
        };

        return (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
            <div style={panelStyle}>
              <h2 style={{ margin: 0, color: theme.accent, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <ShieldCheck size={22} /> Medical Records Audit
              </h2>
              <p style={{ color: theme.textDim, fontSize: '0.9rem' }}>
                Paste raw medical records (imaging reports, labs, office notes). Optionally paste a
                summary or report (IME, doctor's letter). The auditor extracts every abnormal finding,
                then flags anything <strong>omitted, downplayed, exaggerated, or unsupported</strong> in the summary.
              </p>
              <p style={{ color: '#f87171', fontSize: '0.85rem' }}>
                ⚠ De-identify before pasting: remove name, DOB, MRN, address, phone, photos, face sheets.
              </p>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                <div>
                  <label style={labelStyle}>Raw medical records (required)</label>
                  <textarea value={records} onChange={e => setRecords(e.target.value)}
                    placeholder="Paste de-identified imaging reports, labs, consult notes, hospital records…"
                    style={{ ...inputStyle, minHeight: 280, resize: 'vertical', fontFamily: 'monospace', fontSize: '0.85rem' }} />
                </div>
                <div>
                  <label style={labelStyle}>Summary / report to check (optional)</label>
                  <textarea value={summary} onChange={e => setSummary(e.target.value)}
                    placeholder="Paste the summary letter, IME report, or discharge summary that you want checked for misrepresentation or omission."
                    style={{ ...inputStyle, minHeight: 280, resize: 'vertical', fontFamily: 'monospace', fontSize: '0.85rem' }} />
                </div>
              </div>
              <div style={{ marginTop: '0.75rem' }}>
                <button style={btn('primary', !!busy || !records.trim())}
                  disabled={!!busy || !records.trim()} onClick={runAudit}>
                  {busy === 'records' ? <><Loader size={16} className="spin" /> Auditing…</>
                    : <><ShieldCheck size={16} /> Run Audit</>}
                </button>
              </div>
            </div>

            {recordsResult?.audit && <AuditResult audit={recordsResult.audit} />}
            {recordsResult && !recordsResult.audit && recordsResult.raw && (
              <div style={panelStyle}>
                <h3 style={{ marginTop: 0, color: theme.yellow }}>Could not parse structured audit</h3>
                <Markdown text={recordsResult.raw} />
              </div>
            )}
          </div>
        );
      };

      const AuditResult = ({ audit }) => {
        const findings = audit.abnormalFindings || [];
        const color = (acc) => acc === 'accurate' ? theme.green
          : acc === 'omitted' || acc === 'contradicted' ? theme.red
          : acc === 'downplayed' || acc === 'exaggerated' ? theme.yellow
          : theme.textDim;
        return (
          <div style={panelStyle}>
            <h3 style={{ marginTop: 0, color: theme.accent }}>Audit result</h3>
            <p style={{ fontSize: '0.95rem', lineHeight: 1.6 }}>{audit.overallAssessment}</p>
            <div style={{ fontSize: '0.85rem', color: theme.textDim, marginBottom: '1rem' }}>
              Confidence: <strong style={{ color: theme.text }}>{audit.confidence}</strong>
              {audit.limitations ? <> · Limitations: {audit.limitations}</> : null}
            </div>
            <h4 style={{ color: theme.accent, fontSize: '0.95rem' }}>Findings ({findings.length})</h4>
            <div style={{ display: 'grid', gap: '0.5rem' }}>
              {findings.map((f, i) => (
                <div key={i} style={{
                  padding: '0.75rem', background: theme.panel,
                  borderRadius: 8, borderLeft: `4px solid ${color(f.summaryAccuracy)}`
                }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', gap: '0.5rem', flexWrap: 'wrap' }}>
                    <div style={{ fontWeight: 600 }}>{f.finding}</div>
                    <div style={{ fontSize: '0.8rem', color: color(f.summaryAccuracy), textTransform: 'uppercase', fontWeight: 600 }}>
                      {f.summaryAccuracy}
                    </div>
                  </div>
                  <div style={{ fontSize: '0.8rem', color: theme.textDim, marginTop: 4 }}>
                    From {f.source} · severity: {f.severity} · relevant: {f.relevantToCondition ? 'yes' : 'no'}
                  </div>
                  <div style={{ fontSize: '0.85rem', fontStyle: 'italic', marginTop: '0.4rem', color: theme.text }}>
                    “{f.quote}”
                  </div>
                  {f.summaryQuote && (
                    <div style={{ fontSize: '0.8rem', marginTop: '0.3rem', color: theme.textDim }}>
                      Summary says: “{f.summaryQuote}”
                    </div>
                  )}
                  {f.auditorNote && (
                    <div style={{ fontSize: '0.85rem', marginTop: '0.4rem' }}>
                      {f.auditorNote}
                    </div>
                  )}
                </div>
              ))}
            </div>
            {audit.unsupportedSummaryStatements?.length > 0 && (
              <>
                <h4 style={{ color: '#f87171', marginTop: '1rem' }}>Unsupported statements in the summary</h4>
                {audit.unsupportedSummaryStatements.map((s, i) => (
                  <div key={i} style={{ padding: '0.5rem 0.75rem', borderLeft: '3px solid #f87171', marginBottom: '0.5rem' }}>
                    <div style={{ fontStyle: 'italic' }}>“{s.statement}”</div>
                    <div style={{ fontSize: '0.8rem', color: theme.textDim }}>{s.issue}</div>
                  </div>
                ))}
              </>
            )}
          </div>
        );
      };

      /* ==================== Comparison Chart Tab ==================== */
      const ChartTab = ({ treatments, candidates }) => {
        const exportCsv = () => {
          const rows = [
            ['Provider','Treatment','FDA Status','Length/Frequency','Efficacy %','Safety %','Risks','Interactions','Cost']
          ];
          treatments.forEach(t => rows.push([
            t.provider||'', t.treatment||'', t.fda_status||'', t.length_frequency||'',
            t.efficacy_pct||'', t.safety_pct||'', t.risks||'', t.interactions||'', t.cost||''
          ]));
          const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
          const blob = new Blob([csv], { type: 'text/csv' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'treatment-comparison.csv';
          a.click();
        };
        return (
          <div style={panelStyle}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.5rem' }}>
              <h2 style={{ margin: 0, color: theme.accent, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <TrendingUp size={22} /> Treatment Comparison · best at top
              </h2>
              <button style={btn('ghost', treatments.length === 0)} disabled={treatments.length === 0} onClick={exportCsv}>
                <Download size={16} /> Export CSV
              </button>
            </div>
            <p style={{ color: theme.textDim, fontSize: '0.85rem' }}>
              Efficacy and Safety are both rated 1–100 (higher is better on both). Ranked by efficacy.
            </p>
            {treatments.length === 0 && candidates.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '2rem', color: theme.textDim }}>
                No data yet. Run <strong>AI Research</strong> or <strong>Drug Repurposing</strong> first.
              </div>
            ) : (
              <>
                {treatments.length > 0 && <ComparisonTable rows={treatments} variant="treatment" />}
                {candidates.length > 0 && (
                  <>
                    <h3 style={{ color: theme.accent, marginTop: '1.25rem', fontSize: '1rem' }}>
                      Repurposing candidates (hypothesis)
                    </h3>
                    <ComparisonTable rows={candidates} variant="candidate" />
                  </>
                )}
              </>
            )}
          </div>
        );
      };

      const ComparisonTable = ({ rows, variant }) => {
        const cols = variant === 'treatment'
          ? [
              { k: 'provider',          h: 'Provider / Clinic',   w: 180 },
              { k: 'treatment',         h: 'Treatment description', w: 260 },
              { k: 'fda_status',        h: 'FDA status',          w: 120 },
              { k: 'length_frequency',  h: 'Length / Freq',       w: 140 },
              { k: 'efficacy_pct',      h: 'Efficacy',            w: 110, bar: true },
              { k: 'safety_pct',        h: 'Safety',              w: 110, bar: true },
              { k: 'risks',             h: 'Risks',               w: 220 },
              { k: 'interactions',      h: 'Interactions',        w: 180 },
              { k: 'cost',              h: 'Cost / Insurance',    w: 140 }
            ]
          : [
              { k: 'candidate',                 h: 'Candidate',       w: 160 },
              { k: 'class',                     h: 'Class',           w: 140 },
              { k: 'approved_for',              h: 'Approved for',    w: 180 },
              { k: 'repurpose_rationale',       h: 'Why it might help', w: 280 },
              { k: 'efficacy_hypothesis_pct',   h: 'Hypothesized efficacy', w: 110, bar: true },
              { k: 'safety_pct',                h: 'Safety',          w: 110, bar: true },
              { k: 'patient_specific_risks',    h: 'Your-specific risks', w: 220 }
            ];
        return (
          <div style={{ overflowX: 'auto', marginTop: '0.75rem' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '0.82rem' }}>
              <thead>
                <tr style={{ background: theme.accentSoft, borderBottom: `2px solid ${theme.accent}` }}>
                  {cols.map(c => (
                    <th key={c.k} style={{ padding: '0.6rem', textAlign: c.bar ? 'center' : 'left',
                      color: theme.accent, fontWeight: 700, minWidth: c.w }}>{c.h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.map((r, i) => (
                  <tr key={i} style={{ borderBottom: `1px solid ${theme.border}`, verticalAlign: 'top' }}>
                    {cols.map(c => {
                      const v = r[c.k];
                      if (c.bar) {
                        const n = typeof v === 'number' ? v : null;
                        const col = ratingColor(n);
                        return (
                          <td key={c.k} style={{ padding: '0.6rem', textAlign: 'center' }}>
                            <div style={{ color: col, fontWeight: 700 }}>{n != null ? n + '%' : '—'}</div>
                            {n != null && (
                              <div style={{ width: 70, height: 5, background: theme.panel,
                                border: `1px solid ${theme.border}`,
                                borderRadius: 3, margin: '4px auto 0', overflow: 'hidden' }}>
                                <div style={{ width: `${n}%`, height: '100%', background: col }} />
                              </div>
                            )}
                          </td>
                        );
                      }
                      return <td key={c.k} style={{ padding: '0.6rem', lineHeight: 1.5 }}>{v || '—'}</td>;
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      };

      /* ==================== References Tab ==================== */
      // Two sections now:
      //   1. The grounded evidence pack that was fed to Claude — with per-source
      //      access-level badges (full-text / abstract / metadata-only).
      //   2. The raw URLs Claude's narrative emitted — parsed from its text.
      const RefsTab = ({ references, evidencePack, evidenceSummary }) => {
        const pubmedRefs = references.filter(r => r.url.includes('pubmed') || r.url.includes('doi.org'));
        const trialRefs = references.filter(r => r.url.includes('clinicaltrials.gov'));
        const otherRefs = references.filter(r => !pubmedRefs.includes(r) && !trialRefs.includes(r));
        const Section = ({ title, items }) => items.length === 0 ? null : (
          <div style={{ marginBottom: '1.25rem' }}>
            <h3 style={{ color: theme.accent, fontSize: '1rem', marginBottom: '0.5rem' }}>{title} ({items.length})</h3>
            <div style={{ display: 'grid', gap: '0.5rem' }}>
              {items.map((r, i) => (
                <div key={i} style={{
                  padding: '0.6rem 0.75rem', background: theme.panel,
                  borderRadius: 8, border: `1px solid ${theme.border}`
                }}>
                  <a href={r.url} target="_blank" rel="noopener"
                    style={{ fontSize: '0.88rem', wordBreak: 'break-all' }}>
                    {r.url}
                  </a>
                  {r.quote && <div style={{ fontSize: '0.85rem', fontStyle: 'italic', marginTop: '0.3rem', color: theme.textDim }}>
                    “{r.quote}”
                  </div>}
                </div>
              ))}
            </div>
          </div>
        );
        return (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
            <div style={panelStyle}>
              <h2 style={{ margin: 0, color: theme.accent, display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <Book size={22} /> References & Evidence Pack
              </h2>
              <p style={{ color: theme.textDim, fontSize: '0.9rem' }}>
                Every source the AI was allowed to cite, with an honest badge showing how much of
                each paper was actually read. Many high-impact medical journals are paywalled — we
                legally pull whatever is available (full text for open-access papers; abstracts for
                everything else) and the AI is prohibited from overreaching past what it saw.
              </p>
              {evidenceSummary?.accessBreakdown && (
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem', marginTop: '0.75rem' }}>
                  <AccessBadge level="full-text"     n={evidenceSummary.accessBreakdown['full-text']} />
                  <AccessBadge level="abstract"      n={evidenceSummary.accessBreakdown['abstract']} />
                  <AccessBadge level="metadata-only" n={evidenceSummary.accessBreakdown['metadata-only']} />
                </div>
              )}
            </div>

            {evidencePack && evidencePack.length > 0 && (
              <div style={panelStyle}>
                <h3 style={{ marginTop: 0, color: theme.accent, fontSize: '1rem' }}>
                  Grounded evidence pack ({evidencePack.length} sources)
                </h3>
                <div style={{ display: 'grid', gap: '0.5rem' }}>
                  {evidencePack.slice(0, 40).map((p, i) => {
                    const url = p.pmcUrl || p.pubmedUrl || p.doiUrl || p.oaUrl || p.landingUrl || p.europePmcUrl;
                    const excerpt = (p.fullText || p.abstract || '').slice(0, 260);
                    return (
                      <div key={i} style={{
                        padding: '0.75rem', background: theme.panel,
                        borderRadius: 8, border: `1px solid ${theme.border}`
                      }}>
                        <div style={{ display: 'flex', gap: '0.4rem', flexWrap: 'wrap', alignItems: 'center' }}>
                          {p.isCuratedKB && <KBBadge category={p.category} />}
                          <AccessBadge level={p.accessLevel || 'metadata-only'} />
                          {p.journalTier && (
                            <span style={{
                              fontSize: '0.7rem', padding: '0.15rem 0.5rem',
                              borderRadius: 4, background: theme.accentSoft,
                              color: theme.accent, fontWeight: 600
                            }}>Tier {p.journalTier}</span>
                          )}
                          <CountryBadge country={p.firstAuthorCountry} />
                          {(p.qualityFlags || [])
                            .filter((f) => f.key !== 'top-tier-journal' && f.key !== 'curated-kb')
                            .slice(0, 4)
                            .map((f, idx) => <QualityFlagBadge key={idx} flag={f} />)}
                          {(p.sources || []).map((s) => (
                            <span key={s} style={{
                              fontSize: '0.7rem', padding: '0.15rem 0.5rem',
                              borderRadius: 4, background: theme.panel,
                              color: theme.textDim
                            }}>{s}</span>
                          ))}
                          {p.unpaywall && (
                            <span title={`Legal OA copy via Unpaywall (${p.unpaywall.oaStatus}, ${p.unpaywall.version})`} style={{
                              fontSize: '0.7rem', padding: '0.15rem 0.5rem',
                              borderRadius: 4, background: 'rgba(110, 231, 183, 0.15)',
                              color: theme.green, fontWeight: 600
                            }}>OA via Unpaywall</span>
                          )}
                        </div>
                        <div style={{ fontWeight: 600, marginTop: '0.4rem', fontSize: '0.92rem' }}>
                          {p.title || '(untitled)'}
                        </div>
                        <div style={{ fontSize: '0.78rem', color: theme.textDim, marginTop: 2 }}>
                          {p.journal || 'Unknown journal'}{p.year ? ` · ${p.year}` : ''}
                          {typeof p.citedByCount === 'number' ? ` · cited ${p.citedByCount}×` : ''}
                          {p.authorLine ? ` · ${p.authorLine}` : ''}
                        </div>
                        {excerpt && (
                          <div style={{
                            fontSize: '0.82rem', color: theme.text, marginTop: '0.4rem',
                            fontStyle: 'italic', lineHeight: 1.5
                          }}>
                            “{excerpt}{(p.fullText || p.abstract || '').length > 260 ? '…' : ''}”
                          </div>
                        )}
                        {url && (
                          <div style={{ marginTop: '0.4rem' }}>
                            <a href={url} target="_blank" rel="noopener"
                               style={{ fontSize: '0.82rem', wordBreak: 'break-all' }}>
                              {url}
                            </a>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            <div style={panelStyle}>
              <h3 style={{ marginTop: 0, color: theme.accent, fontSize: '1rem' }}>
                URLs extracted from AI narrative
              </h3>
              <p style={{ color: theme.textDim, fontSize: '0.85rem', marginTop: 0 }}>
                Every URL the AI emitted across all tabs, deduplicated. If one 404s, that is a red
                flag — the Cross-AI Audit panel also independently re-checks these links.
              </p>
              {references.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '1.5rem', color: theme.textDim }}>
                  No references yet. Run any research tab to populate this.
                </div>
              ) : (
                <div style={{ marginTop: '0.75rem' }}>
                  <Section title="PubMed / DOI" items={pubmedRefs} />
                  <Section title="ClinicalTrials.gov" items={trialRefs} />
                  <Section title="Other" items={otherRefs} />
                </div>
              )}
            </div>
          </div>
        );
      };

      /* ==================== Footer ==================== */
      const Footer = () => (
        <footer style={{
          maxWidth: 1400, margin: '0 auto', padding: '1.5rem 2rem 2.5rem',
          color: theme.textDim, fontSize: '0.78rem'
        }}>
          <div style={{ borderTop: `1px solid ${theme.border}`, paddingTop: '1rem', lineHeight: 1.65 }}>
            <div style={{ marginBottom: '0.6rem' }}>
              <strong>Medical decision-support research only.</strong> This tool is not medical advice
              and does not create a doctor-patient relationship. All recommendations require review
              by a licensed physician before any treatment decision is made. This prototype is not
              HIPAA-compliant — do not enter personally identifying information.
            </div>
            <div style={{ color: theme.textDim, opacity: 0.85 }}>
              <strong>Evidence sources:</strong> ClinicalTrials.gov v2 · NCBI PubMed · Europe PMC ·
              OpenAlex · openFDA · Unpaywall · Cochrane Library · curated knowledge base.
              <br />
              <strong>AI layer:</strong> Anthropic Claude Sonnet generates analysis. Cross-AI audit by
              Perplexity, OpenAI, or xAI independently re-checks every claim against the same
              evidence pack (when configured).
            </div>
          </div>
        </footer>
      );

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
