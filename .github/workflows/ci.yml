name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-suites:
    name: Offline regression + condition matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Mandatory release audit
        run: npm run assurance:all

      - name: Email owner on failure
        if: failure()
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[CI FAILED] ${{ github.repository }} on ${{ github.ref_name }} (${{ github.event_name }})"
          to: shaque025@gmail.com
          from: Medical Research Tool CI <${{ secrets.SMTP_USERNAME }}>
          body: |
            A CI run failed and requires your attention.

            Repository: ${{ github.repository }}
            Branch / ref: ${{ github.ref_name }}
            Trigger: ${{ github.event_name }}
            Commit: ${{ github.sha }}
            Failed job: ${{ github.job }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The mandatory release audit exited non-zero. Open the run above to
            see which security, medical-integrity, data, or parser invariant
            regressed.

  live-links:
    name: Scheduled live citation audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit live curated citations
        run: npm run regression:links

  production-smoke:
    name: Production containment smoke
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: offline-suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release configuration
        env:
          MRT_BASE_URL: ${{ vars.PRODUCTION_URL }}
          MRT_EXPECTED_SHA: ${{ github.sha }}
          MRT_ACCESS_PASSCODE: ${{ secrets.MRT_SMOKE_ACCESS_PASSCODE }}
          MRT_REVIEWER_TOKEN: ${{ secrets.MRT_REVIEWER_TOKEN }}
          MRT_REPORT_SEAL_SECRET: ${{ secrets.MRT_REPORT_SEAL_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_EMAIL_FROM: ${{ vars.ALERTS_EMAIL_FROM }}
          ALERTS_PUBLIC_URL: ${{ vars.ALERTS_PUBLIC_URL }}
          ALERTS_MONITOR_WEBHOOK_URL: ${{ secrets.ALERTS_MONITOR_WEBHOOK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npm run audit:release-config

      - name: Verify reviewed SHA and deployed controls
        env:
          MRT_BASE_URL: ${{ vars.PRODUCTION_URL }}
          MRT_EXPECTED_SHA: ${{ github.sha }}
          MRT_ACCESS_PASSCODE: ${{ secrets.MRT_SMOKE_ACCESS_PASSCODE }}
        run: npm run smoke:postdeploy
