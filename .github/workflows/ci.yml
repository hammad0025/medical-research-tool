name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-suites:
    name: Offline regression + condition matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Platform robustness regression
        run: node scripts/regression-platform.mjs

      - name: Condition matrix invariants (offline)
        run: node scripts/condition-matrix.mjs

      - name: Email owner on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[CI FAILED] ${{ github.repository }} on ${{ github.ref_name }} (${{ github.event_name }})"
          to: shaque025@gmail.com
          from: Medical Research Tool CI <${{ secrets.SMTP_USERNAME }}>
          body: |
            A CI run failed and requires your attention.

            Repository: ${{ github.repository }}
            Branch / ref: ${{ github.ref_name }}
            Trigger: ${{ github.event_name }}
            Commit: ${{ github.sha }}
            Failed job: ${{ github.job }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            One of the offline suites (scripts/regression-platform.mjs or
            scripts/condition-matrix.mjs) exited non-zero. Open the run above
            to see which step failed and the invariant that regressed.
